components:
    schemas:
        FileMetadata:
            type: object
            description: System-managed string metadata attached to a file resource.
            additionalProperties:
                type: string
        FileApiError:
            description: Standard error response shape for file API endpoints.
            # Why: file handlers use the same public protocol tuple as other direct-error endpoints;
            # reusing Error prevents their cause/type/fix/url fields from drifting independently.
            allOf:
                - $ref: './common.yml#/components/schemas/Error'
        CreateFileRequest:
            type: object
            additionalProperties: false
            required:
                - file
                - purpose
            properties:
                file:
                    type: string
                    format: binary
                    description: Binary file part to store.
                purpose:
                    type: string
                    description: File purpose policy to apply.
                    example: product_image
                title:
                    type: string
                    description: Optional display title for the file.
                    example: Hero product image
                custom_data:
                    type: string
                    description: JSON object encoded as a string. Values must be strings.
                    example: '{"product_id":"prod_123"}'
        LookupFileRequest:
            type: object
            additionalProperties: false
            required:
                - file_id
            properties:
                file_id:
                    type: string
                    example: file_2xC7k9gK5yQnZ4w8P1sT6vR3
        PageFilesRequest:
            type: object
            additionalProperties: false
            x-simile-constraints:
                - ordered:
                      paths: [/created_after, /created_before]
            properties:
                purpose:
                    type: string
                    example: product_image
                status:
                    type: string
                    enum: [uploading, processing, available, failed, deleted]
                    example: available
                page_number:
                    type: integer
                    minimum: 1
                    example: 1
                page_size:
                    type: integer
                    minimum: 1
                    example: 25
                created_after:
                    type: string
                    format: date-time
                created_before:
                    type: string
                    format: date-time
        FileContentsRequest:
            type: object
            additionalProperties: false
            required:
                - file_id
            properties:
                file_id:
                    type: string
                    example: file_2xC7k9gK5yQnZ4w8P1sT6vR3
                disposition:
                    type: string
                    enum: [attachment, inline]
                    default: attachment
                delivery:
                    type: string
                    enum: [stream, redirect]
                    default: stream
        DeleteFileRequest:
            type: object
            additionalProperties: false
            required:
                - file_id
            properties:
                file_id:
                    type: string
                    example: file_2xC7k9gK5yQnZ4w8P1sT6vR3
        FileResponse:
            type: object
            additionalProperties: false
            required: [file]
            properties:
                file:
                    $ref: '#/components/schemas/FileObject'
        FilePageResponse:
            type: object
            additionalProperties: false
            required: [page]
            properties:
                page:
                    $ref: '#/components/schemas/FilePage'
        FilePage:
            type: object
            additionalProperties: false
            required:
                - number
                - size
                - files
            # The response reports actual files returned, not the requested limit.
            x-simile-constraints:
                - aggregate:
                      target: /size
                      operation: count
                      source: /files/*
            properties:
                number:
                    type: integer
                    example: 1
                size:
                    type: integer
                    example: 1
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/FileObject'
        FileObject:
            type: object
            additionalProperties: false
            description: Public file metadata. Storage provider details, object keys, and idempotency internals are not exposed.
            required:
                - id
                - purpose
                - status
                - scan_status
                - content_type
                - size
                - checksum_sha256
                - created_by
                - source
                - storage
                - created_at
                - updated_at
            properties:
                id:
                    type: string
                    # Public serializers always emit this resource with the file_ type prefix.
                    pattern: '^file_'
                    example: file_2xC7k9gK5yQnZ4w8P1sT6vR3
                purpose:
                    type: string
                    example: product_image
                status:
                    type: string
                    enum: [uploading, processing, available, failed, deleted]
                scan_status:
                    type: string
                    enum: [pending, passed, failed, skipped]
                name:
                    type: string
                    example: Hero image
                filename:
                    type: string
                    example: hero.png
                content_type:
                    type: string
                    example: image/png
                size:
                    type: integer
                    format: int64
                    description: Original byte size.
                    example: 384221
                checksum_sha256:
                    type: string
                    example: 02c26c6e49b2c332c8fb95d9f6a7c4f2d9e3f1f5a63f0b1a9d2a0ba
                created_by:
                    $ref: '#/components/schemas/FileActor'
                source:
                    $ref: '#/components/schemas/FileSource'
                media:
                    $ref: '#/components/schemas/FileMedia'
                storage:
                    $ref: '#/components/schemas/PublicFileStorage'
                delivery:
                    $ref: '#/components/schemas/FileDelivery'
                latest_error:
                    $ref: '#/components/schemas/FileLatestError'
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                metadata:
                    $ref: '#/components/schemas/FileMetadata'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                available_at:
                    type: string
                    format: date-time
                expires_at:
                    type: string
                    format: date-time
        FileUploadReceipt:
            type: object
            additionalProperties: false
            required: [content_type, created_at, id, size, status]
            properties:
                content_type:
                    type: string
                created_at:
                    type: string
                    format: date-time
                filename:
                    type: string
                id:
                    type: string
                    # Public serializers always emit this resource with the file_ type prefix.
                    pattern: '^file_'
                name:
                    type: string
                size:
                    type: integer
                    format: int64
                    minimum: 0
                status:
                    type: string
                    enum: [uploading, processing, available, failed, deleted]
        FileActor:
            type: object
            additionalProperties: false
            required: [type]
            properties:
                type:
                    type: string
                    example: api_key
                id:
                    type: string
                name:
                    type: string
                email:
                    type: string
                    format: email
        FileSource:
            type: object
            additionalProperties: false
            properties:
                type:
                    type: string
                    enum: [direct, upload_request, service]
                    example: direct
                service:
                    type: string
                upload_request_id:
                    type: string
                    # Public serializers always emit this resource with the uplreq_ type prefix.
                    pattern: '^uplreq_'
        FileMedia:
            type: object
            additionalProperties: false
            properties:
                kind:
                    type: string
                    example: image
                width:
                    type: integer
                    format: int64
                height:
                    type: integer
                    format: int64
                duration_ms:
                    type: integer
                    format: int64
                page_count:
                    type: integer
                    format: int64
                frame_count:
                    type: integer
                    format: int64
                color_space:
                    type: string
                has_alpha:
                    type: boolean
                codec:
                    type: string
                aspect_ratio:
                    type: string
        PublicFileStorage:
            type: object
            additionalProperties: false
            required:
                - encoding
                - stored_size
            properties:
                encoding:
                    type: string
                    enum: [identity, br]
                    description: Encoding of the stored representation.
                stored_size:
                    type: integer
                    format: int64
                    description: Stored byte size after any lossless encoding.
        FileDelivery:
            type: object
            additionalProperties: false
            description: Purpose-authorized public delivery metadata for browser-rendered assets. Callers should store file IDs as canonical references and treat these URLs as render URLs.
            properties:
                public_url:
                    type: string
                    format: uri
                    description: Unsigned CDN URL for public-safe assets such as product images.
                    example: https://assets.inttegro.com/public/assets/file_2xC7k9gK5yQnZ4w8P1sT6vR3/original
                cache_control:
                    type: string
                    example: public, max-age=31536000, immutable
                content_type:
                    type: string
                    example: image/png
        FileLatestError:
            type: object
            additionalProperties: false
            properties:
                code:
                    type: string
                message:
                    type: string
                retryable:
                    type: boolean
                at:
                    type: string
                    format: date-time
        CreateFileLinkRequest:
            type: object
            additionalProperties: false
            required:
                - file_id
            properties:
                file_id:
                    type: string
                    example: file_2xC7k9gK5yQnZ4w8P1sT6vR3
                delivery:
                    $ref: '#/components/schemas/FileLinkDelivery'
                access:
                    $ref: '#/components/schemas/FileLinkAccessRequest'
                created_by:
                    $ref: '#/components/schemas/FileActorInput'
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                expires_at:
                    type: string
                    format: date-time
        LookupFileLinkRequest:
            type: object
            additionalProperties: false
            required:
                - id
            properties:
                id:
                    type: string
                    example: flink_8pQz3LkY6mN2vT9sB4cD1eF0
        PageFileLinksRequest:
            type: object
            additionalProperties: false
            properties:
                file_id:
                    type: string
                status:
                    type: string
                    enum: [active, revoked, expired, disabled]
                page_number:
                    type: integer
                    minimum: 1
                page_size:
                    type: integer
                    minimum: 1
        RevokeFileLinkRequest:
            type: object
            additionalProperties: false
            required:
                - id
            properties:
                id:
                    type: string
                revoked_by:
                    $ref: '#/components/schemas/FileActorInput'
        CreateFileLinkResponse:
            type: object
            additionalProperties: false
            required: [file_link, url]
            properties:
                file_link:
                    $ref: '#/components/schemas/FileLinkObject'
                url:
                    type: string
                    format: uri
                    description: Public capability URL. Treat as bearer-secret material.
        FileLinkResponse:
            type: object
            additionalProperties: false
            required: [file_link]
            properties:
                file_link:
                    $ref: '#/components/schemas/FileLinkObject'
        FileLinkPageResponse:
            type: object
            additionalProperties: false
            required: [page]
            properties:
                page:
                    $ref: '#/components/schemas/FileLinkPage'
        FileLinkPage:
            type: object
            additionalProperties: false
            required: [file_links, number, size]
            # A client must not observe a size that disagrees with the link payload.
            x-simile-constraints:
                - aggregate:
                      target: /size
                      operation: count
                      source: /file_links/*
            properties:
                number:
                    type: integer
                size:
                    type: integer
                file_links:
                    type: array
                    items:
                        $ref: '#/components/schemas/FileLinkObject'
        FileLinkObject:
            type: object
            additionalProperties: false
            description: Public file link metadata. Token hashes and provider URLs are not exposed.
            required: [access, active, created_at, created_by, delivery, expires_at, file_id, id, kind, purpose, status, updated_at]
            # A capability link must not look usable after its public lifecycle says otherwise.
            x-simile-constraints:
                - ordered:
                      paths: [/created_at, /updated_at]
                - ordered:
                      paths: [/created_at, /expires_at]
                - ordered:
                      paths: [/created_at, /revoked_at]
                - implies:
                      when: { path: /status, equals: active }
                      then:
                          all:
                              - { path: /active, equals: true }
                              - { path: /revoked_at, state: absent }
                - implies:
                      when: { path: /status, equals: revoked }
                      then:
                          all:
                              - { path: /active, equals: false }
                              - { path: /revoked_at, state: non-null }
                - implies:
                      when: { path: /status, equals: expired }
                      then:
                          all:
                              - { path: /active, equals: false }
                - implies:
                      when: { path: /status, equals: disabled }
                      then:
                          all:
                              - { path: /active, equals: false }
            properties:
                id:
                    type: string
                    # Public serializers always emit this resource with the flink_ type prefix.
                    pattern: '^flink_'
                kind:
                    type: string
                    enum: [public]
                file_id:
                    type: string
                    # Public serializers always emit this resource with the file_ type prefix.
                    pattern: '^file_'
                purpose:
                    type: string
                status:
                    type: string
                    enum: [active, revoked, expired, disabled]
                active:
                    type: boolean
                delivery:
                    $ref: '#/components/schemas/FileLinkDelivery'
                access:
                    $ref: '#/components/schemas/FileLinkAccess'
                created_by:
                    $ref: '#/components/schemas/FileLinkActor'
                revoked_by:
                    $ref: '#/components/schemas/FileLinkActor'
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                metadata:
                    $ref: '#/components/schemas/FileMetadata'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                expires_at:
                    type: string
                    format: date-time
                revoked_at:
                    type: string
                    format: date-time
        FileLinkActor:
            type: object
            additionalProperties: false
            required: [type]
            properties:
                email:
                    type: string
                    format: email
                id:
                    type: string
                name:
                    type: string
                type:
                    type: string
        FileActorInput:
            type: object
            additionalProperties: false
            properties:
                email:
                    type: string
                id:
                    type: string
                name:
                    type: string
                type:
                    type: string
        FileLinkDelivery:
            type: object
            additionalProperties: false
            properties:
                mode:
                    type: string
                    enum: [redirect, download, inline]
                    default: download
                filename:
                    type: string
                content_type:
                    type: string
                disposition:
                    type: string
        FileLinkAccessRequest:
            type: object
            additionalProperties: false
            properties:
                max_accesses:
                    type: integer
                    format: int64
                allow_download:
                    type: boolean
                allowed_origins:
                    type: array
                    items:
                        type: string
                allowed_ip_ranges:
                    type: array
                    items:
                        type: string
        FileLinkAccess:
            type: object
            additionalProperties: false
            x-simile-constraints:
                - ordered:
                      paths: [/access_count, /max_accesses]
            properties:
                max_accesses:
                    type: integer
                    format: int64
                access_count:
                    type: integer
                    format: int64
                last_accessed_at:
                    type: string
                    format: date-time
                allow_download:
                    type: boolean
                allowed_origins:
                    type: array
                    items:
                        type: string
        CreateUploadRequestRequest:
            type: object
            additionalProperties: false
            required:
                - purpose
            properties:
                purpose:
                    type: string
                    example: support_document
                constraints:
                    $ref: '#/components/schemas/UploadRequestConstraints'
                display:
                    $ref: '#/components/schemas/UploadRequestDisplay'
                subject:
                    $ref: '#/components/schemas/FileParty'
                recipient:
                    $ref: '#/components/schemas/FileParty'
                resource:
                    $ref: '#/components/schemas/FileResource'
                requester:
                    $ref: '#/components/schemas/FileActorInput'
                attempts:
                    $ref: '#/components/schemas/UploadRequestAttemptsRequest'
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                expires_at:
                    type: string
                    format: date-time
        LookupUploadRequestRequest:
            type: object
            additionalProperties: false
            required:
                - id
            properties:
                id:
                    type: string
                    example: uplreq_1gK9pQ4vL8mN2sT5wX7yZ0
        PageUploadRequestsRequest:
            type: object
            additionalProperties: false
            properties:
                purpose:
                    type: string
                status:
                    type: string
                    enum: [pending, uploading, fulfilled, expired, canceled, failed]
                resource:
                    $ref: '#/components/schemas/FileResource'
                page_number:
                    type: integer
                    minimum: 1
                page_size:
                    type: integer
                    minimum: 1
        CancelUploadRequestRequest:
            type: object
            additionalProperties: false
            required:
                - id
            properties:
                id:
                    type: string
                canceled_by:
                    $ref: '#/components/schemas/FileActorInput'
        FulfillUploadRequestRequest:
            type: object
            additionalProperties: false
            required:
                - file
            properties:
                file:
                    type: string
                    format: binary
        ReviewUploadRequestAttemptRequest:
            oneOf:
                - $ref: '#/components/schemas/ReviewUploadRequestAttemptByIDRequest'
                - $ref: '#/components/schemas/ReviewUploadRequestAttemptByOrdinalRequest'
        ReviewUploadRequestAttemptByIDRequest:
            type: object
            required: [attempt_id, decision, id]
            additionalProperties: false
            properties:
                attempt_id:
                    type: string
                    minLength: 1
                decision:
                    type: string
                    enum: [approved, rejected]
                id:
                    type: string
                    minLength: 1
                public_message:
                    type: string
                reasons:
                    type: array
                    items:
                        $ref: '#/components/schemas/UploadRequestReviewReasonInput'
        ReviewUploadRequestAttemptByOrdinalRequest:
            type: object
            required: [attempt_ordinal, decision, id]
            additionalProperties: false
            properties:
                attempt_ordinal:
                    type: integer
                    format: int64
                    minimum: 1
                decision:
                    type: string
                    enum: [approved, rejected]
                id:
                    type: string
                    minLength: 1
                public_message:
                    type: string
                reasons:
                    type: array
                    items:
                        $ref: '#/components/schemas/UploadRequestReviewReasonInput'
        UploadRequestReviewReasonInput:
            type: object
            required: [code, message]
            additionalProperties: false
            properties:
                code:
                    type: string
                    minLength: 1
                message:
                    type: string
                    minLength: 1
                param:
                    type: string
        UploadRequestResponse:
            type: object
            additionalProperties: false
            required: [upload_request]
            properties:
                upload_request:
                    $ref: '#/components/schemas/UploadRequestObject'
        UploadRequestWithAttemptResponse:
            type: object
            additionalProperties: false
            required: [upload_request]
            properties:
                upload_request:
                    $ref: '#/components/schemas/UploadRequestWithAttemptObject'
        UploadRequestPageResponse:
            type: object
            additionalProperties: false
            required: [page]
            properties:
                page:
                    $ref: '#/components/schemas/UploadRequestPage'
        UploadRequestPage:
            type: object
            additionalProperties: false
            required: [number, size, upload_requests]
            # Octo derives size from the selected upload-request slice.
            x-simile-constraints:
                - aggregate:
                      target: /size
                      operation: count
                      source: /upload_requests/*
            properties:
                number:
                    type: integer
                size:
                    type: integer
                upload_requests:
                    type: array
                    items:
                        $ref: '#/components/schemas/UploadRequestObject'
        FulfillUploadRequestResponse:
            type: object
            additionalProperties: false
            required: [file, upload_request]
            properties:
                upload_request:
                    $ref: '#/components/schemas/UploadRequestWithAttemptObject'
                file:
                    $ref: '#/components/schemas/FileUploadReceipt'
        UploadRequestValidationErrorResponse:
            type: object
            additionalProperties: false
            required: [error, upload_request]
            properties:
                upload_request:
                    $ref: '#/components/schemas/UploadRequestWithAttemptObject'
                error:
                    type: object
                    additionalProperties: false
                    required:
                        - code
                        - message
                        - retryable
                    properties:
                        code:
                            type: string
                        param:
                            type: string
                        message:
                            type: string
                        retryable:
                            type: boolean
        UploadRequestObject:
            type: object
            additionalProperties: false
            description: Public upload request metadata. Token hashes are not exposed.
            required: [active, attempts, constraints, created_at, display, expires_at, id, purpose, recipient, requester, resource, status, subject, updated_at]
            # Status, activity, terminal timestamps, and the resulting file must describe one lifecycle.
            x-simile-constraints:
                - ordered:
                      paths: [/created_at, /updated_at]
                - ordered:
                      paths: [/created_at, /expires_at]
                - ordered:
                      paths: [/created_at, /uploading_at, /fulfilled_at, /updated_at]
                - ordered:
                      paths: [/created_at, /expired_at, /updated_at]
                - ordered:
                      paths: [/created_at, /canceled_at, /updated_at]
                - implies:
                      when: { path: /status, equals: pending }
                      then:
                          all:
                              - { path: /active, equals: true }
                              - { path: /fulfilled_at, state: absent }
                              - { path: /expired_at, state: absent }
                              - { path: /canceled_at, state: absent }
                - implies:
                      when: { path: /status, equals: uploading }
                      then:
                          all:
                              - { path: /active, equals: true }
                              - { path: /uploading_at, state: non-null }
                              - { path: /fulfilled_at, state: absent }
                              - { path: /expired_at, state: absent }
                              - { path: /canceled_at, state: absent }
                - implies:
                      when: { path: /status, equals: fulfilled }
                      then:
                          all:
                              - { path: /active, equals: false }
                              - { path: /file_id, state: non-null }
                              - { path: /fulfilled_at, state: non-null }
                              - { path: /expired_at, state: absent }
                              - { path: /canceled_at, state: absent }
                - implies:
                      when: { path: /status, equals: expired }
                      then:
                          all:
                              - { path: /active, equals: false }
                              - { path: /fulfilled_at, state: absent }
                              - { path: /expired_at, state: non-null }
                              - { path: /canceled_at, state: absent }
                - implies:
                      when: { path: /status, equals: canceled }
                      then:
                          all:
                              - { path: /active, equals: false }
                              - { path: /fulfilled_at, state: absent }
                              - { path: /expired_at, state: absent }
                              - { path: /canceled_at, state: non-null }
                - implies:
                      when: { path: /status, equals: failed }
                      then:
                          all:
                              - { path: /active, equals: false }
                              - { path: /fulfilled_at, state: absent }
                              - { path: /expired_at, state: absent }
                              - { path: /canceled_at, state: absent }
            properties:
                id:
                    type: string
                    # Public serializers always emit this resource with the uplreq_ type prefix.
                    pattern: '^uplreq_'
                purpose:
                    type: string
                status:
                    type: string
                    enum: [pending, uploading, fulfilled, expired, canceled, failed]
                active:
                    type: boolean
                file_id:
                    type: string
                    # Public serializers always emit this resource with the file_ type prefix.
                    pattern: '^file_'
                upload_url:
                    type: string
                    format: uri
                    description: Public capability URL returned when available. Treat as bearer-secret material.
                constraints:
                    $ref: '#/components/schemas/UploadRequestConstraints'
                display:
                    $ref: '#/components/schemas/UploadRequestDisplay'
                subject:
                    $ref: '#/components/schemas/FileParty'
                recipient:
                    $ref: '#/components/schemas/FileParty'
                resource:
                    $ref: '#/components/schemas/FileResource'
                requester:
                    $ref: '#/components/schemas/UploadRequestActor'
                attempts:
                    $ref: '#/components/schemas/UploadRequestAttempts'
                latest_error:
                    $ref: '#/components/schemas/UploadRequestLatestError'
                canceled_by:
                    $ref: '#/components/schemas/UploadRequestActor'
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                metadata:
                    $ref: '#/components/schemas/FileMetadata'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                expires_at:
                    type: string
                    format: date-time
                uploading_at:
                    type: string
                    format: date-time
                fulfilled_at:
                    type: string
                    format: date-time
                expired_at:
                    type: string
                    format: date-time
                canceled_at:
                    type: string
                    format: date-time
        UploadRequestWithAttemptObject:
            allOf:
                - $ref: '#/components/schemas/UploadRequestObject'
                - type: object
                  properties:
                      attempt:
                          $ref: '#/components/schemas/UploadRequestAttempt'
        UploadRequestConstraints:
            type: object
