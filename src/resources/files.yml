# Authoritative files resource contract.
# Why: keeping each resource's operations and schemas together makes public invariants
# reviewable without weakening the single bundled contract distributed to consumers.

paths:
    /files/create:
        post:
            summary: Create a file
            description: |
                Upload a file to Inttegro for the authorized application. The request must be multipart form data and include a binary `file` part plus a `purpose`.
            operationId: createFile
            tags:
                - Files
            parameters:
                - $ref: './common.yml#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/CreateFileRequest'
            responses:
                '200':
                    description: File created successfully
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FileResponse'
