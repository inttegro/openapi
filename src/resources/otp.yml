                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [service_unavailable] }, code: { enum: [otp_lookup_failed] }, fix_code: { enum: [repeat_same_request] }, type: { enum: [transient_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
components:
    schemas:
        InitiateOTPRequest:
            type: object
            required: [purpose, recipient, service_name, token_size]
            additionalProperties: false
            allOf:
                - not:
                      required: [token_alphabet, token_alphabet_type]
                      properties:
                          token_alphabet: {}
                          token_alphabet_type: {}
            properties:
                async_delivery:
                    type: boolean
                    description: Return after accepting the transaction while delivery continues asynchronously.
                    default: false
                message_template:
                    type: string
                    description: SMS body or email copy containing the required `{token}` placeholder and optional `{service}` placeholder. Email templates must contain `{token}` exactly once. A custom template replaces the purpose-specific default body, while `purpose` still controls the email subject and heading. Email sends this as the plain-text fallback and renders the copy around a prominent code in the HTML version. Defaults are transport-specific.
                    example: "Your {service} code is {token}."
                purpose:
                    $ref: '#/components/schemas/OTPPurpose'
                recipient:
                    type: string
                    description: Phone number in international format (E.164) or bare email address. Transport is inferred from the address unless specified.
                    example: "+233241234567"
                sender:
                    type: string
                    description: Optional SMS sender identifier (3-12 characters). Email OTP always uses `{service_name} <noreply@inttegro.com>`; omit this field for email or supply exactly the bare `noreply@inttegro.com` address.
                    example: "Acme"
                service_name:
                    type: string
                    description: Service name substituted for `{service}` (2-20 characters).
                    minLength: 2
                    maxLength: 20
                    example: "Acme Bank"
                token_alphabet:
                    type: string
                    description: Custom alphabet for token generation (mutually exclusive with token_alphabet_type)
                    example: "0123456789ABCDEF"
                token_alphabet_type:
                    type: string
                    description: Predefined alphabet type (mutually exclusive with token_alphabet)
                    enum: [numeric, alpha, alphanumeric]
                    example: "numeric"
                token_size:
                    type: integer
                    description: Length of generated token (5-10 characters)
                    minimum: 5
                    maximum: 10
                    example: 6
                transport:
                    type: string
                    description: Optional delivery transport. When omitted, an email address selects email and a phone number selects SMS.
                    enum: [sms, email]
                validity_duration_in_minutes:
                    type: integer
                    description: How long the token remains valid (3-10080 minutes)
                    minimum: 3
                    maximum: 10080
                    example: 10
        InitiateOTPResponse:
            type: object
            additionalProperties: false
            required: [transaction]
            properties:
                transaction:
                    $ref: '#/components/schemas/OTPTransaction'
        VerifyOTPRequest:
            type: object
            required: [recipient, token, transaction_id]
            additionalProperties: false
            properties:
                transaction_id:
                    type: string
                    # Why: the response always returns a typed OTP transaction ID, so accepting arbitrary
                    # strings here would make the request-to-response identity relation impossible to prove.
                    pattern: '^ot_'
                    description: ID of the OTP transaction to verify (with ot_ prefix)
                    example: "ot_3f8a9c7e2d1b4a6f"
                recipient:
                    type: string
                    description: Phone number or bare email address that received the OTP; must match the stored transaction transport.
                    example: "+233241234567"
                token:
                    type: string
                    description: OTP token submitted by the user
                    example: "847293"
        VerifyOTPResponse:
            type: object
            additionalProperties: false
            required: [transaction, verification_attempt]
            properties:
                transaction:
                    $ref: '#/components/schemas/OTPTransaction'
                verification_attempt:
                    $ref: '#/components/schemas/OTPVerificationAttempt'
        LookupOTPRequest:
            type: object
            required: [transaction_id]
            additionalProperties: false
            properties:
                transaction_id:
                    type: string
                    # Why: lookup success echoes a typed OTP transaction ID; constrain the selector to that public type.
                    pattern: '^ot_'
                    description: ID of the OTP transaction to lookup (with ot_ prefix)
                    example: "ot_3f8a9c7e2d1b4a6f"
        LookupOTPResponse:
            type: object
            additionalProperties: false
            required: [transaction]
            properties:
                transaction:
                    $ref: '#/components/schemas/OTPTransaction'
        OTPPurpose:
            type: string
            description: Customer action protected by the OTP. Controls safe, purpose-specific default email copy. Unknown values are rejected; use `unspecified` explicitly for a general verification request.
            enum: [account_creation, account_recovery, email_verification, financial_account_verification, password_reset, payment_confirmation, payment_method_verification, payout_confirmation, phone_verification, sensitive_action, sign_in, transaction_confirmation, unspecified]
        OTPTransaction:
            type: object
            additionalProperties: false
            description: OTP transaction object returned by initiate, verify, and lookup endpoints
            required: [expires_at, full_message, id, initiated_at, status]
            # An OTP validity window must end at or after the transaction begins.
            x-simile-constraints:
                - ordered:
                      paths: [/initiated_at, /expires_at]
                # Cancellation and delivery events cannot precede initiation, and
                # the derived pending states must agree with transmission evidence.
                - ordered:
                      paths: [/initiated_at, /canceled_at]
                - ordered:
                      paths: [/initiated_at, /transmission/sent_at]
                - implies:
                      when: { path: /status, equals: canceled }
                      then:
                          all:
                              - { path: /canceled_at, state: non-null }
                - implies:
                      when: { path: /canceled_at, state: non-null }
                      then:
                          all:
                              - { path: /status, equals: canceled }
                - implies:
                      when: { path: /status, equals: pending_delivery }
                      then:
                          all:
                              - { path: /transmission, state: absent }
                              - { path: /canceled_at, state: absent }
                              - { path: /cancel_reason, state: absent }
                - implies:
                      when: { path: /status, equals: pending }
                      then:
                          all:
                              - { path: /transmission, state: non-null }
                              - { path: /transmission/sent_at, state: absent }
                              - { path: /canceled_at, state: absent }
                              - { path: /cancel_reason, state: absent }
                - implies:
                      when: { path: /status, equals: pending_verification }
                      then:
                          all:
                              - { path: /transmission, state: non-null }
                              - { path: /transmission/sent_at, state: non-null }
                              - { path: /canceled_at, state: absent }
                              - { path: /cancel_reason, state: absent }
                # Verification and expiry are terminal alternatives to cancellation;
                # cancellation metadata must not leak into either snapshot.
                - implies:
                      when: { path: /status, equals: verified }
                      then:
                          all:
                              - { path: /canceled_at, state: absent }
                              - { path: /cancel_reason, state: absent }
                - implies:
                      when: { path: /status, equals: expired }
                      then:
                          all:
                              - { path: /canceled_at, state: absent }
                              - { path: /cancel_reason, state: absent }
            properties:
                cancel_reason:
                    type: string
                    description: Omitted unless the transaction was canceled.
                canceled_at:
                    type: string
                    format: date-time
                    description: Omitted unless the transaction was canceled.
                expires_at:
                    type: string
                    format: date-time
                full_message:
                    type: string
                    description: Message text with the `{token}` placeholder preserved; no generated token is returned.
                    example: "Your Acme Bank code is {token}."
                id:
                    type: string
                    # Public serializers always emit this resource with the ot_ type prefix.
                    pattern: '^ot_'
                    description: Unique identifier with ot_ prefix
                    example: "ot_3f8a9c7e2d1b4a6f"
                initiated_at:
                    type: string
                    format: date-time
                status:
                    type: string
                    enum: [canceled, expired, pending, pending_delivery, pending_verification, verified]
                transmission:
                    $ref: '#/components/schemas/OTPTransmission'
        OTPTransmission:
            type: object
            additionalProperties: false
            required: [recipient, sender_id]
            properties:
                recipient:
                    type: string
                    example: "+233241234567"
                sender_id:
                    type: string
                    description: SMS sender identifier or approved email From address.
                    example: "Acme"
                sent_at:
                    type: string
                    format: date-time
                sent_via:
                    type: string
                    enum: [sms, email]
                status:
                    type: string
                    enum: [accepted, delivered, failed, queued, sent, submitted]
        OTPVerificationAttempt:
            type: object
            additionalProperties: false
            description: Details of a verification attempt
            required: [attempted_at, id, presented_token, recipient, result]
            properties:
                attempted_at:
                    type: string
                    format: date-time
                id:
                    type: string
                    # Public serializers always emit this resource with the ov_ type prefix.
                    pattern: '^ov_'
                    example: "ov_9e8d7c6b5a4f3e2d"
                presented_token:
                    type: string
                    description: Token submitted for this verification attempt.
                recipient:
                    type: string
                result:
                    type: object
                    additionalProperties: false
                    required: [verdict]
                    properties:
                        detail:
                            type: string
                            description: Omitted when no detail is available.
                        verdict:
                            type: string
                            enum: [fail, pass]
