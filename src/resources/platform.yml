        SecretKey:
            type: object
            description: Public secret key metadata. The bearer token is never returned by read or mutation endpoints.
            additionalProperties: false
            required:
                - id
                - token_type
                - issued_at
                - status
                - active
            # Keep key usability, status, and lifecycle timestamps from contradicting one another.
            x-simile-constraints:
                - ordered:
                      paths: [/issued_at, /updated_at]
                - ordered:
                      paths: [/issued_at, /revoked_at]
                - ordered:
                      paths: [/issued_at, /last_used_at]
                - implies:
                      when: { path: /status, equals: active }
                      then:
                          all:
                              - { path: /active, equals: true }
                              - { path: /revoked_at, state: absent }
                - implies:
                      when: { path: /status, equals: revoked }
                      then:
                          all:
                              - { path: /active, equals: false }
                              - { path: /revoked_at, state: non-null }
                - implies:
                      when: { path: /status, equals: expired }
                      then:
                          all:
                              - { path: /active, equals: false }
                              - { path: /revoked_at, state: absent }
            properties:
                id:
                    type: string
                    # Public serializers always emit this resource with the sk_ type prefix.
                    pattern: '^sk_'
                    description: Application-scoped secret key identifier.
                    example: sk_2xC7k9gK5yQnZ4w8P1sT6vR3
                label:
                    type: string
                    description: Optional human-readable label for the secret key.
                    example: Production checkout
                token_type:
                    type: string
                    enum: [bearer]
                    example: bearer
                issued_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                    description: Omitted until the label is changed.
                expires_at:
                    type: string
                    format: date-time
                    description: Omitted for keys without a fixed expiry.
                status:
                    type: string
                    enum: [active, revoked, expired]
                active:
                    type: boolean
                revoked_at:
                    type: string
                    format: date-time
                    description: Omitted until the key is revoked.
                last_used_at:
                    type: string
                    format: date-time
                    description: Most recent recorded authentication when available; otherwise omitted.
                usage_count:
                    type: integer
                    minimum: 0
                    description: Number of recorded authentications when available; omitted when zero.
        SecretKeyPage:
            type: object
            additionalProperties: false
            required:
                - number
                - size
                - count
                - total
                - has_more
                - keys
            # Why: the service normalizes capacity to 1-100, while count is both the
            # exact returned-key count and no greater than the page capacity or total.
            x-simile-constraints:
                - aggregate:
                      target: /count
                      operation: count
                      source: /keys/*
                - bounded:
                      path: /count
                      maximum: { path: /size }
                - bounded:
                      path: /count
                      maximum: { path: /total }
            properties:
                number:
                    type: integer
                    minimum: 1
                size:
                    type: integer
                    minimum: 1
                    maximum: 100
                count:
                    type: integer
                    minimum: 0
                    maximum: 100
                total:
                    type: integer
                    minimum: 0
                has_more:
                    type: boolean
                keys:
                    type: array
                    maxItems: 100
                    items:
                        $ref: '#/components/schemas/SecretKey'
        SecretKeyUsagePage:
            type: object
            additionalProperties: false
            required:
                - number
                - size
                - count
                - total
                - has_more
                - rows
            # `count` is computed after slicing the complete usage-row set.
            x-simile-constraints:
                - aggregate:
                      target: /count
                      operation: count
                      source: /rows/*
            properties:
                number:
                    type: integer
                    minimum: 1
                size:
                    type: integer
                    minimum: 0
                count:
                    type: integer
                    minimum: 0
                total:
                    type: integer
                    minimum: 0
                has_more:
                    type: boolean
                rows:
                    type: array
                    items:
                        $ref: '#/components/schemas/SecretKeyUsageRow'
        SecretKeyUsageRow:
