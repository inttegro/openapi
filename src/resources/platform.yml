    /operating_policies/update:
        post:
            summary: Create a new operating policy version
            description: |
                Creates and activates a new immutable version of an operating policy. Supply the
                current `expected_version` to prevent lost updates. This feature is available to
                selected accounts during private beta.
            operationId: updateOperatingPolicy
            tags:
                - Operating Policies
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateOperatingPolicyRequest'
            responses:
                '200':
                    description: New operating policy version activated successfully.
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OperatingPolicyResponse'
                            # Why: this operation must return a result reachable from the caller-selected resource or page.
                            x-simile-from-request:
                                bindings:
                                    - { from: /operating_policy_id, to: /operating_policy/id }
                                    # Why: bind the request-owned capability leaves independently because the
                                    # aging reference expands into a platform-owned response snapshot.
                                    - { from: /capabilities/payments/currencies, to: /operating_policy/capabilities/payments/currencies }
                                    - { from: /capabilities/payments/limits, to: /operating_policy/capabilities/payments/limits }
                                    - { from: /capabilities/payment_methods, to: /operating_policy/capabilities/payment_methods }
                                    - { from: /capabilities/payouts/enabled, to: /operating_policy/capabilities/payouts/enabled }
                                    - { from: /capabilities/payouts/limits, to: /operating_policy/capabilities/payouts/limits }
                                    - { from: /capabilities/payouts/bt_aging_spec/id, to: /operating_policy/capabilities/payouts/bt_aging_spec/id }
                                    - { from: /description, to: /operating_policy/description }
                                    - { from: /name, to: /operating_policy/name }
                                    - to: /operating_policy/version
                                      value:
                                          add:
                                              - { request: /expected_version }
                                              - { literal: 1 }
                                # Why: each public catalog ID has one canonical duration in the returned snapshot.
                                rules:
                                    - when:
                                          all:
                                              - { request: /capabilities/payouts/bt_aging_spec/id, equals: bt_aging_spec_immediate }
                                      then:
                                          set: { /operating_policy/capabilities/payouts/bt_aging_spec/t_plus: 0h }
                                    - when:
                                          all:
                                              - { request: /capabilities/payouts/bt_aging_spec/id, equals: bt_aging_spec_24_hourly }
                                      then:
                                          set: { /operating_policy/capabilities/payouts/bt_aging_spec/t_plus: 24h }
                                    - when:
                                          all:
                                              - { request: /capabilities/payouts/bt_aging_spec/id, equals: bt_aging_spec_48_hourly }
                                      then:
                                          set: { /operating_policy/capabilities/payouts/bt_aging_spec/t_plus: 48h }
                                    - when:
                                          all:
                                              - { request: /capabilities/payouts/bt_aging_spec/id, equals: bt_aging_spec_168_hourly }
                                      then:
                                          set: { /operating_policy/capabilities/payouts/bt_aging_spec/t_plus: 168h }
                            examples:
                                updated:
                                    summary: Newly activated operating-policy version
                                    value:
                                        operating_policy:
                                            active_version: 2
                                            capabilities: {}
                                            children_policy_id: cp_example
                                            children_policy_version: 1
                                            created_at: "2026-11-17T10:00:00Z"
                                            id: op_example
                                            name: Updated operating policy
                                            updated_at: "2026-11-20T10:00:00Z"
                                            version: 2
                                            version_created_at: "2026-11-20T10:00:00Z"
