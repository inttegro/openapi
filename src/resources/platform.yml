components:
    schemas:
        ApplicationCapabilityRequirement:
            type: object
            additionalProperties: false
            required: [code, description, due_at]
            properties:
                code:
                    type: string
                    pattern: '^[a-z][a-z0-9_]*$'
                    description: Stable public identifier for the requirement.
                description:
                    type: string
                    description: Public explanation of what must be completed.
                due_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Requirement deadline, or null when no deadline applies.
        ApplicationCapabilityRequirements:
            type: object
            additionalProperties: false
            required: [currently_due]
            properties:
                currently_due:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/ApplicationCapabilityRequirement'
        EnabledApplicationCapability:
            type: object
            additionalProperties: false
            required: [status, status_changed_at]
            properties:
                status:
                    type: string
                    enum: [enabled]
                status_changed_at:
                    type: string
                    format: date-time
        RestrictedApplicationCapability:
            type: object
            additionalProperties: false
            required: [status, status_reason, status_changed_at, requirements]
            properties:
                status:
                    type: string
                    enum: [restricted]
                status_reason:
                    type: string
                    enum: [setup_incomplete, account_under_review, account_restricted, account_inactive]
                status_changed_at:
                    type: string
                    format: date-time
                requirements:
                    $ref: '#/components/schemas/ApplicationCapabilityRequirements'
        PendingReviewApplicationCapability:
            type: object
            additionalProperties: false
            required: [status, status_reason, status_changed_at]
            properties:
                status:
                    type: string
                    enum: [pending_review]
                status_reason:
                    type: string
                    enum: [setup_incomplete, account_under_review, account_restricted, account_inactive]
                status_changed_at:
                    type: string
                    format: date-time
        ApplicationCapabilitiesResponse:
            type: object
            additionalProperties: false
            required: [capabilities]
            properties:
                capabilities:
                    type: object
                    additionalProperties: false
                    required: [payments, payouts]
                    properties:
                        payments:
                            oneOf:
                                - $ref: '#/components/schemas/EnabledApplicationCapability'
                                - $ref: '#/components/schemas/RestrictedApplicationCapability'
                        payouts:
                            oneOf:
                                - $ref: '#/components/schemas/EnabledApplicationCapability'
                                - $ref: '#/components/schemas/RestrictedApplicationCapability'
                                - $ref: '#/components/schemas/PendingReviewApplicationCapability'
        ApplicationCapabilityProjection:
            type: object
            description: Public capability states currently available to the application. Newly created applications can return an empty object until capabilities become available. New capability keys may appear over time.
            properties:
                payments:
                    oneOf:
                        - $ref: '#/components/schemas/EnabledApplicationCapability'
                        - $ref: '#/components/schemas/RestrictedApplicationCapability'
                payouts:
                    oneOf:
                        - $ref: '#/components/schemas/EnabledApplicationCapability'
                        - $ref: '#/components/schemas/RestrictedApplicationCapability'
                        - $ref: '#/components/schemas/PendingReviewApplicationCapability'
            additionalProperties: true
        PolicyAmountRange:
            type: object
            additionalProperties: false
            required: [min, max]
            x-simile-constraints:
                - bounded:
                      path: /min
                      maximum: { path: /max }
            properties:
                min:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Inclusive minimum amount in minor currency units.
                max:
                    type: integer
                    format: int64
                    minimum: 1
                    description: Inclusive maximum amount in minor currency units.
        PolicyLimits:
            type: object
            additionalProperties: false
            required: [amount]
            properties:
                amount:
                    $ref: '#/components/schemas/PolicyAmountRange'
        PolicyBTAgingSpec:
            type: object
            additionalProperties: false
            required: [id, t_plus]
            properties:
                id:
                    type: string
                    enum:
                        - bt_aging_spec_immediate
                        - bt_aging_spec_24_hourly
                        - bt_aging_spec_48_hourly
                        - bt_aging_spec_168_hourly
                t_plus:
                    type: string
                    pattern: '^(0|[1-9][0-9]*)h$'
                    description: Platform-owned whole-hour aging duration.
        PolicyBTAgingSpecReference:
            type: object
            additionalProperties: false
            required: [id]
            properties:
                id:
                    type: string
                    enum:
                        - bt_aging_spec_immediate
                        - bt_aging_spec_24_hourly
                        - bt_aging_spec_48_hourly
                        - bt_aging_spec_168_hourly
                    description: Public aging-specification identifier. The platform determines `t_plus`.
        ChildrenPolicyPaymentsCapabilities:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
                currencies:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        type: string
                        pattern: '^[a-z]{3}$'
                limits:
                    $ref: '#/components/schemas/PolicyLimits'
        ChildrenPolicyPayoutsCapabilities:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
                enabled:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        type: boolean
                limits:
                    $ref: '#/components/schemas/PolicyLimits'
                bt_aging_spec:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        $ref: '#/components/schemas/PolicyBTAgingSpec'
        ChildrenPolicyPaymentMethodCapabilities:
            type: object
            additionalProperties: false
            required: [enabled, confirms_use]
            properties:
                enabled:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        type: boolean
                confirms_use:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        type: boolean
        ChildrenPolicyPaymentMethodsCapabilities:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
                mobile_money:
                    $ref: '#/components/schemas/ChildrenPolicyPaymentMethodCapabilities'
                bank_account:
                    $ref: '#/components/schemas/ChildrenPolicyPaymentMethodCapabilities'
                motito:
                    $ref: '#/components/schemas/ChildrenPolicyPaymentMethodCapabilities'
                card:
                    $ref: '#/components/schemas/ChildrenPolicyPaymentMethodCapabilities'
        ChildrenPolicyCapabilities:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
                payments:
                    $ref: '#/components/schemas/ChildrenPolicyPaymentsCapabilities'
                payouts:
                    $ref: '#/components/schemas/ChildrenPolicyPayoutsCapabilities'
                payment_methods:
                    $ref: '#/components/schemas/ChildrenPolicyPaymentMethodsCapabilities'
        ChildrenPolicy:
            type: object
            additionalProperties: false
            required:
                - id
                - version
                - active_version
                - name
                - capabilities
                - created_at
                - updated_at
                - version_created_at
            # A policy version is an immutable snapshot beneath the active head; its
            # version number and creation time therefore cannot move past that head.
            x-simile-constraints:
                - bounded:
                      path: /version
                      maximum: { path: /active_version }
                - ordered:
                      paths: [/created_at, /version_created_at, /updated_at]
            properties:
                id:
                    type: string
                    pattern: '^cp_'
                version:
                    type: integer
                    minimum: 1
                active_version:
                    type: integer
                    minimum: 1
                name:
                    type: string
                description:
                    type: string
                capabilities:
                    $ref: '#/components/schemas/ChildrenPolicyCapabilities'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                version_created_at:
                    type: string
                    format: date-time
        LookupChildrenPolicyRequest:
            type: object
            additionalProperties: false
            properties:
                version:
                    type: integer
                    minimum: 1
                    description: Immutable version to return. Omit to return the latest active version.
        PageChildrenPolicyVersionsRequest:
            type: object
            additionalProperties: false
            properties:
                number:
                    type: integer
                    minimum: 1
                    default: 1
                size:
                    type: integer
                    minimum: 1
                    maximum: 100
                    default: 20
        ChildrenPolicyResponse:
            type: object
            additionalProperties: false
            required: [children_policy]
            properties:
                children_policy:
                    $ref: '#/components/schemas/ChildrenPolicy'
        ChildrenPolicyVersionsPage:
            type: object
            additionalProperties: false
            required: [number, size, count, total, has_more, versions]
            # The count is the number of version snapshots actually returned,
            # not the requested page capacity.
            x-simile-constraints:
                - aggregate:
                      target: /count
                      operation: count
                      source: /versions/*
            properties:
                number:
                    type: integer
                    minimum: 1
                size:
                    type: integer
