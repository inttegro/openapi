                                $ref: '#/components/schemas/CustomerResponse'
                            # Why: public request-controlled values must survive into the synthesized operation result.
                            x-simile-from-request:
                                bindings:
                                    - { from: /billing_address, to: /customer/billing_address }
                                    - { from: /custom_data, to: /customer/custom_data }
                                    - { from: /email_address, to: /customer/email_address }
                                    - { from: /name, to: /customer/name }
                                    - { from: /phone_number, to: /customer/phone_number }
                                    - { from: /reference, to: /customer/reference }
                                    - { from: /shipping_address, to: /customer/shipping_address }
                                    - { from: /title, to: /customer/title }
                                    - to: /customer/guest
                                      value: { literal: false }
