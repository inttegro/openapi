# Authoritative customers resource contract.
# Why: keeping each resource's operations and schemas together makes public invariants
# reviewable without weakening the single bundled contract distributed to consumers.

paths:
    /customers/create:
        post:
            summary: Create a customer
            description: Create a reusable customer profile for orders and saved payment methods.
            operationId: createCustomer
            tags: [Customers]
            parameters:
                - $ref: './common.yml#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCustomerRequest'
            responses:
                '200':
                    description: Customer created
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
