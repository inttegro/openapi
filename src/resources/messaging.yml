                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_body] }, code: { enum: [invalid_request_body] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [invalid_request_parameter, request_parameter_null_rejected, request_parameter_parse_failed, request_parameter_too_large, request_parameter_too_small, request_parameter_type_mismatch, request_parameter_value_not_allowed, request_parameters_mutually_exclusive, unexpected_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/t-invalid_request_parameter"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [message_template_render_invalid, message_template_render_too_long, message_template_render_unsafe, message_template_request_invalid, request_parameter_choice_required, request_parameter_null_rejected, request_parameter_parse_failed, request_parameter_too_large, request_parameter_too_small, request_parameter_type_mismatch, request_parameter_value_not_allowed, request_parameters_mutually_exclusive, unexpected_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [missing_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/c-missing_request_parameter"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [request_parameter_choice_required] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/t-invalid_request_parameter"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [request_parameter_choice_required] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                '404':
                    description: Message template not found
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/ErrorEnvelope'
                                    - type: object
                                      properties:
                                          error:
                                              { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [message_template_not_found] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                '409':
                    description: Message template is archived
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/ErrorEnvelope'
                                    - type: object
                                      properties:
                                          error:
                                              { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [resource_state_conflict] }, code: { enum: [message_template_archived] }, fix_code: { enum: [refresh_resource_state] }, type: { enum: [state_conflict] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
components:
    schemas:
        MessageHeaders:
            type: object
            description: Validated provider-neutral email headers.
            additionalProperties:
                type: string
        CreateMessageTemplateRequest:
            oneOf:
                - $ref: '#/components/schemas/CreateSMSMessageTemplateRequest'
                - $ref: '#/components/schemas/CreateEmailMessageTemplateRequest'
            discriminator:
                propertyName: channel
                mapping:
                    sms: '#/components/schemas/CreateSMSMessageTemplateRequest'
                    email: '#/components/schemas/CreateEmailMessageTemplateRequest'
            description: Create request for one reusable SMS or email message template.
        CreateSMSMessageTemplateRequest:
            type: object
            required: [channel, name, purpose, sms]
            additionalProperties: false
            properties:
                about:
                    type: string
                channel:
                    type: string
                    enum: [sms]
                locale:
                    type: string
                    default: en
                name:
                    type: string
                purpose:
                    type: string
                sms:
                    $ref: '#/components/schemas/MessageTemplateSMSContent'
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariableInput'
        CreateEmailMessageTemplateRequest:
            type: object
            required: [channel, email, name, purpose]
            additionalProperties: false
            properties:
                about:
                    type: string
                attachments:
                    $ref: '#/components/schemas/MessageTemplateAttachmentIDs'
                channel:
                    type: string
                    enum: [email]
                email:
                    $ref: '#/components/schemas/MessageTemplateEmailContent'
                locale:
                    type: string
                    default: en
                name:
                    type: string
                purpose:
                    type: string
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariableInput'
        UpdateMessageTemplateRequest:
            type: object
            required:
                - id
            additionalProperties: false
            not:
                required:
                    - sms
                    - email
                properties:
                    sms: {}
                    email: {}
            properties:
                id:
                    type: string
                    # Why: a successful response preserves this selector as a typed mtpl_ resource ID.
                    pattern: '^mtpl_'
                    description: API-generated message template id.
                    example: "mtpl_receipt"
                name:
                    type: string
                    description: Human-readable template name.
                    example: "Receipt email"
                about:
                    type: string
                    description: Optional description of when this template should be used.
                    example: "Sent after a successful payment."
                channel:
                    type: string
                    enum: [sms, email]
                    description: Existing template channel. Channels cannot be changed.
                purpose:
                    type: string
                    description: Caller-defined purpose for filtering and analytics.
                    example: "receipt"
                locale:
                    type: string
                    example: "en"
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariableInput'
                sms:
                    $ref: '#/components/schemas/MessageTemplateSMSContent'
                email:
                    $ref: '#/components/schemas/MessageTemplateEmailContent'
                attachments:
                    $ref: '#/components/schemas/MessageTemplateAttachmentIDs'
        MessageTemplateIDRequest:
            type: object
            additionalProperties: false
            required:
                - id
            properties:
                id:
                    type: string
                    # Why: a successful response preserves this selector as a typed mtpl_ resource ID.
                    pattern: '^mtpl_'
                    description: API-generated message template id.
                    example: "mtpl_receipt"
        PageMessageTemplatesRequest:
            type: object
            additionalProperties: false
            properties:
                page:
                    type: integer
                    minimum: 1
                    default: 1
                size:
                    type: integer
                    minimum: 1
                    default: 25
                status:
                    type: string
                    enum: [draft, published, archived]
                channel:
                    type: string
                    enum: [sms, email]
                purpose:
                    type: string
                    example: "receipt"
                locale:
                    type: string
                    example: "en"
        RenderMessageTemplatePreviewRequest:
            type: object
            additionalProperties: false
            required:
                - message_template
            properties:
                message_template:
                    $ref: '#/components/schemas/MessageTemplateReference'
        MessageTemplateReference:
            type: object
            additionalProperties: false
            required:
                - template_id
            properties:
                template_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed mtpl_ resource ID.
                    pattern: '^mtpl_'
                    description: API-generated message template id.
                    example: "mtpl_receipt"
                variables:
                    $ref: '#/components/schemas/MessageTemplateVariables'
        MessageTemplateVariables:
            allOf:
                - $ref: './common.yml#/components/schemas/JSONData'
            description: Variable values used when rendering a template.
            example:
                customer_name: "Akua"
                receipt_url: "https://pay.inttegro.com/receipts/123"
        MessageTemplateAttachmentIDs:
            type: array
            description: Stored file IDs returned by previews. Chime send, schedule, and broadcast currently reject stored-template attachments.
            maxItems: 25
            items:
                type: string
                pattern: "^file_[A-Za-z0-9]+$"
            example:
                - "file_invoicePdf"
        MessageTemplateVariableInput:
            type: object
            required:
                - name
                - type
            additionalProperties: false
            properties:
                name:
                    type: string
                    pattern: "^[a-z][a-z0-9_]{0,63}$"
                    example: "customer_name"
                type:
                    type: string
                    enum: [string, number, integer, boolean, url, email, phone, date, datetime, array]
                required:
                    type: boolean
                'default':
                    description: Default value used when this variable is omitted.
                about:
                    type: string
                    description: Optional description of the variable.
                items:
                    type: array
                    description: Field schema for array item objects. Nested arrays are not supported.
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariableItemInput'
        MessageTemplateVariableItemInput:
            type: object
            required: [name, type]
            additionalProperties: false
            properties:
                about:
                    type: string
                default:
                    description: Default value used when this variable is omitted.
                name:
                    type: string
                    pattern: "^[a-z][a-z0-9_]{0,63}$"
                required:
                    type: boolean
                type:
                    type: string
                    enum: [string, number, integer, boolean, url, email, phone, date, datetime]
        MessageTemplateVariable:
            type: object
            additionalProperties: false
            required: [name, required, type]
            properties:
                about:
                    type: string
                default:
                    description: Default value used when this variable is omitted.
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariableItem'
                name:
                    type: string
                required:
                    type: boolean
                type:
                    type: string
                    enum: [string, number, integer, boolean, url, email, phone, date, datetime, array]
        MessageTemplateVariableItem:
            type: object
            additionalProperties: false
            required: [name, required, type]
            properties:
                about:
                    type: string
                default:
                    description: Default value used when this variable is omitted.
                name:
                    type: string
                required:
                    type: boolean
                type:
                    type: string
                    enum: [string, number, integer, boolean, url, email, phone, date, datetime]
        MessageTemplateSMSContent:
            type: object
            additionalProperties: false
            required:
                - message_template
            properties:
                message_template:
                    type: string
                    description: SMS body template.
                    example: "Your code is {{code}}."
        MessageTemplateEmailContent:
            type: object
            additionalProperties: false
            required:
                - subject
                - html
            properties:
                subject:
                    type: string
                    description: Email subject template.
                    example: "Your receipt"
                html:
                    type: string
                    description: HTML email body template.
                    example: "<p>Thanks {{customer_name}}.</p>"
                from:
                    allOf:
                        - $ref: '#/components/schemas/MessageTemplateMailbox'
                    description: >-
                        Optional sender identity. When omitted, Mercurio stores and uses the
                        configured default sender. A supplied address must be a literal sender
                        approved for the authenticated application; template expressions are not
                        accepted in the sender address.
                reply_to:
                    $ref: '#/components/schemas/MessageTemplateMailbox'
                headers:
                    $ref: '#/components/schemas/MessageHeaders'
        MessageTemplateMailbox:
            type: object
            additionalProperties: false
            required:
                - address
            properties:
                address:
                    type: string
                    description: Literal or templated mailbox address, such as `{{recipient_email}}`.
                    example: "{{recipient_email}}"
                name:
                    type: string
                    example: "Acme"
        MessageTemplateSafetyResult:
            type: object
            additionalProperties: false
            description: Result of the email safety scan.
            required: [content_hash, normalized_text, scanner, status]
            properties:
                content_hash:
                    type: string
                links:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplateScannedLink'
                normalized_text:
                    type: string
                quarantine_notes:
                    type: string
                reason_codes:
                    type: array
                    items:
                        type: string
                sanitized_html:
                    type: string
                scanner:
                    type: string
                status:
                    type: string
                    enum: [allowed, rejected, quarantined]
        MessageTemplateScannedLink:
            type: object
            additionalProperties: false
            required: [raw, scheme, status]
            properties:
                host:
                    type: string
                raw:
                    type: string
                reason:
                    type: string
                scheme:
                    type: string
                status:
                    type: string
        MessageTemplate:
            type: object
            additionalProperties: false
            required:
                - id
                - name
                - channel
                - purpose
                - locale
                - status
                - version
                - draft_version
                - has_unpublished_changes
                - created_at
                - updated_at
            # Template status must agree with the publication and archive evidence returned to callers.
            x-simile-constraints:
                - ordered:
                      paths: [/created_at, /published_at, /updated_at, /archived_at]
                - implies:
                      when: { path: /status, equals: draft }
                      then:
                          all:
                              - { path: /published_at, state: absent }
                              - { path: /archived_at, state: absent }
                - implies:
                      when: { path: /status, equals: published }
                      then:
                          all:
                              - { path: /published_at, state: non-null }
                              - { path: /archived_at, state: absent }
                - implies:
                      when: { path: /status, equals: archived }
                      then:
                          all:
                              - { path: /archived_at, state: non-null }
            properties:
                id:
                    type: string
                    # Public serializers always emit this resource with the mtpl_ type prefix.
                    pattern: '^mtpl_'
                    description: API-generated unique template id.
                    example: "mtpl_receipt"
                name:
                    type: string
                    example: "Receipt email"
                about:
                    type: string
                    example: "Sent after successful payment."
                channel:
                    type: string
                    enum: [sms, email]
                purpose:
                    type: string
                    example: "receipt"
                locale:
                    type: string
                    example: "en"
                status:
                    type: string
                    enum: [draft, published, archived]
                version:
                    type: integer
                    example: 2
                published_version:
                    type: integer
                    example: 1
                draft_version:
                    type: integer
                    example: 2
                has_unpublished_changes:
                    type: boolean
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplateVariable'
                sms:
                    $ref: '#/components/schemas/MessageTemplateSMSContent'
                email:
                    $ref: '#/components/schemas/MessageTemplateEmailContent'
                attachments:
                    $ref: '#/components/schemas/MessageTemplateAttachmentIDs'
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                published_at:
                    type: string
                    format: date-time
                archived_at:
                    type: string
                    format: date-time
        MessageTemplateEnvelope:
            type: object
            additionalProperties: false
            required: [message_template]
            properties:
                message_template:
                    $ref: '#/components/schemas/MessageTemplate'
        MessageTemplatesPageEnvelope:
            type: object
            additionalProperties: false
            required: [page]
            properties:
                page:
                    $ref: '#/components/schemas/MessageTemplatesPage'
        MessageTemplatesPage:
            type: object
            additionalProperties: false
            required:
                - number
                - size
                - message_templates
            # Secondary filters run after paging and size is recomputed from the result.
            x-simile-constraints:
                - aggregate:
                      target: /size
                      operation: count
                      source: /message_templates/*
            properties:
                number:
                    type: integer
                    example: 1
                size:
                    type: integer
                    description: Number of templates returned in this page after filters are applied.
                    example: 25
                message_templates:
                    type: array
                    items:
                        $ref: '#/components/schemas/MessageTemplate'
        RenderMessageTemplatePreviewResponse:
            type: object
            additionalProperties: false
            required: [message_template, rendered]
            properties:
                message_template:
                    $ref: '#/components/schemas/MessageTemplate'
                rendered:
                    $ref: '#/components/schemas/RenderedMessageTemplate'
        RenderedMessageTemplate:
            type: object
            additionalProperties: false
            required:
                - channel
            properties:
                channel:
                    type: string
                    enum: [sms, email]
                attachments:
                    $ref: '#/components/schemas/MessageTemplateAttachmentIDs'
                sms:
                    $ref: '#/components/schemas/RenderedSMSMessageTemplate'
                email:
                    $ref: '#/components/schemas/RenderedEmailMessageTemplate'
        RenderedSMSMessageTemplate:
            type: object
            additionalProperties: false
            required:
                - full_message
            properties:
                full_message:
                    type: string
                    maxLength: 120
                    example: "Your code is 123456."
        RenderedEmailMessageTemplate:
            type: object
            additionalProperties: false
            required:
                - subject
                - text
            properties:
                subject:
                    type: string
                    example: "Your receipt"
                text:
                    type: string
                    example: "Thanks Akua."
                html:
                    type: string
                    example: "<p>Thanks Akua.</p>"
                from:
                    $ref: '#/components/schemas/MessageTemplateMailbox'
                reply_to:
                    $ref: '#/components/schemas/MessageTemplateMailbox'
                headers:
                    $ref: '#/components/schemas/MessageHeaders'
                safety:
                    $ref: '#/components/schemas/MessageTemplateSafetyResult'
        SchedulePayoutRequest:
            type: object
            description: Parameters for scheduling a payout.
            additionalProperties: false
            required:
                - destination_id
                - reference
            properties:
                destination_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed fa_ resource ID.
                    pattern: '^fa_'
                    description: Financial account that should receive the payout.
                    example: "fa_1234567890abcdef"
                execute_after:
                    type: string
                    format: date-time
                    description: Optional future time after which execution may begin.
                    example: "2026-08-05T09:00:00Z"
                max_amount:
                    type: integer
                    minimum: 25000
                    description: Maximum amount, in the smallest currency unit, that this payout may transfer.
                    example: 250000
                reference:
                    type: string
                    description: Merchant reference carried on the payout.
                    example: "PAYOUT-APR-15"
        LookupChimeRequest:
            type: object
            additionalProperties: false
            description: Request to look up a chime by ID
            required:
                - chime_id
            properties:
                chime_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed ch_ resource ID.
                    pattern: '^ch_'
                    description: Unique identifier of the chime to look up
                    example: "ch_1234567890abcdef1234567890abcdef12345678"
        PageChimesRequest:
            type: object
            additionalProperties: false
            description: Request to retrieve a page of chimes
            properties:
                customer_id:
                    type: string
                    description: Restrict the page to chimes associated with this customer
                    example: "cu_abc123def456"
                page_number:
                    type: integer
                    minimum: 1
                    maximum: 10
                    default: 1
                    description: 1-based page index to fetch
                    example: 1
                page_size:
                    type: integer
                    minimum: 1
                    maximum: 256
                    default: 256
                    description: Number of chimes to return
                    example: 25
                recipient:
                    type: string
                    description: Restrict the page to chimes whose recipient exactly matches this phone number or email address
                    example: "+233544998605"
        SendChimeRequest:
            type: object
            additionalProperties: false
            description: |
                Request to send a chime to a recipient.
                SMS recipients accept either `full_message` or `message_template`.
                Email recipients accept either `email` or `message_template`.
            required:
                - recipient
            properties:
                recipient:
                    $ref: '#/components/schemas/ChimeRecipient'
                full_message:
                    type: string
                    description: Complete SMS message content. Use only with SMS recipients.
                    example: "Your verification code is 123456. It expires in 10 minutes."
                email:
                    $ref: '#/components/schemas/ChimeEmailMessageInput'
                message_template:
                    $ref: '#/components/schemas/MessageTemplateReference'
                sender_id:
                    type: string
                    description: Sender identifier shown to recipient. Uses default sender if not provided.
                    example: "YourBrand"
                purpose:
                    type: string
                    description: Purpose of this chime for categorization and analytics
                    example: "verification"
                cooldown:
                    type: object
                    description: Optional application-scoped delivery cooldown. A repeat send with the same key is rejected until the duration elapses.
                    additionalProperties: false
                    required: [key, duration_seconds]
                    properties:
                        key:
                            type: string
                            minLength: 1
                            maxLength: 120
                            description: Stable identifier for the notification being sent.
                        duration_seconds:
                            type: integer
                            minimum: 1
                            maximum: 86400
                            description: Rolling cooldown from the first accepted send attempt.
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                request_meta:
                    type: object
                    additionalProperties: false
                    description: Optional metadata controlling request processing
                    properties:
                        idempotency_key:
                            allOf:
                                - $ref: './common.yml#/components/schemas/IdempotencyKeyValue'
                            description: Unique key to prevent duplicate sends
                            example: "chime_send_20231214_abc123"
                        response:
                            $ref: './common.yml#/components/schemas/RequestResponse'
        ChimeRecipient:
            oneOf:
                - $ref: '#/components/schemas/ChimePhoneRecipient'
                - $ref: '#/components/schemas/ChimeEmailRecipient'
                - $ref: '#/components/schemas/ChimeSavedCustomerRecipient'
        ChimePhoneRecipient:
            type: object
            additionalProperties: false
            required: [phone, type]
            properties:
                name:
                    type: string
                phone:
                    type: object
                    additionalProperties: false
                    required: [number]
                    properties:
                        number:
                            type: string
                            example: "+233544998605"
                type:
                    type: string
                    enum: [phone]
        ChimeEmailRecipient:
            type: object
            additionalProperties: false
            required: [email, type]
            properties:
                email:
                    type: object
                    additionalProperties: false
                    required: [address]
                    properties:
                        address:
                            type: string
                            format: email
                            example: "user@example.com"
                name:
                    type: string
                type:
                    type: string
                    enum: [email]
        ChimeSavedCustomerRecipient:
            type: object
            additionalProperties: false
            required: [customer_id, transport]
            properties:
                customer_id:
                    type: string
                    example: cu_abc123def456
                transport:
                    type: string
                    enum: [sms, email]
        ChimeResponse:
            type: object
            additionalProperties: false
            description: Response containing chime details
            required: [chime]
            properties:
                chime:
                    $ref: '#/components/schemas/Chime'
        PageChimesResponse:
            type: object
            additionalProperties: false
            description: Response containing a page of chimes
            required: [page]
            properties:
                page:
                    type: object
                    additionalProperties: false
                    required:
                        - number
                        - size
                        - chimes
                    # Recipient/customer filtering happens before this returned count.
                    x-simile-constraints:
                        - aggregate:
                              target: /size
                              operation: count
                              source: /chimes/*
                    properties:
                        number:
                            type: integer
                            description: Page number returned
                            example: 1
                        size:
                            type: integer
                            description: Page size returned
                            example: 25
                        chimes:
                            type: array
                            description: Chimes in this page
                            items:
                                $ref: '#/components/schemas/Chime'
        ChimeSettingsResponse:
            type: object
            additionalProperties: false
            required: [settings]
            properties:
                settings:
                    $ref: '#/components/schemas/ChimeSettings'
        ChimeSettings:
            type: object
            additionalProperties: false
            required: [sms, email]
            properties:
                sms:
                    $ref: '#/components/schemas/ChimeSMSSettings'
                email:
                    $ref: '#/components/schemas/ChimeEmailSettings'
        ChimeSMSSettings:
            type: object
            additionalProperties: false
            required: [default_sender, min_sender_char_len, max_sender_char_len]
            # A usable sender-length interval cannot have its lower bound above its upper bound.
            x-simile-constraints:
                - bounded:
                      path: /min_sender_char_len
                      maximum: { path: /max_sender_char_len }
            properties:
                default_sender:
                    type: string
                    description: Platform fallback sender ID for SMS delivery.
                min_sender_char_len:
                    type: integer
                    minimum: 0
                max_sender_char_len:
                    type: integer
                    minimum: 0
        ChimeEmailSettings:
            type: object
            additionalProperties: false
            required: [default_from, allowed_from]
            properties:
                default_from:
                    type: string
                    format: email
                    description: Platform fallback From address for email delivery.
                allowed_from:
                    type: array
                    description: From addresses authorized for reusable message templates.
                    items:
                        type: string
                        format: email
        Chime:
            type: object
            additionalProperties: false
            description: A notification sent to one recipient
            required: [created_at, full_message, id, recipient, sender_id]
            properties:
                created_at:
                    type: string
                    format: date-time
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                customer_id:
                    type: string
                    # Public serializers always emit this resource with the cu_ type prefix.
                    pattern: '^cu_'
                email:
                    $ref: '#/components/schemas/ChimeEmailMessage'
                full_message:
                    type: string
                    description: Rendered SMS content. Empty for email Chimes.
                id:
                    type: string
                    # Public serializers always emit this resource with the ch_ type prefix.
                    pattern: '^ch_'
                idempotency_key:
                    type: string
                purpose:
                    type: string
                recipient:
                    $ref: '#/components/schemas/ChimeRecipientResponse'
                sender_id:
                    type: string
                transmission:
                    $ref: '#/components/schemas/ChimeTransmission'
        ChimeTransmission:
            type: object
            additionalProperties: false
            required: [address, created_at, gateway, id, initialized_at, mechanism, status]
            # Delivery status must be backed by the corresponding mutually exclusive transmission evidence.
            x-simile-constraints:
                - ordered:
                      paths: [/created_at, /initialized_at, /sent_at, /delivered_at]
                - ordered:
                      paths: [/created_at, /initialized_at, /sent_at, /failed_at]
                - implies:
                      when: { path: /status, equals: initialized }
                      then:
                          all:
                              - { path: /sent_at, state: absent }
                              - { path: /delivered_at, state: absent }
                              - { path: /failed_at, state: absent }
                - implies:
                      when: { path: /status, equals: sent }
                      then:
                          all:
                              - { path: /sent_at, state: non-null }
                              - { path: /delivered_at, state: absent }
                              - { path: /failed_at, state: absent }
                - implies:
                      when: { path: /status, equals: delivered }
                      then:
                          all:
                              - { path: /delivered_at, state: non-null }
                              - { path: /failed_at, state: absent }
                - implies:
                      when: { path: /status, equals: failed }
                      then:
                          all:
                              - { path: /delivered_at, state: absent }
                              - { path: /failed_at, state: non-null }
            properties:
                address:
                    type: string
                created_at:
                    type: string
                    format: date-time
                delivered_at:
                    type: string
                    format: date-time
                email_events:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChimeEmailEvent'
                email_failure_code:
                    type: string
                email_failure_reason:
                    type: string
                email_status:
                    type: string
                error:
                    type: string
                failed_at:
                    type: string
                    format: date-time
                gateway:
                    type: string
                gateway_message_id:
                    type: string
                id:
                    type: string
                initialized_at:
                    type: string
                    format: date-time
                last_email_event_at:
                    type: string
                    format: date-time
                mechanism:
                    type: string
                    enum: [sms, email]
                sent_at:
                    type: string
                    format: date-time
                sent_via:
                    type: string
                    enum: [sms, email]
                status:
                    type: string
                suppressed_at:
                    type: string
                    format: date-time
                suppression_reason:
                    type: string
        ChimeEmailEvent:
            type: object
            additionalProperties: false
            required: [id, occurred_at, provider, provider_message_id, type]
            properties:
                bounce_sub_type:
                    type: string
                bounce_type:
                    type: string
                complaint_sub_type:
                    type: string
                id:
                    type: string
                occurred_at:
                    type: string
                    format: date-time
                provider:
                    type: string
                provider_message_id:
                    type: string
                reason:
                    type: string
                reason_code:
                    type: string
                recipient:
                    type: string
                source:
                    type: string
                suppress_recipient:
                    type: boolean
                temporary:
                    type: boolean
                type:
                    type: string
        ChimeEmailMessageInput:
            type: object
            additionalProperties: false
            description: Email content accepted for email chimes, broadcasts, and schedules.
            required:
                - subject
                - text
                - from
            properties:
                subject:
                    type: string
                    description: Email subject.
                    example: "Your receipt"
                text:
                    type: string
                    description: Plain-text email body.
                    example: "Your receipt is ready."
                html:
                    type: string
                    description: Optional HTML email body. Unsafe HTML is rejected or sanitized before delivery.
                from:
                    $ref: '#/components/schemas/ChimeEmailMailbox'
                reply_to:
                    type: string
                    format: email
                    description: Optional reply-to email address.
                    example: "support@example.com"
                headers:
                    $ref: '#/components/schemas/MessageHeaders'
        ChimeEmailMessage:
            type: object
            additionalProperties: false
            description: Email content, safety scan result, and system-generated schema markup for email chimes.
            properties:
                subject:
                    type: string
                    description: Email subject
                    example: "Your receipt"
                text:
                    type: string
                    description: Plain-text email body
                    example: "Your receipt is ready."
                html:
                    type: string
                    description: Optional HTML email body before provider-specific rendering
                    nullable: true
                from:
                    $ref: '#/components/schemas/ChimeEmailMailbox'
                reply_to:
                    $ref: '#/components/schemas/ChimeEmailMailbox'
                headers:
                    $ref: '#/components/schemas/MessageHeaders'
                safety:
                    $ref: '#/components/schemas/ChimeEmailSafetyResult'
                schema:
                    $ref: '#/components/schemas/ChimeEmailSchemaMarkup'
        ChimeEmailMailbox:
            type: object
            additionalProperties: false
            properties:
                name:
                    type: string
                    description: Optional display name
                    example: "Acme"
                address:
                    type: string
                    format: email
                    description: Email address
                    example: "notifications@inttegro.com"
        ChimeEmailSafetyResult:
            type: object
            additionalProperties: false
            description: Result of the email safety scan
            properties:
                status:
                    type: string
                    enum: [allowed, rejected, quarantined]
                    description: Safety decision for the email content
                reason_codes:
                    type: array
                    items:
                        type: string
                    description: Machine-readable reasons for non-allowed results
                sanitized_html:
                    type: string
                    description: Sanitized HTML body used for provider send when present
                    nullable: true
                normalized_text:
                    type: string
                    description: Normalized plain-text body used by the scanner
                links:
                    type: array
                    items:
                        $ref: '#/components/schemas/ChimeEmailScannedLink'
                scanner:
                    type: string
                    description: Safety scanner identifier
                    example: "content-safety"
                content_hash:
                    type: string
                    description: Hash of the scanned email content
                quarantine_notes:
                    type: string
                    nullable: true
        ChimeEmailScannedLink:
            type: object
            additionalProperties: false
            properties:
                raw:
                    type: string
                scheme:
                    type: string
                host:
                    type: string
                status:
                    type: string
                    enum: [allowed, rejected, quarantined]
                reason:
                    type: string
        ChimeEmailSchemaMarkup:
            type: object
            additionalProperties: false
            description: Schema.org JSON-LD markup generated at email send time.
            properties:
                kind:
                    type: string
                    enum: [gmail_view_action, schema_org_order, schema_org_invoice]
                    description: Classification for the generated markup
                json_ld:
                    $ref: './common.yml#/components/schemas/JSONData'
        ChimeRecipientResponse:
            type: object
            additionalProperties: false
            description: Recipient information in response
            required: [type]
            properties:
                type:
                    type: string
                    enum: [phone, email]
                    description: Contact type
                    example: "phone"
                name:
                    type: string
                    description: Recipient name
                    example: "John Doe"
                phone:
                    type: object
                    additionalProperties: false
                    properties:
                        number:
                            type: string
                            example: "+233544998605"
                    required: [number]
                email:
                    type: object
                    additionalProperties: false
                    properties:
                        address:
                            type: string
                            example: "user@example.com"
                    required: [address]
        ScheduleChimeRequest:
            type: object
            additionalProperties: false
            required:
                - recipients
                - send_after
            properties:
                request_meta:
                    type: object
                    additionalProperties: false
                    properties:
                        idempotency_key:
                            allOf:
                                - $ref: './common.yml#/components/schemas/IdempotencyKeyValue'
                            description: Stable retry key. It must match the Idempotency-Key header when both are provided.
                        response:
                            $ref: './common.yml#/components/schemas/RequestResponse'
                recipients:
                    type: array
                    description: Recipient objects for this scheduled chime. Each item must include `transport` and either inline contact details or `customer_id`.
                    items:
                        $ref: '#/components/schemas/ChimeRecipient'
                    minItems: 1
                    example:
                        - customer_id: "cu_abc123def456"
                          transport: "sms"
                        - type: "phone"
                          phone:
                              number: "+233544998605"
                send_after:
                    type: string
                    format: date-time
                    description: ISO 8601 timestamp for when to send the chime (must be in the future)
                    example: "2025-12-15T10:00:00Z"
                full_message:
                    type: string
                    description: Complete SMS message content. Use only with SMS recipients.
                    example: "Reminder: Your appointment is tomorrow at 10 AM."
                email:
                    $ref: '#/components/schemas/ChimeEmailMessageInput'
                message_template:
                    $ref: '#/components/schemas/MessageTemplateReference'
                sender_id:
                    type: string
                    description: Sender identifier displayed to recipients
                    example: "YourBrand"
                purpose:
                    type: string
                    description: Optional purpose or category for this scheduled chime
                    example: "appointment_reminder"
        ScheduleResponse:
            type: object
            additionalProperties: false
            required: [scheduled_chime]
            properties:
                scheduled_chime:
                    $ref: '#/components/schemas/ScheduleCreationDetail'
        ScheduleCreationDetail:
            type: object
            additionalProperties: false
            required: [created_at, full_message, id, send_after, sender_id]
            # Scheduling and execution timestamps must follow the public delivery sequence.
            x-simile-constraints:
                - ordered:
                      paths: [/created_at, /send_after, /executed_at]
            properties:
                created_at:
                    type: string
                    format: date-time
                customer_ids:
                    type: array
                    items:
                        type: string
                email:
                    $ref: '#/components/schemas/ChimeEmailMessage'
                executed_at:
                    type: string
                    format: date-time
                full_message:
                    type: string
                id:
                    type: string
                    # Public serializers always emit this resource with the sch_ type prefix.
                    pattern: '^sch_'
                idempotency_key:
                    type: string
                purpose:
                    type: string
                recipients:
                    type: array
                    items:
                        type: string
                send_after:
                    type: string
                    format: date-time
                sender_id:
                    type: string
        LookupScheduleRequest:
            type: object
            additionalProperties: false
            required: [schedule_id]
            properties:
                schedule_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed sch_ resource ID.
                    pattern: '^sch_'
        CancelScheduleRequest:
            type: object
            additionalProperties: false
            required: [schedule_id]
            properties:
                schedule_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed sch_ resource ID.
                    pattern: '^sch_'
        ScheduleLookupResponse:
            type: object
            additionalProperties: false
            required: [scheduled_chime]
            properties:
                scheduled_chime:
                    $ref: '#/components/schemas/ScheduleDetail'
        ScheduleCancelResponse:
            type: object
            additionalProperties: false
            required: [scheduled_chime]
            properties:
                scheduled_chime:
                    $ref: '#/components/schemas/ScheduleCancelDetail'
        ScheduleDetail:
            type: object
            additionalProperties: false
            required: [content, created_at, id, recipients, send_after, sender_id]
            # Scheduling and execution timestamps must follow the public delivery sequence.
            x-simile-constraints:
                - ordered:
                      paths: [/created_at, /send_after, /executed_at]
            properties:
                chime_ids:
                    type: array
                    items:
                        type: string
                content:
                    type: string
                created_at:
                    type: string
                    format: date-time
                customer_ids:
                    type: array
                    items:
                        type: string
                email:
                    $ref: '#/components/schemas/ChimeEmailMessage'
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/ScheduleError'
                executed_at:
                    type: string
                    format: date-time
                id:
                    type: string
                    # Public serializers always emit this resource with the sch_ type prefix.
                    pattern: '^sch_'
                idempotency_key:
                    type: string
                purpose:
                    type: string
                recipients:
                    type: array
                    items:
                        type: string
                send_after:
                    type: string
                    format: date-time
                sender_id:
                    type: string
        ScheduleCancelDetail:
            allOf:
                - $ref: '#/components/schemas/ScheduleDetail'
                - type: object
                  properties:
                      canceled_at:
                          type: string
                          format: date-time
        ScheduleError:
            type: object
            additionalProperties: false
            description: Error encountered when scheduling a chime for a specific recipient
            properties:
                recipient:
                    type: string
                    description: Recipient address that caused the error
                    example: "+233invalid"
                fix_code:
                    type: string
                    description: Code indicating how to fix this error
                    example: "check_recipient"
                type:
                    type: string
                    description: Error type classification
                    example: "invalid_recipient"
        BroadcastRequest:
            type: object
            additionalProperties: false
            required:
                - recipients
            properties:
                request_meta:
                    type: object
                    additionalProperties: false
                    properties:
                        idempotency_key:
                            allOf:
                                - $ref: './common.yml#/components/schemas/IdempotencyKeyValue'
                            description: Stable retry key. It must match the Idempotency-Key header when both are provided.
                        response:
                            $ref: './common.yml#/components/schemas/RequestResponse'
                message_template:
                    oneOf:
                        - $ref: '#/components/schemas/BroadcastRawSMSContent'
                        - $ref: '#/components/schemas/MessageTemplateReference'
                    description: Raw SMS content for SMS broadcasts, or a stored message template reference for SMS or email broadcasts.
                email:
                    $ref: '#/components/schemas/ChimeEmailMessageInput'
                purpose:
                    type: string
                    description: Category or intent for this broadcast.
                    example: "order_notification"
                recipients:
                    type: array
                    description: Recipient objects for this broadcast. Each item must include `transport` and either inline contact details or `customer_id`.
                    items:
                        $ref: '#/components/schemas/ChimeRecipient'
                    minItems: 1
                    example:
                        - customer_id: "cu_abc123def456"
                          transport: "email"
                        - type: "email"
                          email:
                              address: "user@example.com"
                sender:
                    type: string
                    description: Sender identifier displayed to recipients.
                    example: "YourBrand"
        BroadcastRawSMSContent:
            type: string
            description: Raw SMS message content for a broadcast.
            example: "Your order #12345 has shipped."
        BroadcastResponse:
            type: object
            additionalProperties: false
            required: [broadcast]
            properties:
                broadcast:
                    $ref: '#/components/schemas/BroadcastCreationDetail'
        BroadcastCreationDetail:
            type: object
            additionalProperties: false
            required: [content, created_at, id, recipients, send_after, sender_id]
            properties:
                content:
                    type: string
                created_at:
                    type: string
                    format: date-time
                customer_ids:
                    type: array
                    items:
                        type: string
                email:
                    $ref: '#/components/schemas/ChimeEmailMessage'
                id:
                    type: string
                    # Public serializers always emit this resource with the brc_ type prefix.
                    pattern: '^brc_'
                idempotency_key:
                    type: string
                purpose:
                    type: string
                recipients:
                    type: array
                    items:
                        type: string
                send_after:
                    type: string
                    format: date-time
                sender_id:
                    type: string
        LookupBroadcastRequest:
            type: object
            additionalProperties: false
            required: [broadcast_id]
            properties:
                broadcast_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed brc_ resource ID.
                    pattern: '^brc_'
        LookupBroadcastResponse:
            type: object
            additionalProperties: false
            required: [broadcast]
            properties:
                broadcast:
                    $ref: '#/components/schemas/BroadcastDetail'
        CancelBroadcastRequest:
            type: object
            additionalProperties: false
            required: [broadcast_id]
            properties:
                broadcast_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed brc_ resource ID.
                    pattern: '^brc_'
        BroadcastCancelResponse:
            type: object
            additionalProperties: false
            required: [broadcast]
            properties:
                broadcast:
                    $ref: '#/components/schemas/BroadcastCancelDetail'
        BroadcastDetail:
            type: object
            additionalProperties: false
            required: [content, created_at, id, recipients, send_after, sender_id]
            # Execution cannot precede creation; immediate broadcasts set send_after just before creation.
            x-simile-constraints:
                - ordered:
                      paths: [/created_at, /executed_at]
            properties:
                chime_ids:
                    type: array
                    items:
                        type: string
                content:
                    type: string
                created_at:
                    type: string
                    format: date-time
                customer_ids:
                    type: array
                    items:
                        type: string
                email:
                    $ref: '#/components/schemas/ChimeEmailMessage'
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/BroadcastError'
                executed_at:
                    type: string
                    format: date-time
                id:
                    type: string
                    # Public serializers always emit this resource with the brc_ type prefix.
                    pattern: '^brc_'
                idempotency_key:
                    type: string
                purpose:
                    type: string
                recipients:
                    type: array
                    items:
                        type: string
                send_after:
                    type: string
                    format: date-time
                sender_id:
                    type: string
        BroadcastCancelDetail:
            allOf:
                - $ref: '#/components/schemas/BroadcastDetail'
                - type: object
                  properties:
                      canceled_at:
                          type: string
                          format: date-time
        BroadcastError:
            type: object
            additionalProperties: false
            description: Error encountered when broadcasting to a specific recipient
            properties:
                recipient:
                    type: string
