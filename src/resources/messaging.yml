                                              { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [message_template_not_found] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
    /message_templates/render_preview:
        post:
            summary: Render a message template preview
            description: Renders a draft-aware preview of a reusable message template with bundled variables.
            operationId: renderMessageTemplatePreview
            tags:
                - Message Templates
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RenderMessageTemplatePreviewRequest'
            responses:
                '200':
                    description: Message template rendered successfully
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RenderMessageTemplatePreviewResponse'
                            # Why: the preview returns the stored template selected by the reference; binding only its
                            # identifier leaves the separately rendered variable output free to differ from the input.
                            x-simile-from-request:
                                bindings:
                                    - { from: /message_template/template_id, to: /message_template/id }
                '401':
                    description: Unauthorized - invalid or missing API key
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/ErrorEnvelope'
