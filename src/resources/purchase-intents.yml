# Authoritative purchase-intents resource contract.
# Why: keeping each resource's operations and schemas together makes public invariants
# reviewable without weakening the single bundled contract distributed to consumers.

paths:
    /purchase_intents/create:
        post:
            summary: Create a purchase intent
            description: |
                Creates a controlled, shareable Buy link for a catalog product or bundle without
                requiring you to build a product page, cart, or checkout UI. The returned
                `sale_...` ID becomes `https://pages.inttegro.com/buy/{purchase_intent_id}`.
                An order is created only when a customer checks out from that link.

                This operation supports idempotency. Reuse the same `Idempotency-Key` and
                request body when retrying an uncertain request.
            operationId: createPurchaseIntent
            tags:
                - Purchase Intents
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without creating a duplicate Buy link.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreatePurchaseIntentRequest'
                        example:
                            product_id: prod_abc123
                            price_id: pr_xyz789
                            quantity:
                                min: 1
                                max: 5
                            usage:
                                multi_use: true
                            expires_at: "2030-12-01T09:00:00Z"
                            presentation:
                                buy_page:
                                    text:
                                        checkout_section_title: Complete your order
                                        primary_action_label: Continue
            responses:
                '200':
                    description: Purchase intent created successfully
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: creation validates a future expiry and creates no cancellation
                                # or single-use order claim, so its first public snapshot is active.
                                allOf:
                                    - $ref: '#/components/schemas/PurchaseIntentResponse'
                                    - type: object
                                      properties:
                                          purchase_intent:
                                              allOf:
                                                  - $ref: '#/components/schemas/PurchaseIntent'
                                                  - type: object
                                                    properties:
                                                        status: { type: string, enum: [active] }
                            # Why: this exact outcome keeps the Buy link, selected product, and
                            # effective special-offer price coherent for local integration tests.
                            examples:
                                created:
                                    summary: An active reusable Buy link with a special offer
                                    value:
                                        purchase_intent:
                                            allow_variants: false
                                            application_id: app_example
                                            created_at: "2026-11-17T10:00:00Z"
                                            id: sale_example
                                            product:
                                                id: prod_example
                                                type: digital
                                                name: Commerce Guide
                                                active: true
                                                created_at: "2026-11-17T10:00:00Z"
                                                published_at: "2026-11-17T10:00:00Z"
                                            price:
                                                active: true
                                                nominal:
                                                    currency: ghs
                                                    value: 15000
                                            quantity:
                                                min: 1
                                                max: 5
                                            status: active
                                            usage:
                                                multi_use: true
                '400':
                    description: Invalid request, quantity range, price availability, or product-price relationship
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/Error'
                                    - oneOf:
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [precondition_unmet] }, code: { enum: [purchase_intent_bundle_price_unavailable, purchase_intent_bundle_unavailable, purchase_intent_price_unavailable, purchase_intent_product_unavailable] }, fix_code: { enum: [satisfy_precondition] }, type: { enum: [bad_request] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [idempotency_key_invalid, idempotency_key_mismatch, idempotency_key_unsupported] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [idempotency_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_body] }, code: { enum: [invalid_request_body] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [invalid_request_parameter, request_parameter_null_rejected, request_parameter_parse_failed, request_parameter_too_large, request_parameter_too_small, request_parameter_type_mismatch, request_parameter_value_not_allowed, request_parameters_mutually_exclusive, unexpected_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/t-invalid_request_parameter"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [invalid_purchase_intent_quantity_range, invalid_purchase_intent_target, purchase_intent_price_product_mismatch, request_parameter_choice_required, request_parameter_null_rejected, request_parameter_parse_failed, request_parameter_too_large, request_parameter_too_small, request_parameter_type_mismatch, request_parameter_value_not_allowed, request_parameters_mutually_exclusive, unexpected_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [missing_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/c-missing_request_parameter"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [request_parameter_choice_required] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/t-invalid_request_parameter"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [request_parameter_choice_required] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                            examples:
                                invalid_quantity_range:
                                    summary: The maximum quantity is below the minimum
                                    value:
                                        cause: invalid_request_parameter
                                        code: invalid_purchase_intent_quantity_range
                                        fix_code: change_request_parameters
                                        type: invalid_request_parameter
                                        url: https://studio.inttegro.com/errors
                '401':
                    description: Unauthorized - invalid or missing API key
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/Error'
                                    - oneOf:
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [authentication_failed] }, code: { enum: [authentication_failed] }, fix_code: { enum: [authenticate_request] }, type: { enum: [authentication_error] }, url: { enum: ["https://studio.inttegro.com/e/c-authentication_failed"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [authentication_failed] }, code: { enum: [endpoint_authentication_required] }, fix_code: { enum: [authenticate_request] }, type: { enum: [authentication_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                '404':
                    description: Product or price not found
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/Error'
                                    - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [purchase_intent_bundle_not_found, purchase_intent_price_not_found, purchase_intent_product_not_found] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                '500':
                    description: Purchase intent creation failed unexpectedly
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/Error'
                                    - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [unknown] }, code: { enum: [request_failed] }, fix_code: { enum: [contact_customer_support] }, type: { enum: [unknown_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
    /purchase_intents/update:
        post:
            summary: Update a purchase intent
            description: |
                Changes quantity bounds or expiry without changing what an already-shared
                Buy link sells. `reactivate: true` clears cancellation state and any existing
                elapsed expiry. Product, price, usage mode, and variant selection remain
                immutable after creation.

                This operation supports idempotency. Reuse the same `Idempotency-Key` and
                request body when retrying an uncertain request.
            operationId: updatePurchaseIntent
            tags:
                - Purchase Intents
            parameters:
                - name: Idempotency-Key
                  in: header
                  required: false
                  schema:
                      type: string
                  description: Stable key used to replay safe retries without applying the update twice.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdatePurchaseIntentRequest'
            responses:
                '200':
                    description: Purchase intent updated successfully
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PurchaseIntentResponse'
                            # Why: the updated Buy link must be the same public resource selected by either
                            # accepted request alias, even though its product-or-bundle snapshot is synthesized.
                            x-simile-from-request:
                                bindings:
                                    - to: /purchase_intent/id
                                      value:
                                          coalesce:
                                              - { request: /purchase_intent_id }
                                              - { request: /id }
                            examples:
                                updated:
                                    summary: Active Buy link with revised quantity bounds
                                    value:
                                        purchase_intent:
                                            allow_variants: false
                                            application_id: app_example
                                            created_at: "2026-11-17T10:00:00Z"
                                            id: sale_updated_example
                                            product:
                                                id: prod_example
                                                type: digital
                                                name: Commerce Guide
                                                active: true
                                                created_at: "2026-11-17T10:00:00Z"
                                                published_at: "2026-11-17T10:00:00Z"
                                            quantity: { min: 2, max: 10 }
                                            status: active
                                            updated_at: "2026-11-20T10:00:00Z"
                                            usage: { multi_use: true }
                '400':
                    description: Bad request - invalid parameters
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
