                    description: Checkout payment timed out
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/ErrorEnvelope'
                                    - type: object
                                      properties:
                                          error:
                                              { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [request_timeout] }, code: { enum: [request_timeout] }, fix_code: { enum: [retry_with_backoff] }, type: { enum: [transient_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
    /checkout/confirm_payment:
        post:
            summary: Confirm a checkout payment
            description: |
                Submit the payer's confirmation token for a checkout payment that requires customer
                confirmation. Retry an uncertain request with the same idempotency key and body.
            operationId: confirmCheckoutPayment
            tags: [Checkout]
            security: []
            parameters:
                - $ref: './common.yml#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckoutConfirmPaymentRequest'
            responses:
                '200':
                    description: Checkout payment confirmation result
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CheckoutOrderResponse'
                '400':
                    description: Invalid checkout payment confirmation request
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
