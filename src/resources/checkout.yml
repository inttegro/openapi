# Authoritative checkout resource contract.
# Why: keeping each resource's operations and schemas together makes public invariants
# reviewable without weakening the single bundled contract distributed to consumers.

paths:
    /checkout/lookup:
        post:
            summary: Look up checkout
            description: |
                Retrieve either the current public checkout representation of a finalized Order or
                the canonical public Purchase Intent. Send exactly one reference. A Purchase Intent
                response includes its resolved product and price, including customer-selected amount
                policy when the price permits the customer to choose an amount. An Order response
                includes editable pricing policy on each eligible line while payment has not begun.
            operationId: lookupCheckoutResource
            tags: [Checkout]
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckoutLookupRequest'
            responses:
                '200':
                    description: Checkout Order or Purchase Intent found
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CheckoutLookupResponse'
                '400':
                    description: Invalid checkout lookup request
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/ErrorEnvelope'
                                    - type: object
                                      properties:
                                          error:
                                              oneOf:
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_body] }, code: { enum: [invalid_request_body] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [invalid_request_parameter, request_parameter_null_rejected, request_parameter_parse_failed, request_parameter_too_large, request_parameter_too_small, request_parameter_type_mismatch, request_parameter_value_not_allowed, request_parameters_mutually_exclusive, unexpected_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/t-invalid_request_parameter"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [request_parameter_choice_required, request_parameter_null_rejected, request_parameter_parse_failed, request_parameter_too_large, request_parameter_too_small, request_parameter_type_mismatch, request_parameter_value_not_allowed, request_parameters_mutually_exclusive, unexpected_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [missing_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/c-missing_request_parameter"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [request_parameter_choice_required] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/t-invalid_request_parameter"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [request_parameter_choice_required] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                '422':
                    description: Checkout reference was not found or cannot be used
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/ErrorEnvelope'
                                    - type: object
                                      properties:
                                          error:
                                              oneOf:
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [precondition_unmet] }, code: { enum: [draft_mode_order_has_no_invoice] }, fix_code: { enum: [satisfy_precondition] }, type: { enum: [bad_request] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [order_not_found] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [unknown] }, code: { enum: [request_failed] }, fix_code: { enum: [contact_customer_support] }, type: { enum: [unknown_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
    /checkout/select_amount:
        post:
            summary: Update customer-selected amounts on a checkout Order
            description: |
                Update customer-selected product amounts on an existing finalized Order while its
                payment remains pristine. The Order cannot be changed after payment begins.
                Suggested amounts are conveniences, not an allow-list. Purchase Intent checkouts
                should send their selected amount directly to `/checkout/pay`, which creates the
                Order and starts payment together. Retry an uncertain request with the same
                idempotency key and body.
            operationId: selectCheckoutAmount
            tags: [Checkout]
            security: []
            parameters:
                - $ref: './common.yml#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckoutSelectAmountRequest'
            responses:
                '200':
                    description: Finalized Checkout Order created, updated, or replayed
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CheckoutOrderResponse'
                '400':
                    description: Invalid amount-selection request
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/ErrorEnvelope'
                                    - type: object
                                      properties:
                                          error:
                                              oneOf:
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [idempotency_key_invalid, idempotency_key_mismatch, idempotency_key_unsupported] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [idempotency_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_body] }, code: { enum: [invalid_request_body] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [invalid_request_parameter, request_parameter_null_rejected, request_parameter_parse_failed, request_parameter_too_large, request_parameter_too_small, request_parameter_type_mismatch, request_parameter_value_not_allowed, request_parameters_mutually_exclusive, unexpected_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/t-invalid_request_parameter"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [request_parameter_choice_required, request_parameter_null_rejected, request_parameter_parse_failed, request_parameter_too_large, request_parameter_too_small, request_parameter_type_mismatch, request_parameter_value_not_allowed, request_parameters_mutually_exclusive, unexpected_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [missing_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/c-missing_request_parameter"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [request_parameter_choice_required] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/t-invalid_request_parameter"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [request_parameter_choice_required] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                '409':
                    description: Another request is currently using the same idempotency key
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/ErrorEnvelope'
                                    - type: object
                                      properties:
                                          error:
                                              { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [idempotency_in_progress] }, code: { enum: [idempotency_key_in_progress] }, fix_code: { enum: [repeat_same_request] }, type: { enum: [idempotency_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                '422':
                    description: Purchase Intent or selected amount cannot be used
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/ErrorEnvelope'
                                    - type: object
                                      properties:
                                          error:
                                              oneOf:
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [idempotency_conflict] }, code: { enum: [idempotency_key_conflict] }, fix_code: { enum: [use_new_idempotency_key] }, type: { enum: [idempotency_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [checkout_amount_locked, checkout_line_item_duplicate, checkout_line_item_invalid, checkout_line_item_not_found, checkout_order_not_found, customer_selected_amount_invalid, customer_selected_amount_required, purchase_intent_already_used, purchase_intent_not_found] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [unknown] }, code: { enum: [request_failed] }, fix_code: { enum: [contact_customer_support] }, type: { enum: [unknown_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                '503':
                    description: Checkout Order preparation failed transiently
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                        Retry-After:
                            $ref: './common.yml#/components/headers/RetryAfter'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/ErrorEnvelope'
                                    - type: object
                                      properties:
                                          error:
                                              oneOf:
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [dependency_unavailable] }, code: { enum: [idempotency_storage_unavailable] }, fix_code: { enum: [repeat_same_request] }, type: { enum: [idempotency_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [service_unavailable] }, code: { enum: [idempotency_key_generation_failed] }, fix_code: { enum: [repeat_same_request] }, type: { enum: [idempotency_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [service_unavailable] }, code: { enum: [endpoint_unavailable] }, fix_code: { enum: [repeat_same_request] }, type: { enum: [transient_error] }, url: { enum: ["https://studio.inttegro.com/e/t-transient_error"] } } }
                                                  - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [service_unavailable] }, code: { enum: [checkout_amount_selection_failed] }, fix_code: { enum: [repeat_same_request] }, type: { enum: [transient_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
    /checkout/pay:
        post:
            summary: Pay a checkout
            description: |
                Send exactly one checkout reference. With `order_id`, Checkout pays the existing
                finalized Order. With `purchase_intent_id`, Checkout validates the selected product,
                quantity, and amount, creates the finalized Order, and starts payment as one
                idempotent operation when the payer submits payment. Purchase Intent payments must
                include `customer_data` and new `payment_method_data`; saved payment methods can be
                used only with an existing Order.

                Retry an uncertain request with the same idempotency key and body.
            operationId: payCheckout
            tags: [Checkout]
            security: []
            parameters:
                - $ref: './common.yml#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckoutPayRequest'
            responses:
                '200':
                    description: Checkout payment result
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CheckoutOrderResponse'
                '400':
                    description: Checkout payment request cannot be satisfied
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
