    /orders/send_invoice:
        post:
            summary: Send an order invoice
            description: |
                Sends the hosted invoice link for an existing order through Chime. The request
                body contains only `order_id`; delivery options are resolved from the order
                customer.

                If the customer has both a phone number and an email address, Inttegro sends
                both SMS and email Chimes. If only one contact method exists, Inttegro sends
                to that channel. The order must be finalized before Inttegro can send the
                hosted invoice link.

                This is an idempotent endpoint. Send retry keys with the `Idempotency-Key`
                header.
            operationId: sendOrderInvoice
            tags:
                - Orders
            parameters:
