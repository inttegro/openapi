            summary: Lookup an order
            description: Retrieves details of an existing order by its ID. The order may or may not exist.
            operationId: lookupOrder
            tags:
                - Orders
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LookupOrderRequest'
            responses:
