                    description: Order found
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                            # Why: a lookup must return the exact public resource selected by the caller.
                            x-simile-from-request:
                                bindings:
                                    - { from: /order_id, to: /order/id }
                '400':
                    description: Order lookup failed
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
