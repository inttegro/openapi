    /orders/page:
        post:
            summary: Page through orders
            description: |
                Retrieve a paginated list of the most recent orders for the authenticated application.
                Orders are sorted by `initiated_at` in descending order. Page numbers are
                zero-based, so page 0 contains the freshest activity.
            operationId: pageOrders
            tags:
                - Orders
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PageOrdersRequest'
            responses:
                '200':
                    description: Page retrieved successfully
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PageOrdersResponse'
                            # Why: this operation must return a result reachable from the caller-selected resource or page.
                            x-simile-from-request:
                                bindings:
                                    - { from: /page_number, to: /page/number }
                '401':
                    description: Unauthorized - invalid or missing API key
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
