components:
    schemas:
        PaymentNextAction:
            type: object
            additionalProperties: false
            description: Next action required to complete a payment
            nullable: true
            required:
                - type
            properties:
                type:
                    type: string
                    enum: [confirm_payment, execute, redirect, authorize_payment, request_confirmation]
                    description: Type of action required
                    example: "confirm_payment"
                confirm_payment:
                    type: object
                    additionalProperties: false
                    description: Details for customer payment confirmation
                    required: [expires_at, scheme, confirmed, status]
                    properties:
                        expires_at:
                            type: string
                            format: date-time
                            description: When the confirmation request expires
                            example: "2025-10-24T21:16:11.917533316Z"
                        scheme:
                            type: string
                            description: Authentication scheme used
                            example: "inttegro_defined_auth"
                        request:
                            type: object
                            additionalProperties: false
                            description: Confirmation request details
                            required: [id, recipient, sent_via, token_size, sender_id]
                            properties:
                                id:
                                    type: string
                                    description: Unique identifier for the confirmation request
                                    example: "Jmjup0uRSVI2LvllHfdJ"
                                recipient:
                                    type: string
                                    description: Recipient of the confirmation token
                                    example: "0242057831"
                                sent_via:
                                    type: string
                                    enum: [sms, email, push]
                                    description: Channel used to send the token
                                    example: "sms"
                                token_size:
                                    type: integer
                                    description: Number of digits in the token
                                    example: 6
                                sender_id:
                                    type: string
                                    description: Sender ID for the message
                                    example: "zverify"
                                status:
                                    type: string
                                    description: Current request status
                        attempt:
                            type: object
                            additionalProperties: false
                            description: Latest confirmation attempt
                            required: [status, confirmed, reason, created_at]
                            properties:
                                status:
                                    type: string
                                    description: Attempt status
                                    example: "pending"
                                confirmed:
                                    type: boolean
                                    description: Whether the confirmation has succeeded
                                    example: false
                                reason:
                                    type: string
                                    description: Reason for the current attempt state
                                    example: "awaiting_customer_confirmation"
                                executed_at:
                                    type: string
                                    format: date-time
                                    description: When the attempt was executed
                                created_at:
                                    type: string
                                    format: date-time
                                    description: When the attempt was created
                        confirmed:
                            type: boolean
                            description: Whether the payment confirmation has completed
                            example: false
                        status:
                            type: string
                            description: Confirmation status
                            example: "pending"
                redirect:
                    type: object
                    additionalProperties: false
                    description: Details for redirect action
                    required: [redirect_url, valid_until]
                    properties:
                        redirect_url:
                            type: string
                            format: uri
                            description: URL to redirect the customer to
                            example: "https://pages.inttegro.com/authorize?order_id=3deNYydEjIGCqK1tGlAPwJYSCsZnQ4XGF"
                        valid_until:
                            type: string
                            format: date-time
                            description: When the redirect URL expires
                        latest_visit:
                            type: object
                            additionalProperties: false
                            description: Latest redirect visit details
                            required: [user_agent, ip_address, at]
                            properties:
                                user_agent:
                                    type: string
                                ip_address:
                                    type: string
                                at:
                                    type: string
                                    format: date-time
                authorize:
                    type: object
                    additionalProperties: false
                    description: Details for authorization action
                    required: [beneficiary, scheme, expires_at]
                    properties:
                        beneficiary:
                            type: string
                            description: Beneficiary requiring authorization
                        scheme:
                            type: string
                            description: Authorization scheme
                        expires_at:
                            type: string
                            format: date-time
                            description: When the authorization request expires
                request_confirmation:
                    type: object
                    additionalProperties: false
                    description: Details for requesting a fresh customer confirmation.
                    properties:
                        last_request:
                            type: object
                            additionalProperties: false
                            required: [id, recipient, sent_via, token_size, sender_id]
                            properties:
                                id:
                                    type: string
                                recipient:
                                    type: string
                                sent_via:
                                    type: string
                                    enum: [sms, email, push]
                                token_size:
                                    type: integer
                                sender_id:
                                    type: string
                                status:
                                    type: string
                        after:
                            type: string
                            format: date-time
        CreateOrderNewCustomer:
            type: object
            additionalProperties: false
            required:
                - customer_data
                - line_items
            allOf:
                - not:
                      required: [statement_descriptor, statement_descriptor_prefix]
                      properties:
                          statement_descriptor: {}
                          statement_descriptor_prefix: {}
            properties:
                customer_data:
                    $ref: './customers.yml#/components/schemas/CustomerData'
                payment_method_types:
                    type: array
                    description: Payment method types the order may accept. Omit or send an empty array to use all supported types.
                    items:
                        $ref: './payment-methods.yml#/components/schemas/PaymentMethodType'
                payment_method_data:
                    allOf:
                        - $ref: './payment-methods.yml#/components/schemas/PaymentMethodData'
                    description: New payment instrument details to use when executing payment for the order.
                payment_due_after:
                    type: string
                    format: date-time
                    description: Optional payment due time.
                number:
                    type: string
                    description: Optional order number for reference. When omitted, Inttegro uses the generated order ID.
                    example: "ORDER-NUMBER-2"
                receipt_number:
                    type: string
                    description: Optional receipt number for downstream reconciliation. Uses the same length rules as `number`.
                    example: "RCPT-NUMBER-2"
                statement_descriptor:
                    type: string
                    description: Optional statement descriptor shown on the customer's bank statement
                    example: "STMTDESC"
                    minLength: 3
                    maxLength: 22
                statement_descriptor_prefix:
                    type: string
                    description: Optional static prefix used to build the statement descriptor as `prefix*order_id`. Mutually exclusive with `statement_descriptor`.
                    example: "LINE"
                    minLength: 2
                    maxLength: 10
                    pattern: '^[^*]+$'
                execute_payment:
                    type: boolean
                    description: Whether to execute payment immediately after order creation
                    default: false
                finalize:
                    type: boolean
                    description: Whether to explicitly finalize the order. When true, the order is finalized regardless of payment state. When false or omitted, finalization follows default heuristics (finalize if payment is executable).
                    default: false
                request_meta:
                    type: object
                    additionalProperties: false
                    description: Optional metadata controlling request processing
                    properties:
                        idempotency_key:
                            allOf:
                                - $ref: './common.yml#/components/schemas/IdempotencyKeyValue'
                            description: Unique key to prevent duplicate order creation
                        response:
                            $ref: './common.yml#/components/schemas/RequestResponse'
                checkout_settings:
                    type: object
                    additionalProperties: false
                    description: Checkout and payment flow configuration. Strongly recommended to provide both redirect_url and cancel_url for a delightful customer experience.
                    properties:
                        redirect_url:
                            type: string
                            format: uri
                            description: URL to redirect customer after payment completion
                            example: "https://example.com/order/complete"
                        cancel_url:
                            type: string
                            format: uri
                            description: URL to redirect customer if they cancel payment
                            example: "https://example.com/order/cancelled"
                invoice_settings:
                    $ref: '#/components/schemas/InvoiceSettings'
                payout_settings:
                    $ref: '#/components/schemas/OrderPayoutSettingsRequest'
                line_items:
                    type: array
                    description: Items included in the order. Product line items may use inline product data, `product_id` with explicit `price`, or `product_id` with `price_id`.
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/LineItem'
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                billing_details:
                    $ref: '#/components/schemas/BillingDetails'
                shipping:
                    $ref: '#/components/schemas/Shipping'
        CreateOrderExistingCustomer:
            type: object
            additionalProperties: false
            required:
                - customer_id
                - line_items
            allOf:
                - not:
                      required: [payment_method_id, payment_method_data]
                      properties:
                          payment_method_id: {}
                          payment_method_data: {}
                - not:
                      required: [statement_descriptor, statement_descriptor_prefix]
                      properties:
                          statement_descriptor: {}
                          statement_descriptor_prefix: {}
            properties:
                customer_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed cu_ resource ID.
                    pattern: '^cu_'
                    description: ID of existing customer
                    example: "cu_dZjC0hAsYi2dObveagp6pJLoXvgmicoBQj8KuNOZ"
                payment_method_types:
                    type: array
                    description: Payment method types the order may accept. Omit or send an empty array to use all supported types.
                    items:
                        $ref: './payment-methods.yml#/components/schemas/PaymentMethodType'
                payment_method_id:
                    type: string
                    description: ID of saved payment method to use
                    example: "OaNWqiOeYa5OJMcxUPZC1pLCW94Ne3toks4HIVPRa"
                payment_method_data:
                    allOf:
                        - $ref: './payment-methods.yml#/components/schemas/PaymentMethodData'
                    description: New payment instrument details to use instead of a saved payment method.
                payment_due_after:
                    type: string
                    format: date-time
                    description: Optional payment due time.
                number:
                    type: string
                    description: Optional order number for reference. When omitted, Inttegro uses the generated order ID.
                    example: "ORDER-NUMBER-2"
                receipt_number:
                    type: string
                    description: Optional receipt number for downstream reconciliation. Uses the same length rules as `number`.
                    example: "RCPT-NUMBER-2"
                statement_descriptor:
                    type: string
                    description: Optional statement descriptor shown on the customer's bank statement
                    minLength: 3
                    maxLength: 22
                statement_descriptor_prefix:
                    type: string
                    description: Optional static prefix used to build the statement descriptor as `prefix*order_id`. Mutually exclusive with `statement_descriptor`.
                    example: "LINE"
                    minLength: 2
                    maxLength: 10
                    pattern: '^[^*]+$'
                execute_payment:
                    type: boolean
                    description: Whether to execute payment immediately
                    default: false
                finalize:
                    type: boolean
                    description: Whether to explicitly finalize the order. When true, the order is finalized regardless of payment state. When false or omitted, finalization follows default heuristics (finalize if payment is executable).
                    default: false
                request_meta:
                    type: object
                    additionalProperties: false
                    description: Optional metadata controlling request processing
                    properties:
                        idempotency_key:
                            allOf:
                                - $ref: './common.yml#/components/schemas/IdempotencyKeyValue'
                            description: Unique key to prevent duplicate order creation
                        response:
                            $ref: './common.yml#/components/schemas/RequestResponse'
                checkout_settings:
                    type: object
                    additionalProperties: false
                    description: Checkout and payment flow configuration. Strongly recommended to provide both redirect_url and cancel_url for a delightful customer experience.
                    properties:
                        redirect_url:
                            type: string
                            format: uri
                            description: URL to redirect customer after payment completion
                            example: "https://example.com/order/complete"
                        cancel_url:
                            type: string
                            format: uri
                            description: URL to redirect customer if they cancel payment
                            example: "https://example.com/order/cancelled"
                invoice_settings:
                    $ref: '#/components/schemas/InvoiceSettings'
                payout_settings:
                    $ref: '#/components/schemas/OrderPayoutSettingsRequest'
                line_items:
                    type: array
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/LineItem'
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                billing_details:
                    $ref: '#/components/schemas/BillingDetails'
                shipping:
                    $ref: '#/components/schemas/Shipping'
        InvoiceSettings:
            type: object
            additionalProperties: false
            description: Order-level invoice rendering data. Pages uses this data when rendering invoice web and download views.
            properties:
                number:
                    type: string
                    description: Optional invoice number. When omitted, invoice delivery falls back to the order number and then the order ID for labels.
                    example: "INV-1001"
                memo:
                    type: string
                    description: Optional invoice memo.
                    example: "Thanks for your order."
                footer:
                    type: string
                    description: Optional invoice footer.
                    example: "Payment due within 7 days."
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
        OrderPayoutSettingsRequest:
            type: object
            additionalProperties: false
            properties:
                destination:
                    type: object
                    additionalProperties: false
                    required: [financial_account_id]
                    properties:
                        financial_account_id:
                            type: string
                            description: Same-currency financial account with push capability enabled
                enable_fx:
                    type: boolean
                    enum: [false]
                    default: false
                    description: Omit this field or set it to false. Cross-currency payouts are not currently available.
        OrderLineItem:
            oneOf:
                - $ref: '#/components/schemas/OrderProductLineItem'
                - $ref: '#/components/schemas/OrderFeeLineItem'
                - $ref: '#/components/schemas/OrderShippingLineItem'
                - $ref: '#/components/schemas/OrderDiscountLineItem'
            discriminator:
                propertyName: type
                mapping:
                    product: '#/components/schemas/OrderProductLineItem'
                    fee: '#/components/schemas/OrderFeeLineItem'
                    shipping: '#/components/schemas/OrderShippingLineItem'
                    discount: '#/components/schemas/OrderDiscountLineItem'
        OrderProductLineItem:
            type: object
            additionalProperties: false
            required: [type, product]
            properties:
                type:
                    type: string
                    enum: [product]
                product:
                    type: object
                    additionalProperties: false
                    required: [id, name, price, quantity]
                    properties:
                        id:
                            type: string
                            # Public serializers always emit this resource with the oli_ type prefix.
                            pattern: '^oli_'
                            description: Immutable order-line identifier with the `oli_` prefix.
                            example: "oli_7QYpB8c3V9kL2nM4"
                        product_id:
                            type: string
                            # Public serializers always emit this resource with the prod_ type prefix.
                            pattern: '^prod_'
                            description: Source catalog product ID when this line snapshots a catalog product.
                        price_id:
                            type: string
                            # Public serializers always emit this resource with the pr_ type prefix.
                            pattern: '^pr_'
                            description: Source catalog price ID when this line snapshots a saved price.
                        reference:
                            type: string
                        about:
                            type: string
                        custom_data:
                            $ref: './common.yml#/components/schemas/CustomData'
                        tax_code:
                            type: string
                        name:
                            type: string
                        category:
                            type: string
                        type:
                            type: string
                        price:
                            $ref: './catalog.yml#/components/schemas/Price'
                        # A product line represents a purchase, so zero or negative
                        # quantity cannot be reconciled into a payable order total.
                        quantity:
                            type: integer
                            minimum: 1
        OrderFeeLineItem:
            type: object
            additionalProperties: false
            required: [type, fee]
            properties:
                type:
                    type: string
                    enum: [fee]
                fee:
                    type: object
                    additionalProperties: false
                    required: [id, amount, label]
                    properties:
                        id:
                            type: string
                            # Public serializers always emit this resource with the oli_ type prefix.
                            pattern: '^oli_'
                            description: Immutable order-line identifier with the `oli_` prefix.
                        description:
                            type: string
                        tax_code:
                            type: string
                        amount:
                            $ref: './common.yml#/components/schemas/Amount'
                        label:
                            type: string
        OrderShippingLineItem:
            type: object
            additionalProperties: false
            required: [type, shipping]
            properties:
                type:
                    type: string
                    enum: [shipping]
                shipping:
                    type: object
                    additionalProperties: false
                    required: [id, fee]
                    properties:
                        id:
                            type: string
                            # Public serializers always emit this resource with the oli_ type prefix.
                            pattern: '^oli_'
                            description: Immutable order-line identifier with the `oli_` prefix.
                        tax_code:
                            type: string
                        label:
                            type: string
                        fee:
                            $ref: './common.yml#/components/schemas/Amount'
        OrderDiscountLineItem:
            type: object
            additionalProperties: false
            required: [type, discount]
            properties:
                type:
                    type: string
                    enum: [discount]
                discount:
                    $ref: '#/components/schemas/OrderDiscount'
        OrderDiscount:
            type: object
            additionalProperties: false
        LineItem:
            oneOf:
                - $ref: '#/components/schemas/ProductLineItem'
                - $ref: '#/components/schemas/FeeLineItem'
                - $ref: '#/components/schemas/ShippingLineItem'
            discriminator:
                propertyName: type
                mapping:
                    product: '#/components/schemas/ProductLineItem'
                    fee: '#/components/schemas/FeeLineItem'
                    shipping: '#/components/schemas/ShippingLineItem'
        ProductLineItem:
            type: object
            additionalProperties: false
            required:
                - type
                - product
            properties:
                type:
                    type: string
                    enum: [product]
                    description: Line item type discriminator
                product:
                    $ref: '#/components/schemas/ProductDetails'
        FeeLineItem:
            type: object
            additionalProperties: false
            required:
                - type
                - fee
            properties:
                type:
                    type: string
                    enum: [fee]
                    description: Line item type discriminator
                fee:
                    $ref: '#/components/schemas/FeeDetails'
        ShippingLineItem:
            type: object
            additionalProperties: false
            required:
                - type
                - shipping
            properties:
                type:
                    type: string
                    enum: [shipping]
                    description: Line item type discriminator
                shipping:
                    $ref: '#/components/schemas/ShippingDetails'
        ProductDetails:
            oneOf:
                - $ref: '#/components/schemas/InlineProductDetails'
                - $ref: '#/components/schemas/CatalogProductWithPriceData'
                - $ref: '#/components/schemas/CatalogProductWithPriceReference'
                - $ref: '#/components/schemas/CatalogProductWithCustomerSelectedPrice'
            description: |
                Provide either inline product data or a `product_id` reference to an existing catalog
                product. Catalog-backed product line items can use an explicit `price` or an existing
                `price_id`, or a validated `customer_selected_price`. Inttegro never falls back to a
                product's default unit price during order creation.
        InlineProductDetails:
            type: object
            additionalProperties: false
            required:
                - name
                - price
                - quantity
                - type
            properties:
                about:
                    type: string
                    description: Long-form description or marketing copy
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                name:
                    type: string
                    description: Product name shown to the customer
                    example: "Premium Widget"
                price:
                    $ref: './catalog.yml#/components/schemas/PriceParams'
                quantity:
                    type: integer
                    minimum: 1
                    description: How many units the customer is purchasing
                    example: 1
                reference:
                    type: string
                    description: Your SKU or internal product reference
                tax_code:
                    type: string
                    description: Tax classification code
                type:
                    type: string
                    enum: [physical, digital, service, voucher, custom, cause]
                    description: Product type—affects shipping requirements
        CatalogProductWithPriceData:
            type: object
            additionalProperties: false
            required:
                - price
                - product_id
                - quantity
            properties:
                price:
                    $ref: './catalog.yml#/components/schemas/PriceParams'
                product_id:
                    type: string
                    description: Existing catalog product ID to snapshot onto the order line item
                    example: "prod_abc123xyz"
                quantity:
                    type: integer
                    minimum: 1
                    description: How many units of the catalog product the customer is purchasing
                    example: 1
        CatalogProductWithPriceReference:
            type: object
            additionalProperties: false
            required:
                - price_id
                - product_id
                - quantity
            properties:
                price_id:
                    type: string
                    description: Existing product price to snapshot onto the order line item. It must belong to the same application and product.
                    example: "pr_xyz789"
                product_id:
                    type: string
                    description: Existing catalog product ID to snapshot onto the order line item
                    example: "prod_abc123xyz"
                quantity:
                    type: integer
                    minimum: 1
                    description: How many units of the catalog product the customer is purchasing
                    example: 1
        CatalogProductWithCustomerSelectedPrice:
            type: object
            additionalProperties: false
            required:
                - customer_selected_price
                - product_id
                - quantity
            properties:
                customer_selected_price:
                    $ref: './customers.yml#/components/schemas/CustomerSelectedPriceInput'
                product_id:
                    type: string
                    description: Existing catalog product ID to snapshot onto the order line item
                    example: "prod_devcongress_donation"
                quantity:
                    type: integer
                    minimum: 1
                    description: How many units of the catalog product the customer is purchasing
                    example: 1
        FeeDetails:
            type: object
            additionalProperties: false
            required:
                - amount
            properties:
                id:
                    type: string
                    description: Fee identifier
                label:
                    type: string
                    description: Customer-facing label for this fee
                tax_code:
                    type: string
                    description: The tax classification code for the shipping fee
                description:
                    type: string
                    description: Customer-facing description for this fee
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                amount:
                    $ref: './common.yml#/components/schemas/AmountParams'
        ShippingDetails:
            type: object
            additionalProperties: false
            required:
                - fee
            properties:
                id:
                    type: string
                    description: Unique ID for this shipping charge
                tax_code:
                    type: string
                    description: The tax classification code for the shipping fee
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                fee:
                    $ref: './common.yml#/components/schemas/AmountParams'
        BillingDetails:
            type: object
            additionalProperties: false
            required: [name]
            properties:
                name:
                    type: string
                    description: Billing contact name
                email_address:
                    type: string
                    format: email
                    description: Billing email address
                phone_number:
                    type: string
                    description: Billing phone number
                address:
                    $ref: '#/components/schemas/Address'
        Shipping:
            type: object
            additionalProperties: false
            required:
                - address
            properties:
                address:
                    $ref: '#/components/schemas/Address'
        Address:
            type: object
            additionalProperties: false
            required: [country]
            properties:
                name:
                    type: string
                    description: Recipient name
                    example: "Customer Name"
                phone_number:
                    type: string
                    description: Contact phone number
                    example: "+233242058841"
                line1:
                    type: string
                    description: Street address line 1
                    example: "23 Adenta High Street"
                line2:
                    type: string
                    description: Street address line 2 (optional)
                    example: "Behind Pantang"
                city:
                    type: string
                    description: City or town
                    example: "Accra"
                region:
                    type: string
                    description: State, province, or region
                    example: "Greater Accra"
                country:
                    type: string
                    description: Country value recorded for the address.
                    example: "GH"
                post_code:
                    type: string
                    description: Postal/ZIP code
                    example: "GHA-123-9822"
        OrderDocumentDeliveryRequest:
            type: object
            additionalProperties: false
            required:
                - order_id
            properties:
                order_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed or_ resource ID.
                    pattern: '^or_'
                    description: Order whose hosted invoice or receipt link should be delivered.
                    example: "or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
        OrderDocumentDeliveryResponse:
            type: object
            additionalProperties: false
            description: Successful or partially successful deliberate order document delivery.
            required: [delivery]
            properties:
                delivery:
                    $ref: '#/components/schemas/OrderDocumentDelivery'
                order:
                    $ref: '#/components/schemas/Order'
        OrderDocumentDeliveryErrorResponse:
            type: object
            additionalProperties: false
            description: Failed order document delivery. Partial delivery and order details are included when available.
            required: [error]
            properties:
                delivery:
                    $ref: '#/components/schemas/OrderDocumentDelivery'
                error:
                    $ref: './common.yml#/components/schemas/Error'
                order:
                    $ref: '#/components/schemas/Order'
        OrderDocumentDelivery:
            type: object
            additionalProperties: false
            description: Delivery result for one hosted order document link.
            required: [document_kind, document_url, sent_channels]
            # A channel is attempted once and is recorded in exactly one outcome
            # collection, so failed channels cannot also be accepted channels.
            x-simile-constraints:
                - set:
                      left: /failed_channels
                      relation: disjoint
                      right: /sent_channels
            properties:
                deliveries:
                    type: array
                    description: Chime messages that were accepted for delivery.
                    items:
                        $ref: '#/components/schemas/OrderDocumentDeliveryAttempt'
                document_kind:
                    type: string
                    enum: [invoice, receipt]
                    description: Hosted document that was delivered.
                    example: "invoice"
                document_url:
                    type: string
                    format: uri
                    description: Hosted invoice or receipt URL sent to the customer. Receipt URLs use the hosted receipt path, not the invoice PDF path.
                    example: "https://pages.inttegro.com/invoices/or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
                failed_channels:
                    type: array
                    description: Channels that failed to send.
                    items:
                        type: string
                        enum: [email, sms]
                    example: ["email"]
                failures:
                    type: array
                    description: Per-channel delivery failures.
                    items:
                        $ref: '#/components/schemas/OrderDocumentDeliveryFailure'
                sent_channels:
                    type: array
                    description: Channels accepted by Chime.
                    items:
                        type: string
                        enum: [email, sms]
                    example: ["sms"]
        OrderDocumentDeliveryAttempt:
            type: object
            additionalProperties: false
            description: Chime delivery accepted for one channel.
            required: [channel]
            properties:
                accepted_at:
                    type: string
                    format: date-time
                    description: Authoritative time at which Chime accepted this channel delivery.
                channel:
                    type: string
                    enum: [email, sms]
                    description: Delivery channel.
                    example: "sms"
                chime_id:
                    type: string
                    # Public serializers always emit this resource with the ch_ type prefix.
                    pattern: '^ch_'
                    description: Chime ID created for this delivery.
                    example: "ch_7QYpB8c3V9kL2nM4"
        OrderDocumentDeliveryFailure:
            type: object
            additionalProperties: false
            description: Chime delivery failure for one channel.
            required: [channel]
            properties:
                channel:
                    type: string
                    enum: [email, sms]
                    description: Delivery channel.
                    example: "email"
                error:
                    type: string
                    description: Provider or Chime error for this channel.
                    example: "chime api returned status=503"
        OrderDocumentDeliverySummary:
            type: object
            additionalProperties: false
            description: Bounded aggregate of Chime-accepted sends for one generated order document.
            required: [channels, latest_sent_at, total_count]
            properties:
                channels:
                    type: object
                    additionalProperties: false
                    description: Accepted send totals grouped by delivery channel. Channels with no accepted sends are omitted.
                    properties:
                        email:
                            $ref: '#/components/schemas/OrderDocumentDeliveryChannelSummary'
                        sms:
                            $ref: '#/components/schemas/OrderDocumentDeliveryChannelSummary'
                latest_sent_at:
                    type: string
                    format: date-time
                    description: Latest authoritative Chime acceptance time across all channels.
                total_count:
                    type: integer
                    format: int64
                    minimum: 1
                    description: Total channel deliveries accepted for this document.
        OrderDocumentDeliveryChannelSummary:
            type: object
            additionalProperties: false
            description: Bounded aggregate of Chime-accepted sends through one channel.
            required: [count, latest_sent_at]
            properties:
                count:
                    type: integer
                    format: int64
                    minimum: 1
                    description: Number of deliveries accepted through this channel.
                latest_sent_at:
                    type: string
                    format: date-time
                    description: Latest authoritative Chime acceptance time for this channel.

        OrderAddress:
            type: object
            additionalProperties: false
            required:
                - country
            properties:
                name:
                    type: string
                phone_number:
                    type: string
                line1:
                    type: string
                line2:
                    type: string
                city:
                    type: string
                region:
                    type: string
                post_code:
                    type: string
                country:
                    type: string
        OrderPaymentMethod:
            type: object
            additionalProperties: false
            required: [id, created_at, customer_id, type, verified]
            # Embedded order payment methods keep their rail-specific snapshot and
            # verification summary coherent without exposing any credentials.
            x-simile-constraints:
                - ordered:
                      paths: [/created_at, /verified_at]
                - implies:
                      when: { path: /verified, equals: false }
                      then:
                          all:
                              - { path: /verified_at, state: absent }
                - implies:
                      when: { path: /verified_at, state: non-null }
                      then:
                          all:
                              - { path: /verified, equals: true }
                - implies:
                      when: { path: /type, equals: mobile_money }
                      then:
                          all:
                              - { path: /mobile_money, state: non-null }
                              - { path: /bank_account, state: absent }
                              - { path: /card, state: absent }
                - implies:
                      when: { path: /type, equals: bank_account }
                      then:
                          all:
                              - { path: /bank_account, state: non-null }
                              - { path: /mobile_money, state: absent }
                              - { path: /card, state: absent }
                - implies:
                      when: { path: /type, equals: card }
                      then:
                          all:
                              - { path: /card, state: non-null }
                              - { path: /mobile_money, state: absent }
                              - { path: /bank_account, state: absent }
                - implies:
                      when: { path: /type, equals: motito }
                      then:
                          all:
                              - { path: /mobile_money, state: absent }
                              - { path: /bank_account, state: absent }
                              - { path: /card, state: absent }
            properties:
                id:
                    type: string
                    # Public serializers always emit this resource with the pm_ type prefix.
                    pattern: '^pm_'
                bank_account:
                    type: object
                    additionalProperties: false
                    required: [type]
                    properties:
                        type:
                            type: string
                        ghana_bank_account:
                            type: object
                            additionalProperties: false
                            required: [account_number]
                            properties:
                                account_number:
                                    type: string
                                branch:
                                    type: string
                                name:
                                    type: string
                                sort_code:
                                    type: string
                                swift_code:
                                    type: string
                card:
                    $ref: './payment-methods.yml#/components/schemas/PaymentMethodCard'
                created_at:
                    type: string
                    format: date-time
                customer_id:
                    type: string
                    # Public serializers always emit this resource with the cu_ type prefix.
                    pattern: '^cu_'
                mobile_money:
                    type: object
                    additionalProperties: false
                    required: [network, account_number, last4]
                    properties:
                        network:
                            type: string
                            enum: [airtel, mtn, telecel, vodafone]
                        account_number:
                            type: string
                            description: Masked number in the form `****1234`.
                            minLength: 8
                            maxLength: 8
                        last4:
                            type: string
                            minLength: 4
                            maxLength: 4
                owner:
                    type: object
                    additionalProperties: false
                    required: [name]
                    properties:
                        name:
                            type: string
                        address:
                            $ref: '#/components/schemas/OrderAddress'
                type:
                    type: string
                    enum: [mobile_money, bank_account, card, motito]
                verified:
                    type: boolean
                verified_at:
                    type: string
                    format: date-time
        OrderPaymentBillingDetails:
            type: object
            additionalProperties: false
            properties:
                owner:
                    type: object
                    additionalProperties: false
                    required: [name]
                    properties:
                        name:
                            type: string
                        address:
                            $ref: '#/components/schemas/OrderAddress'
        OrderPaymentAttempt:
            type: object
            additionalProperties: false
            required: [status, initiated_at]
            # A successful attempt is exactly the branch that owns a success
            # timestamp; this prevents status-only or timestamp-only success claims.
            x-simile-constraints:
                - ordered:
                      paths: [/initiated_at, /succeeded_at]
                - implies:
                      when: { path: /status, equals: succeeded }
                      then:
                          all:
                              - { path: /succeeded_at, state: non-null }
                - implies:
                      when: { path: /succeeded_at, state: non-null }
                      then:
                          all:
                              - { path: /status, equals: succeeded }
            properties:
                payment_method_type:
                    type: string
                payment_method_id:
                    type: string
                    # Public serializers always emit this resource with the pm_ type prefix.
                    pattern: '^pm_'
                error:
                    type: object
                    additionalProperties: false
                    required: [message]
                    properties:
                        message:
                            type: string
                reference:
                    type: string
                status:
                    type: string
                    enum: [initiated, executed, succeeded, canceled, expired, failed, unknown]
                initiated_at:
                    type: string
                    format: date-time
                succeeded_at:
                    type: string
                    format: date-time
        OrderPaymentError:
            type: object
            additionalProperties: false
            required: [message, docs_url, source, type, code]
            properties:
                message:
                    type: string
                docs_url:
                    type: string
                    format: uri
                source:
                    type: string
                type:
                    type: string
                code:
                    type: string
        OrderResponse:
            type: object
            additionalProperties: false
            required:
                - order
            properties:
                order:
                    $ref: '#/components/schemas/Order'
        OrderErrorResponse:
            type: object
            additionalProperties: false
            description: Order operation error. The latest Order snapshot is included when available.
            required: [error]
            properties:
                error:
                    $ref: './common.yml#/components/schemas/Error'
                order:
                    $ref: '#/components/schemas/Order'
        Order:
            type: object
            additionalProperties: false
            description: Complete order record with line items, customer details, payment state, and fulfillment information
            required:
                - customer
                - id
                - initiated_at
                - status
            # The public order state is derived from these timestamps, and the
            # payment amount is an exact binding to the immutable order total.
            x-simile-constraints:
                - ordered:
                      paths: [/initiated_at, /sealed_at, /paid_at, /completed_at]
                - ordered:
                      paths: [/initiated_at, /canceled_at]
                - ordered:
                      paths: [/initiated_at, /expires_at]
                - implies:
                      when: { path: /status, equals: preparing }
                      then:
                          all:
                              - { path: /sealed_at, state: absent }
                              - { path: /paid_at, state: absent }
                              - { path: /completed_at, state: absent }
                              - { path: /canceled_at, state: absent }
                - implies:
                      when: { path: /status, equals: requires_payment }
                      then:
                          all:
                              - { path: /sealed_at, state: non-null }
                              - { path: /paid_at, state: absent }
                              - { path: /completed_at, state: absent }
                              - { path: /canceled_at, state: absent }
                - implies:
                      when: { path: /status, equals: paid }
                      then:
                          all:
                              - { path: /sealed_at, state: non-null }
                              - { path: /paid_at, state: non-null }
                              - { path: /completed_at, state: absent }
                              - { path: /canceled_at, state: absent }
                - implies:
                      when: { path: /status, equals: completed }
                      then:
                          all:
                              - { path: /sealed_at, state: non-null }
                              - { path: /completed_at, state: non-null }
                              - { path: /canceled_at, state: absent }
                - implies:
                      when: { path: /status, equals: canceled }
                      then:
                          all:
                              - { path: /paid_at, state: absent }
                              - { path: /completed_at, state: absent }
                              - { path: /canceled_at, state: non-null }
                - implies:
                      when: { path: /status, equals: expired }
                      then:
                          all:
                              - { path: /expires_at, state: non-null }
                              - { path: /paid_at, state: absent }
                              - { path: /completed_at, state: absent }
                              - { path: /canceled_at, state: absent }
                - implies:
                      when: { path: /status, equals: unknown }
                      then:
                          all:
                              - { path: /sealed_at, state: absent }
                              - { path: /paid_at, state: absent }
                              - { path: /completed_at, state: absent }
                              - { path: /canceled_at, state: absent }
                - equal:
                      paths: [/line_item_group/total/currency, /payment/amount/currency]
                - equal:
                      paths: [/line_item_group/total/value, /payment/amount/value]
            properties:
                canceled_at:
                    type: string
                    format: date-time
                    description: When the order was canceled. Omitted otherwise.
                checkout_settings:
                    type: object
                    additionalProperties: false
                    description: Checkout and payment flow configuration for this order
                    properties:
                        redirect_url:
                            type: string
                            format: uri
                            description: URL to redirect the customer after payment completion
                        cancel_url:
                            type: string
                            format: uri
                            description: URL to redirect the customer after canceling checkout
                completed_at:
                    type: string
                    format: date-time
                    description: When the order was completed. Omitted otherwise.
                created_from:
                    type: object
                    additionalProperties: false
                    description: Attribution for the public resource that created this order, when available.
                    properties:
                        source:
                            type: string
                        resource_type:
                            type: string
                            enum: [purchase_intent]
                        resource_id:
                            type: string
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                customer:
                    type: object
                    additionalProperties: false
                    required:
                        - guest
                        - id
                        - name
                    properties:
                        id:
                            type: string
                            # Public serializers always emit this resource with the cu_ type prefix.
                            pattern: '^cu_'
                        guest:
                            type: boolean
                        name:
                            type: string
                        email_address:
                            type: string
                            format: email
                        phone_number:
                            type: string
                        billing_address:
                            $ref: '#/components/schemas/OrderAddress'
                        shipping_address:
                            $ref: '#/components/schemas/OrderAddress'
                expires_at:
                    type: string
                    format: date-time
                    description: When the order expires. Omitted when no expiry is set.
                id:
                    type: string
                    # Public serializers always emit this resource with the or_ type prefix.
                    pattern: '^or_'
                    description: Unique identifier for this order
                    example: "or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
                initiated_at:
                    type: string
                    format: date-time
                    description: When order processing began
                invoice:
                    type: object
                    additionalProperties: false
                    required: [format]
                    properties:
                        delivery_summary:
                            $ref: '#/components/schemas/OrderDocumentDeliverySummary'
                        number:
                            type: string
                        format:
                            type: object
                            additionalProperties: false
                            required: [web, pdf]
                            properties:
                                web:
                                    $ref: '#/components/schemas/OrderDocumentFormat'
                                pdf:
                                    $ref: '#/components/schemas/OrderDocumentFormat'
                number:
                    type: string
                    description: Human-readable order number
                    example: "ORDER-12345"
                receipt_number:
                    type: string
                    description: Merchant-provided receipt number, when set
                    example: "RCPT-12345"
                refunds:
                    type: array
                    description: All refunds issued for this order, newest first. Omitted when no refunds exist.
                    items:
                        $ref: './refunds.yml#/components/schemas/Refund'
                invoice_settings:
                    $ref: '#/components/schemas/InvoiceSettings'
                status:
                    type: string
                    enum: [preparing, requires_payment, paid, completed, canceled, expired, unknown]
                    description: Current lifecycle state of the order
                    example: "completed"
                sealed_at:
                    type: string
                    format: date-time
                    description: When the order was finalized and became immutable—ready for payment or fulfillment
                    example: "2025-09-14T16:24:41.312701813Z"
                line_item_group:
                    type: object
                    additionalProperties: false
                    description: Cart contents and totals
                    required:
                        - line_items
                        - total
                    properties:
                        line_items:
                            type: array
                            description: Array of products, fees, and shipping charges
                            # Why: the order builder rejects an empty resolved group, so a persisted
                            # order can never expose a line-item group without at least one item.
                            minItems: 1
                            items:
                                $ref: '#/components/schemas/OrderLineItem'
                        total:
                            $ref: './common.yml#/components/schemas/Amount'
                payment:
                    type: object
                    additionalProperties: false
                    description: Payment intent tied to this order
                    required:
                        - amount
                        - id
                        - initiated_at
                        - statement_descriptor
                        - status
                    # Payment state is derived from these public timestamps and
                    # action fields; the parent constraint binds its amount to order.
                    x-simile-constraints:
                        - ordered:
                              paths: [/initiated_at, /executed_at, /paid_at]
                        - ordered:
                              paths: [/initiated_at, /executed_at, /failed_at]
                        - ordered:
                              paths: [/initiated_at, /canceled_at]
                        - ordered:
                              paths: [/initiated_at, /expired_at]
                        - implies:
                              when: { path: /status, equals: initiated }
                              then:
                                  all:
                                      - { path: /executed_at, state: absent }
                                      - { path: /paid_at, state: absent }
                                      - { path: /failed_at, state: absent }
                                      - { path: /canceled_at, state: absent }
                                      - { path: /expired_at, state: absent }
                        - implies:
                              when: { path: /status, equals: requires_action }
                              then:
                                  all:
                                      - { path: /next_action, state: non-null }
                                      - { path: /paid_at, state: absent }
                                      - { path: /failed_at, state: absent }
                                      - { path: /canceled_at, state: absent }
                                      - { path: /expired_at, state: absent }
                        - implies:
                              when: { path: /status, equals: processing }
                              then:
                                  all:
                                      - { path: /paid_at, state: absent }
                                      - { path: /failed_at, state: absent }
                                      - { path: /canceled_at, state: absent }
                                      - { path: /expired_at, state: absent }
                        - implies:
                              when: { path: /status, equals: overdue }
                              then:
                                  all:
                                      - { path: /due_at, state: non-null }
                                      - { path: /paid_at, state: absent }
                                      - { path: /failed_at, state: absent }
                                      - { path: /canceled_at, state: absent }
                                      - { path: /expired_at, state: absent }
                        - implies:
                              when: { path: /status, equals: executed }
                              then:
                                  all:
                                      - { path: /executed_at, state: non-null }
                                      - { path: /paid_at, state: absent }
                                      - { path: /failed_at, state: absent }
                                      - { path: /canceled_at, state: absent }
                                      - { path: /expired_at, state: absent }
                        - implies:
                              when: { path: /status, equals: paid }
                              then:
                                  all:
                                      - { path: /paid_at, state: non-null }
                                      - { path: /failed_at, state: absent }
                                      - { path: /canceled_at, state: absent }
                                      - { path: /expired_at, state: absent }
                        - implies:
                              when: { path: /status, equals: failed }
                              then:
                                  all:
                                      - { path: /paid_at, state: absent }
                                      - { path: /failed_at, state: non-null }
                                      - { path: /canceled_at, state: absent }
                                      - { path: /expired_at, state: absent }
                        - implies:
                              when: { path: /status, equals: canceled }
                              then:
                                  all:
                                      - { path: /paid_at, state: absent }
                                      - { path: /failed_at, state: absent }
                                      - { path: /canceled_at, state: non-null }
                                      - { path: /expired_at, state: absent }
                        - implies:
                              when: { path: /status, equals: expired }
                              then:
                                  all:
                                      - { path: /paid_at, state: absent }
                                      - { path: /failed_at, state: absent }
                                      - { path: /canceled_at, state: absent }
                                      - { path: /expired_at, state: non-null }
                        # `unknown` is retained for compatibility, but it cannot claim
                        # any public signal that would deterministically select a real state.
                        - implies:
                              when: { path: /status, equals: unknown }
                              then:
                                  all:
                                      - { path: /executed_at, state: absent }
                                      - { path: /paid_at, state: absent }
                                      - { path: /failed_at, state: absent }
                                      - { path: /canceled_at, state: absent }
                                      - { path: /expired_at, state: absent }
                                      - { path: /next_action, state: absent }
                    properties:
                        id:
                            type: string
                            # Public serializers always emit this resource with the py_ type prefix.
                            pattern: '^py_'
                            description: Payment intent ID
                            example: "py_OHFv6I3OZBvB1R46TQQGNxPPtgbPR6CXpQ8En9wl"
                        status:
                            type: string
                            enum: [initiated, requires_action, processing, overdue, executed, paid, canceled, expired, failed, unknown]
                            description: Payment state
                            example: "paid"
                        statement_descriptor:
                            type: string
                            description: Optional statement descriptor shown on the customer's bank statement
                            example: "STATEMENT"
                        amount:
                            $ref: './common.yml#/components/schemas/Amount'
                        balance_transaction:
                            $ref: './finance.yml#/components/schemas/BalanceTransaction'
                        payment_method:
                            $ref: '#/components/schemas/OrderPaymentMethod'
                        billing_details:
                            type: object
                            additionalProperties: false
                            properties:
                                owner:
                                    type: object
                                    additionalProperties: false
                                    required: [name]
                                    properties:
                                        name:
                                            type: string
                                        address:
                                            $ref: '#/components/schemas/OrderAddress'
                        receipt:
                            $ref: '#/components/schemas/OrderReceipt'
                        customer:
                            type: object
                            additionalProperties: false
                            required: [id, guest, name]
                            properties:
                                id:
                                    type: string
                                    # Public serializers always emit this resource with the cu_ type prefix.
                                    pattern: '^cu_'
                                guest:
                                    type: boolean
                                name:
                                    type: string
                                email_address:
                                    type: string
                                    format: email
                                phone_number:
                                    type: string
                                billing_address:
                                    $ref: '#/components/schemas/OrderAddress'
                                shipping_address:
                                    $ref: '#/components/schemas/OrderAddress'
                        latest_attempt:
                            type: object
                            additionalProperties: false
                            description: Most recent payment attempt details
                            required: [status, initiated_at]
                            # The inline order projection must preserve the same
                            # success timestamp contract as OrderPaymentAttempt.
                            x-simile-constraints:
                                - ordered:
                                      paths: [/initiated_at, /succeeded_at]
                                - implies:
                                      when: { path: /status, equals: succeeded }
                                      then:
                                          all:
                                              - { path: /succeeded_at, state: non-null }
                                - implies:
                                      when: { path: /succeeded_at, state: non-null }
                                      then:
                                          all:
                                              - { path: /status, equals: succeeded }
                            properties:
                                payment_method_type:
                                    type: string
                                    example: "mobile_money"
                                payment_method_id:
                                    type: string
                                    # Public serializers always emit this resource with the pm_ type prefix.
                                    pattern: '^pm_'
                                    example: "pm_hg7D2A5qT6g6mVDSJu6zweKXwsiiNWf3Q85book6"
                                error:
                                    type: object
                                    additionalProperties: false
                                    required: [message]
                                    properties:
                                        message:
                                            type: string
                                reference:
                                    type: string
                                    description: External payment reference
                                    example: "68c6ecbc3bf0a6548973b598"
                                status:
                                    type: string
                                    enum: [initiated, executed, succeeded, canceled, expired, failed, unknown]
                                    example: "succeeded"
                                initiated_at:
                                    type: string
                                    format: date-time
                                succeeded_at:
                                    type: string
                                    format: date-time
                        next_action:
                            $ref: '#/components/schemas/PaymentNextAction'
                        latest_error:
                            type: object
                            additionalProperties: false
                            required: [message, docs_url, source, type, code]
                            properties:
                                message:
                                    type: string
                                docs_url:
                                    type: string
                                    format: uri
                                source:
                                    type: string
                                type:
                                    type: string
                                code:
                                    type: string
                        initiated_at:
                            type: string
                            format: date-time
                            description: When we kicked off the payment intent
                        executed_at:
                            type: string
                            format: date-time
                            description: When payment execution started
                        paid_at:
                            type: string
                            format: date-time
                            description: When payment completed successfully
                        canceled_at:
                            type: string
                            format: date-time
                            description: When payment was canceled
                        due_at:
                            type: string
                            format: date-time
                            description: When payment becomes overdue
                        expired_at:
                            type: string
                            format: date-time
                            description: When payment expired
                        failed_at:
                            type: string
                            format: date-time
                            description: When payment failed
                        paid_offline:
                            type: boolean
                            description: Whether payment was recorded as received outside Inttegro
                        payment_method_types:
                            type: array
                            items:
                                type: string
                        payout_configuration:
                            type: object
                            additionalProperties: false
                            description: Payout configuration for this payment
                            nullable: true
                            required: [enable_fx, destination]
                            properties:
                                enable_fx:
                                    type: boolean
                                    enum: [false]
                                    description: Compatibility flag. Cross-currency payout execution is not currently available.
                                    example: false
                                destination:
                                    type: object
                                    additionalProperties: false
                                    description: Where the funds will be paid out
                                    required: [financial_account_id]
                                    properties:
                                        financial_account_id:
                                            type: string
                                            # Public serializers always emit this resource with the fa_ type prefix.
                                            pattern: '^fa_'
                                            description: ID of the financial account receiving the payout
                                            example: "fa_1234567890abcdef"
                paid_at:
                    type: string
                    format: date-time
                    description: When the order became paid
                payment_due_at:
                    type: string
                    format: date-time
                    description: When the order payment becomes overdue
                reference:
                    type: string
                    description: External order reference when present
        OrderDocumentFormat:
            type: object
            additionalProperties: false
            required:
                - url
            properties:
                url:
                    type: string
                    format: uri
        OrderReceipt:
            type: object
            additionalProperties: false
            description: Receipt issued for a paid order payment.
            required: [format]
            properties:
                number:
                    type: string
                delivery_summary:
                    $ref: '#/components/schemas/OrderDocumentDeliverySummary'
                format:
                    type: object
                    additionalProperties: false
                    required: [web, pdf]
                    properties:
                        web:
                            $ref: '#/components/schemas/OrderDocumentFormat'
                        pdf:
                            $ref: '#/components/schemas/OrderDocumentFormat'
        UpdateOrderPaymentMethodData:
            type: object
            additionalProperties: false
            description: New mobile-money payment method and required owner details for an order update.
            required: [type, mobile_money, billing_details]
            properties:
                type:
                    type: string
                    enum: [mobile_money]
                mobile_money:
                    $ref: '#/components/schemas/UpdateOrderMobileMoneyInput'
                billing_details:
                    $ref: '#/components/schemas/UpdateOrderPaymentMethodOwnerInput'
        PayOrderPaymentMethodData:
            type: object
            additionalProperties: false
            description: New mobile-money payment method details supplied while paying an order.
            required: [type, mobile_money]
            properties:
                type:
                    type: string
                    enum: [mobile_money]
                mobile_money:
                    $ref: './payment-methods.yml#/components/schemas/PaymentMethodMobileMoneyInput'
                billing_details:
                    $ref: './payment-methods.yml#/components/schemas/PaymentMethodBillingDetailsInput'
                shipping:
                    $ref: './payment-methods.yml#/components/schemas/PaymentMethodShippingInput'
        UpdateOrderMobileMoneyInput:
            type: object
            additionalProperties: false
            required: [network, account_number]
            properties:
                network:
                    type: string
                    enum: [airtel, mtn, telecel, vodafone]
                account_number:
                    type: string
                    pattern: '^(\+?\d{10,15})$'
        UpdateOrderPaymentMethodOwnerInput:
            type: object
            additionalProperties: false
            required: [name, address]
            properties:
                name:
                    type: string
                address:
                    type: object
                    additionalProperties: false
                    required: [country]
                    properties:
                        country:
                            type: string
        CreateOrderRequest:
            oneOf:
                - $ref: '#/components/schemas/CreateOrderNewCustomer'
                - $ref: '#/components/schemas/CreateOrderExistingCustomer'
        LookupOrderRequest:
            type: object
            additionalProperties: false
            required:
                - order_id
            properties:
                order_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed or_ resource ID.
                    pattern: '^or_'
                    description: Unique identifier of the order to lookup
                    example: "or_JoPtqOmsjgZKwkPvqTrqGsopu07wfC7ttoWqmfwt"
        UpdateOrderRequest:
            type: object
            additionalProperties: false
            required:
                - order_id
            allOf:
                - not:
                      required: [payment_method_id, payment_method_data]
                      properties:
                          payment_method_id: {}
                          payment_method_data: {}
                - not:
                      required: [clear_payment_method, payment_method_id]
                      properties:
                          clear_payment_method:
                              enum: [true]
                          payment_method_id: {}
                - not:
                      required: [clear_payment_method, payment_method_data]
                      properties:
                          clear_payment_method:
                              enum: [true]
                          payment_method_data: {}
                - not:
                      required: [statement_descriptor, statement_descriptor_prefix]
                      properties:
                          statement_descriptor: {}
                          statement_descriptor_prefix: {}
            properties:
                clear_payment_method:
                    type: boolean
                    description: |
                        Clears the currently attached payment method. Mutually exclusive with
                        `payment_method_id` and `payment_method_data`.
                    default: false
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                invoice_settings:
                    $ref: '#/components/schemas/InvoiceSettings'
                finalize:
                    type: boolean
                    description: |
                        Explicit seal decision. Set to `false` to reopen a sealed order and leave it
                        open, or `true` to seal or reseal the order after applying the requested
                        mutations.
                line_items:
                    type: array
                    description: |
                        Full replacement for the order's line items. Omit this field to keep the
                        current line items unchanged.
                    minItems: 1
                    items:
                        $ref: '#/components/schemas/LineItem'
                number:
                    type: string
                    description: Replacement order number.
                    example: "ORDER-12345-REV2"
                receipt_number:
                    type: string
                    description: |
                        Replacement receipt number. Once set, it cannot be unset; provide a
                        different non-empty value to change it. No uniqueness is enforced.
                    example: "RCPT-12345-REV2"
                order_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed or_ resource ID.
                    pattern: '^or_'
                    description: Unique identifier of the order to update.
                    example: "or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
                payment_method_data:
                    allOf:
                        - $ref: '#/components/schemas/UpdateOrderPaymentMethodData'
                    description: |
                        New payment method details to tokenize and attach to the order. Currently
                        only `mobile_money` is supported for order updates. When using inline mobile
                        money details, include `billing_details.name` and
                        `billing_details.address.country`.
                payment_method_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed pm_ resource ID.
                    pattern: '^pm_'
                    description: |
                        ID of a saved payment method to attach to the order. Mutually exclusive
                        with `payment_method_data` and `clear_payment_method`.
                    example: "pm_xyz123abc456"
                statement_descriptor:
                    type: string
                    description: Replacement payment statement descriptor for the order's payment.
                    example: "ORDER 12345"
                    minLength: 3
                    maxLength: 22
                statement_descriptor_prefix:
                    type: string
                    description: Static prefix used to build the replacement descriptor as `prefix*order_id`. Mutually exclusive with `statement_descriptor`.
                    example: "LINE"
                    minLength: 2
                    maxLength: 10
                    pattern: '^[^*]+$'
        PayOrderRequest:
            type: object
            additionalProperties: false
            required:
                - order_id
            allOf:
                - not:
                      required: [payment_method_id, payment_method_data]
                      properties:
                          payment_method_id: {}
                          payment_method_data: {}
                - not:
                      required: [paid_out_of_band, payment_method_id]
                      properties:
                          paid_out_of_band:
                              enum: [true]
                          payment_method_id: {}
                - not:
                      required: [paid_out_of_band, payment_method_data]
                      properties:
                          paid_out_of_band:
                              enum: [true]
                          payment_method_data: {}
                - anyOf:
                    - not:
                          required: [save_payment_method, payment_method_data]
                          properties:
                              save_payment_method:
                                  enum: [true]
                              payment_method_data: {}
                    - properties:
                          payment_method_data:
                              type: object
                              additionalProperties: true
                              required: [billing_details]
                              properties:
                                  billing_details: {}
            properties:
                order_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed or_ resource ID.
                    pattern: '^or_'
                    description: Unique identifier of the order to pay
                    example: "or_GKj7A8lM5wEGRUvbqpI4bkDFsQvpqVyh5fqePNnb"
                payment_method_types:
                    type: array
                    description: Payment method types to expose for this payment attempt.
                    items:
                        $ref: './payment-methods.yml#/components/schemas/PaymentMethodType'
                payment_method_data:
                    $ref: '#/components/schemas/PayOrderPaymentMethodData'
                payment_method_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed pm_ resource ID.
                    pattern: '^pm_'
                    description: ID of a saved payment method to use for this payment
                    example: "pm_xyz123abc456"
                save_payment_method:
                    type: boolean
                    default: false
                    description: Save a newly supplied payment method. When true and payment_method_data is present, billing_details is required.
                paid_out_of_band:
                    type: boolean
                    description: |
                        Set to true if payment was received outside Inttegro (cash, bank transfer, check).
                        Marks the payment as paid offline. Mutually exclusive with payment_method_id and
                        payment_method_data. Defaults to false.
                    default: false
                    example: false
        ConfirmPaymentRequest:
            type: object
            additionalProperties: false
            required:
                - order_id
                - payment_id
                - confirmation_id
                - token
            properties:
                order_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed or_ resource ID.
                    pattern: '^or_'
                    description: Unique identifier of the order
                    example: "or_JoPtqOmsjgZKwkPvqTrqGsopu07wfC7ttoWqmfwt"
                payment_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed py_ resource ID.
                    pattern: '^py_'
                    description: Unique identifier of the payment being confirmed
                    example: "py_123"
                confirmation_id:
                    type: string
                    description: Unique identifier of the confirmation challenge
                    example: "conf_123"
                token:
                    type: string
                    description: Verification token (OTP) sent to customer
                    example: "302673"
        RequestConfirmationRequest:
            type: object
            additionalProperties: false
            required:
                - order_id
            properties:
                order_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed or_ resource ID.
                    pattern: '^or_'
                    description: Unique identifier of the order
                    example: "or_kAVwBsk6EhQVv2YBUhYAqMf0lktEoQ0S7ZR8y2xi"
        CancelOrderRequest:
            type: object
            additionalProperties: false
            required:
                - order_id
            properties:
                order_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed or_ resource ID.
                    pattern: '^or_'
                    description: Unique identifier of the order to cancel
                reason:
                    type: string
                    description: Optional reason for cancelling the order
                execute_refund:
                    type: boolean
                    description: Whether the cancellation evidence should record that a refund was requested. This does not execute a refund.
                    default: false
        FinalizeOrderRequest:
            type: object
            additionalProperties: false
            required:
                - order_id
            properties:
                order_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed or_ resource ID.
                    pattern: '^or_'
                    description: Unique identifier of the order to finalize
                    example: "or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
        FinalizeOrderResponse:
            type: object
            additionalProperties: false
            required: [order]
            properties:
                order:
                    $ref: '#/components/schemas/Order'
            example:
                order:
                    id: "or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
                    number: "ORDER-12345"
                    status: "requires_payment"
                    sealed_at: "2025-01-25T10:30:00Z"
                    initiated_at: "2025-01-25T10:25:00Z"
                    expires_at: "2025-02-01T10:25:00Z"
                    customer:
                        id: "cu_abc123def456"
                        guest: false
                        name: "Akua Mensah"
        CompleteOrderRequest:
            type: object
            additionalProperties: false
            required:
                - order_id
            properties:
                order_id:
                    type: string
                    # Why: a successful response preserves this selector as a typed or_ resource ID.
                    pattern: '^or_'
                    description: Unique identifier of the order to complete
                    example: "or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
                paid_out_of_band:
                    type: boolean
                    description: |
                        Set to true if payment was received outside Inttegro
                        (e.g., cash, bank transfer, check). When true, the associated payment
                        will be marked as paid offline before completing the order.
                    default: false
                    example: false
        CompleteOrderResponse:
            type: object
            additionalProperties: false
            required: [order]
            properties:
                order:
                    $ref: '#/components/schemas/Order'
            example:
                order:
                    id: "or_48ZW7BGvYUBWc1i6WBkL2jr0iPQP5jUy76mmmHpt"
                    number: "ORDER-12345"
                    status: "completed"
                    completed_at: "2025-01-25T11:00:00Z"
                    sealed_at: "2025-01-25T10:30:00Z"
                    initiated_at: "2025-01-25T10:25:00Z"
                    expires_at: "2025-02-01T10:25:00Z"
                    customer:
                        id: "cu_abc123def456"
                        guest: false
                        name: "Akua Mensah"
        PageOrdersRequest:
            type: object
            additionalProperties: false
            required:
                - page_size
            properties:
                page_number:
                    type: integer
                    minimum: 0
                    maximum: 10
                    description: Zero-based page index to fetch (0-10 inclusive)
                    default: 0
                page_size:
                    type: integer
                    minimum: 1
                    maximum: 256
                    description: Number of orders per page (1-256)
                customer_id:
                    type: string
                    description: |
                        When provided, restricts results to orders belonging
                        to this customer. The customer must belong to the
                        authenticated application.
        PageOrdersResponse:
            type: object
            additionalProperties: false
            required: [page]
            properties:
                page:
                    type: object
                    additionalProperties: false
                    required: [number, size, orders]
                    # Product/customer filters can shrink the selected order page.
                    x-simile-constraints:
                        - aggregate:
                              target: /size
                              operation: count
                              source: /orders/*
                    properties:
                        number:
                            type: integer
                            description: The page number returned
                        size:
                            type: integer
                            description: The number of orders in this page
                        orders:
                            type: array
                            items:
                                $ref: '#/components/schemas/Order'
