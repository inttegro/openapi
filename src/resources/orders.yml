# Authoritative orders resource contract.
# Why: keeping each resource's operations and schemas together makes public invariants
# reviewable without weakening the single bundled contract distributed to consumers.

paths:
    /orders/create:
        post:
            summary: Create a new order
            description: |
                Creates a new order in Inttegro. This endpoint supports two flows:
                1. New customer flow: Provide `customer_data` to create a new customer and order
                2. Existing customer flow: Provide `customer_id` and optionally `payment_method_id` for known customers

                The order can be configured to execute payment immediately or require manual payment later.
            operationId: createOrder
            tags:
                - Orders
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateOrderRequest'
                        # Why: a provider-authored request gives integrators a stable, executable
                        # finalized-order fixture instead of relying on unrelated random field values.
                        examples:
                            finalized_requires_payment:
                                summary: Create and finalize an order without executing payment
                                value:
                                    request_meta:
                                        idempotency_key: simile-order-create-001
                                    number: SIMILE-ORDER-001
                                    finalize: true
                                    execute_payment: false
                                    checkout_settings:
                                        redirect_url: https://example.test/checkout/success
                                        cancel_url: https://example.test/checkout/cancel
                                    customer_data:
                                        name: Ama Mensah
                                        email_address: ama@example.test
                                        phone_number: '+233242057831'
                                    line_items:
                                        - type: product
                                          product:
                                              type: physical
                                              name: Premium Cotton T-Shirt
                                              quantity: 1
                                              price:
                                                  currency: ghs
                                                  value: 20000
            responses:
                '200':
                    description: Order created successfully
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                            # OpenAPI proves the request and response independently. This relation
                            # additionally proves that the returned Order is reachable from this
                            # particular create request.
                            x-simile-from-request:
                                bindings:
                                    - { from: /customer_id, to: /order/customer/id }
                                    - { from: /customer_data/name, to: /order/customer/name }
                                    - { from: /customer_data/email_address, to: /order/customer/email_address }
                                    - { from: /customer_data/phone_number, to: /order/customer/phone_number }
                                    - { from: /number, to: /order/number }
                                    - { from: /receipt_number, to: /order/receipt_number }
                                    - { from: /custom_data, to: /order/custom_data }
                                    - { from: /line_items, to: /order/line_item_group/line_items }
                                    - { from: /line_items/*/product/price/currency, to: /order/line_item_group/total/currency }
                                    - { from: /line_items/*/fee/amount/currency, to: /order/line_item_group/total/currency }
                                    - { from: /line_items/*/shipping/fee/currency, to: /order/line_item_group/total/currency }
                                    - to: /order/line_item_group/total/value
                                      value:
                                          add:
                                              - sum:
                                                    each: /line_items/*/product
                                                    value:
                                                        multiply:
                                                            - { path: /quantity }
                                                            - { path: /price/value }
                                              - sum:
                                                    each: /line_items/*/fee
                                                    value: { path: /amount/value }
                                              - sum:
                                                    each: /line_items/*/shipping
                                                    value: { path: /fee/value }
                                rules:
                                    - when:
                                          all:
                                              - { request: /execute_payment, equals: false, default: false }
                                              - { request: /finalize, equals: true, default: false }
                                      then:
                                          set: { /order/status: requires_payment }
                                          omit: [/order/paid_at, /order/completed_at, /order/canceled_at, /order/refunds]
                                    - when:
                                          all:
                                              - { request: /execute_payment, equals: false, default: false }
                                              - { request: /finalize, equals: false, default: false }
                                      then:
                                          set: { /order/status: preparing }
                                          omit: [/order/sealed_at, /order/paid_at, /order/completed_at, /order/canceled_at, /order/payment, /order/refunds]
                            # Why: these are the public create-order branches callers must handle;
                            # exact coherent payloads are safer integration fixtures than random synthesis.
                            examples:
                                requires_payment:
                                    summary: Finalized order awaiting payment
                                    value:
                                        order:
                                            checkout_settings:
                                                redirect_url: https://example.test/checkout/success?order_id=or_simile_requires_payment
                                                cancel_url: https://example.test/checkout/cancel?order_id=or_simile_requires_payment
                                            customer:
                                                guest: true
                                                id: cu_simile_guest
                                                name: Ama Mensah
                                                email_address: ama@example.test
                                                phone_number: '+233242057831'
                                            expires_at: '2026-11-25T12:00:00Z'
                                            id: or_simile_requires_payment
                                            initiated_at: '2026-11-18T12:00:00Z'
                                            line_item_group:
                                                line_items:
                                                    - type: product
                                                      product:
                                                          id: oli_simile_tshirt
                                                          name: Premium Cotton T-Shirt
                                                          price: { currency: ghs, value: 20000 }
                                                          quantity: 1
                                                total: { currency: ghs, value: 20000 }
                                            number: SIMILE-ORDER-001
                                            payment:
                                                amount: { currency: ghs, value: 20000 }
                                                id: py_simile_requires_payment
                                                initiated_at: '2026-11-18T12:00:00Z'
                                                statement_descriptor: INTTEGRO ORDER
                                                status: initiated
                                            sealed_at: '2026-11-18T12:00:01Z'
                                            status: requires_payment
                                requires_action:
                                    summary: Finalized order whose payment needs customer action
                                    value:
                                        order:
                                            customer:
                                                guest: true
                                                id: cu_simile_action
                                                name: Ama Mensah
                                                email_address: ama@example.test
                                            expires_at: '2026-11-25T12:00:00Z'
                                            id: or_simile_requires_action
                                            initiated_at: '2026-11-18T12:00:00Z'
                                            line_item_group:
                                                line_items:
                                                    - type: product
                                                      product:
                                                          id: oli_simile_action_tshirt
                                                          name: Premium Cotton T-Shirt
                                                          price: { currency: ghs, value: 20000 }
                                                          quantity: 1
                                                total: { currency: ghs, value: 20000 }
                                            number: SIMILE-ORDER-ACTION
                                            payment:
                                                amount: { currency: ghs, value: 20000 }
                                                id: py_simile_requires_action
                                                initiated_at: '2026-11-18T12:00:00Z'
                                                next_action:
                                                    type: redirect
                                                    redirect:
                                                        redirect_url: https://example.test/payments/authorize
                                                        valid_until: '2026-11-18T13:00:00Z'
                                                statement_descriptor: INTTEGRO ORDER
                                                status: requires_action
                                            sealed_at: '2026-11-18T12:00:01Z'
                                            status: requires_payment
                                paid:
                                    summary: Order paid during creation
                                    value:
                                        order:
                                            customer:
                                                guest: false
                                                id: cu_simile_existing
                                                name: Ama Mensah
                                            expires_at: '2026-11-25T12:00:00Z'
                                            id: or_simile_paid
                                            initiated_at: '2026-11-18T12:00:00Z'
                                            line_item_group:
                                                line_items:
                                                    - type: product
                                                      product:
                                                          id: oli_simile_paid_tshirt
                                                          name: Premium Cotton T-Shirt
                                                          price: { currency: ghs, value: 20000 }
                                                          quantity: 1
                                                total: { currency: ghs, value: 20000 }
                                            number: SIMILE-ORDER-PAID
                                            paid_at: '2026-11-18T12:00:05Z'
                                            payment:
                                                amount: { currency: ghs, value: 20000 }
                                                executed_at: '2026-11-18T12:00:02Z'
                                                id: py_simile_paid
                                                initiated_at: '2026-11-18T12:00:00Z'
                                                paid_at: '2026-11-18T12:00:05Z'
                                                statement_descriptor: INTTEGRO ORDER
                                                status: paid
                                            sealed_at: '2026-11-18T12:00:01Z'
                                            status: paid
                                zero_total_completed:
                                    summary: Finalized zero-total order completed without a payment
                                    value:
                                        order:
                                            customer:
                                                guest: true
                                                id: cu_simile_zero_total
                                                name: Ama Mensah
                                                email_address: ama@example.test
                                            completed_at: '2026-11-18T12:00:02Z'
                                            expires_at: '2026-11-25T12:00:00Z'
                                            id: or_simile_zero_total
                                            initiated_at: '2026-11-18T12:00:00Z'
                                            line_item_group:
                                                line_items:
                                                    - type: product
                                                      product:
                                                          id: oli_simile_zero_total_product
                                                          name: Promotional Item
                                                          price: { currency: ghs, value: 0 }
                                                          quantity: 1
                                                total: { currency: ghs, value: 0 }
                                            number: SIMILE-ORDER-ZERO
                                            sealed_at: '2026-11-18T12:00:01Z'
                                            status: completed
                '400':
                    description: Bad request - invalid parameters
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/Error'
                                    - oneOf:
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [precondition_unmet] }, code: { enum: [coupon_not_applicable, coupon_unavailable, payment_acceptance_restricted, price_archived, price_inactive, product_archived] }, fix_code: { enum: [satisfy_precondition] }, type: { enum: [bad_request] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [idempotency_key_invalid, idempotency_key_mismatch, idempotency_key_unsupported] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [idempotency_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_body] }, code: { enum: [invalid_request_body] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [invalid_request_parameter, request_parameter_null_rejected, request_parameter_parse_failed, request_parameter_too_large, request_parameter_too_small, request_parameter_type_mismatch, request_parameter_value_not_allowed, request_parameters_mutually_exclusive, unexpected_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/t-invalid_request_parameter"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [invalid_request_parameter] }, code: { enum: [coupon_duplicate, coupon_not_found, invalid_line_items, order_customer_invalid, order_line_item_limit_exceeded, order_total_limit_exceeded, payment_method_invalid, price_not_found, product_not_found, request_parameter_choice_required, request_parameter_null_rejected, request_parameter_parse_failed, request_parameter_too_large, request_parameter_too_small, request_parameter_type_mismatch, request_parameter_value_not_allowed, request_parameters_mutually_exclusive, unexpected_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [missing_request_parameter] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/c-missing_request_parameter"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [request_parameter_choice_required] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/e/t-invalid_request_parameter"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [missing_request_parameter] }, code: { enum: [request_parameter_choice_required] }, fix_code: { enum: [change_request_parameters] }, type: { enum: [invalid_request_parameter] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                            examples:
                                payment_method_invalid:
                                    summary: The payment method cannot be used for this order
                                    value:
                                        cause: invalid_request_parameter
                                        code: payment_method_invalid
                                        fix_code: change_request_parameters
                                        type: invalid_request_parameter
                                        url: https://studio.inttegro.com/errors
                '401':
                    description: Unauthorized - invalid or missing API key
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/Error'
                                    - oneOf:
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [authentication_failed] }, code: { enum: [authentication_failed] }, fix_code: { enum: [authenticate_request] }, type: { enum: [authentication_error] }, url: { enum: ["https://studio.inttegro.com/e/c-authentication_failed"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [authentication_failed] }, code: { enum: [endpoint_authentication_required] }, fix_code: { enum: [authenticate_request] }, type: { enum: [authentication_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                '409':
                    description: Another operation claimed or updated a resource before order creation could safely finish
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/Error'
                                    - oneOf:
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [idempotency_in_progress] }, code: { enum: [idempotency_key_in_progress] }, fix_code: { enum: [repeat_same_request] }, type: { enum: [idempotency_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [resource_state_conflict] }, code: { enum: [payment_transition_conflict] }, fix_code: { enum: [refresh_resource_state] }, type: { enum: [state_conflict] }, url: { enum: ["https://studio.inttegro.com/e/payment_transition_conflict"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [resource_state_conflict] }, code: { enum: [purchase_intent_already_used] }, fix_code: { enum: [refresh_resource_state] }, type: { enum: [state_conflict] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                '500':
                    description: Order creation failed unexpectedly
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/Error'
                                    - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [unknown] }, code: { enum: [request_failed] }, fix_code: { enum: [contact_customer_support] }, type: { enum: [unknown_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
