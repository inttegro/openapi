    /orders/search:
        post:
            summary: Search orders
            description: |
                Search orders owned by the authenticated application. Order searches support the
                route-local `status` filter and facet. Results are projections for discovery;
                retrieve an order by ID before making decisions that require canonical state.
            operationId: searchOrders
            tags:
                - Orders
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: './common.yml#/components/schemas/ResourceSearchRequest'
                        example:
                            text: INV-1042 Ama Mensah
                            filters:
                                - field: status
                                  operator: in
                                  values: [paid, requires_payment]
                            facets:
                                - field: status
                                  limit: 10
                            sort:
                                field: relevance
                                direction: desc
                            page_size: 25
            responses:
                '200':
                    description: Order search completed successfully
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: this route must not synthesize projections or totals for another resource family.
                                $ref: './common.yml#/components/schemas/OrderSearchResponse'
                            # Why: public request-controlled values must survive into the synthesized operation result.
                            x-simile-from-request:
                                bindings:
                                    - { from: /page_size, to: /search/page_size, default: 20 }
                                    # Why: bind union leaves independently so synthesis preserves the caller's
                                    # concrete sort choice instead of trying to copy an unresolved oneOf wrapper.
                                    - { from: /sort/field, to: /search/sort/field }
                                    - { from: /sort/direction, to: /search/sort/direction }
