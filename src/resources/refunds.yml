    /refunds/lookup:
        post:
            summary: Look up a refund
            description: Returns the current lifecycle state and amounts for one refund.
            operationId: lookupRefund
            tags:
                - Refunds
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LookupRefundRequest'
            responses:
                '200':
                    description: Refund found
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RefundResponse'
                            # Why: this operation must return a result reachable from the caller-selected resource or page.
                            x-simile-from-request:
                                bindings:
                                    - { from: /refund_id, to: /refund/id }
                '400':
                    description: Invalid refund lookup request
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/ErrorEnvelope'
                                    - type: object
                                      properties:
                                          error:
                                              oneOf:
