    /payouts/schedule:
        post:
            summary: Schedule a payout
            description: |
                Create and schedule a payout to move funds from your available balance to a
                connected financial account. The request chooses the destination, caps the
                maximum amount that may leave your balance, and optionally delays execution
                until a future timestamp.
            operationId: schedulePayout
            tags:
                - Payouts
            parameters:
                - $ref: './common.yml#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: './messaging.yml#/components/schemas/SchedulePayoutRequest'
            responses:
                '200':
                    description: Payout scheduled successfully
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                # Why: scheduling persists the payout before returning; a successful
                                # response is the scheduled snapshot, never an arbitrary terminal state.
                                allOf:
                                    - $ref: '#/components/schemas/PayoutResponse'
                                    - type: object
                                      properties:
                                          payout:
                                              allOf:
                                                  - $ref: '#/components/schemas/Payout'
                                                  - type: object
                                                    required: [scheduled_at]
                                                    properties:
                                                        status: { type: string, enum: [scheduled] }
                            # Why: scheduling chooses the durable destination and merchant reference; both
                            # must survive into the scheduled payout snapshot returned to the caller.
                            x-simile-from-request:
                                bindings:
                                    - { from: /destination_id, to: /payout/destination_id }
                                    - { from: /reference, to: /payout/reference }
                '400':
                    description: Bad request - invalid schedule parameters
                    headers:
                        X-Request-Id:
