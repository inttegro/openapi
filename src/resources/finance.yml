                resource_id:
                    type: string
                resource_type:
                    type: string
                supplied_at:
                    type: string
                    format: date-time
        Payout:
            type: object
            description: A payout scheduled from your Inttegro balance to a destination financial account
            additionalProperties: false
            required:
                - destination_id
                - execute_after
                - id
                - initiated_at
                - max_amount
                - status
            # Payout status, terminal evidence, and caller-safe explanations must stay synchronized.
            x-simile-constraints:
                - ordered:
                      paths: [/initiated_at, /scheduled_at, /sent_at, /succeeded_at]
                - ordered:
                      paths: [/initiated_at, /scheduled_at, /sent_at, /failed_at]
                - ordered:
                      paths: [/initiated_at, /scheduled_at, /canceled_at]
                - implies:
                      when: { path: /status, equals: initialized }
                      then:
                          all:
                              - { path: /scheduled_at, state: absent }
                              - { path: /sent_at, state: absent }
                              - { path: /succeeded_at, state: absent }
                              - { path: /failed_at, state: absent }
                              - { path: /canceled_at, state: absent }
                              - { path: /failure, state: absent }
                              - { path: /cancellation, state: absent }
                              - { path: /error, state: absent }
                - implies:
                      when: { path: /status, equals: scheduled }
                      then:
                          all:
                              - { path: /scheduled_at, state: non-null }
                              - { path: /sent_at, state: absent }
                              - { path: /succeeded_at, state: absent }
                              - { path: /failed_at, state: absent }
                              - { path: /canceled_at, state: absent }
                              - { path: /failure, state: absent }
                              - { path: /cancellation, state: absent }
                              - { path: /error, state: absent }
                - implies:
                      when: { path: /status, equals: executing }
                      then:
                          all:
                              - { path: /sent_at, state: absent }
                              - { path: /succeeded_at, state: absent }
                              - { path: /failed_at, state: absent }
                              - { path: /canceled_at, state: absent }
                              - { path: /failure, state: absent }
                              - { path: /cancellation, state: absent }
                              - { path: /error, state: absent }
                - implies:
                      when: { path: /status, equals: processing }
                      then:
                          all:
                              - { path: /sent_at, state: non-null }
                              - { path: /succeeded_at, state: absent }
                              - { path: /failed_at, state: absent }
                              - { path: /canceled_at, state: absent }
                              - { path: /failure, state: absent }
                              - { path: /cancellation, state: absent }
                              - { path: /error, state: absent }
                - implies:
                      when: { path: /status, equals: succeeded }
                      then:
                          all:
                              - { path: /succeeded_at, state: non-null }
                              - { path: /failed_at, state: absent }
                              - { path: /canceled_at, state: absent }
                              - { path: /failure, state: absent }
                              - { path: /cancellation, state: absent }
                              - { path: /error, state: absent }
                - implies:
                      when: { path: /status, equals: failed }
                      then:
                          all:
                              - { path: /succeeded_at, state: absent }
                              - { path: /failed_at, state: non-null }
                              - { path: /canceled_at, state: absent }
                              - { path: /failure, state: non-null }
                              - { path: /cancellation, state: absent }
                              - { path: /error, state: non-null }
                - implies:
                      when: { path: /status, equals: canceled }
                      then:
                          all:
                              - { path: /succeeded_at, state: absent }
                              - { path: /failed_at, state: absent }
                              - { path: /canceled_at, state: non-null }
                              - { path: /failure, state: absent }
                              - { path: /cancellation, state: non-null }
                              - { path: /error, state: absent }
                # A sealed payout is a bounded, single-currency sum of the exact
                # source contributions returned with it. Unsealed payouts omit amount.
                - equal:
                      paths:
                          - /max_amount/currency
                          - /amount/currency
                          - /balance_transactions/*/amount/currency
                          - /balance_transactions/*/allocated_amount/currency
                - bounded:
                      path: /amount/value
                      maximum: { path: /max_amount/value }
                - aggregate:
                      target: /amount/value
                      operation: sum
                      source: /balance_transactions/*/allocated_amount/value
                      when: { path: /amount, state: non-null }
            properties:
                amount:
                    allOf:
                        - $ref: './common.yml#/components/schemas/Amount'
                        - type: object
                          properties:
                              value:
                                  type: integer
                                  minimum: 1
                balance_transactions:
                    type: array
                    minItems: 1
                    description: |
                        Balance transactions that contributed to this payout. Each item includes
                        the source transaction's original amount and the exact portion allocated
                        to this payout. The difference between those two amounts is not necessarily
                        still available because refunds or other payouts may also consume the source.
                    items:
                        $ref: '#/components/schemas/PayoutBalanceTransaction'
                balance_transaction_id:
                    type: string
                    # Public serializers always emit this resource with the bt_ type prefix.
                    pattern: '^bt_'
                    description: Immutable debit balance transaction created when this payout succeeds.
                    example: bt_1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcd
                canceled_at:
                    type: string
                    format: date-time
                    description: When the payout was canceled
                cancellation:
                    allOf:
                        - $ref: '#/components/schemas/PayoutCancellation'
                    description: Caller-safe explanation and next step for a canceled payout. Present only when `status` is `canceled`.
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomData'
                destination_id:
                    type: string
                    # Public serializers always emit this resource with the fa_ type prefix.
                    pattern: '^fa_'
                    description: Financial account receiving the funds
                    example: "fa_1234567890abcdef"
                error:
                    allOf:
                        - $ref: '#/components/schemas/PayoutError'
                    deprecated: true
                    description: Deprecated compatibility projection of `failure`. New integrations should use `failure`.
                execute_after:
                    type: string
                    format: date-time
                    description: Earliest moment payout execution may begin
                    example: "2026-08-05T09:00:00Z"
                executed_by:
                    type: string
                    description: Actor that executed the payout
                expected_at:
                    type: string
                    format: date-time
                    description: Expected completion time
                failed_at:
                    type: string
                    format: date-time
                    description: When the payout entered the `failed` state.
                failure:
                    allOf:
                        - $ref: '#/components/schemas/PayoutFailure'
                    description: Caller-safe failure information. Present only when `status` is `failed`.
                id:
                    type: string
                    # Public serializers always emit this resource with the po_ type prefix.
                    pattern: '^po_'
                    description: Unique payout identifier
                    example: "po_yQ2wXm5Dc7Pk9Ls1Vn0RgHaB"
                initiated_at:
                    type: string
                    format: date-time
                    description: When the payout was created
                initiated_by:
                    type: string
                    description: Actor that initiated the payout
                max_amount:
                    allOf:
                        - $ref: './common.yml#/components/schemas/Amount'
                        - type: object
                          properties:
                              value:
                                  type: integer
                                  minimum: 1
                reference:
                    type: string
                    description: Merchant reference carried on the payout
                    example: "PAYOUT-APR-15"
                schedule_id:
                    type: string
                    # Public serializers always emit this resource with the posc_ type prefix.
                    pattern: '^posc_'
                    description: Schedule associated with the payout
                scheduled_at:
                    type: string
                    format: date-time
                    description: When the payout was scheduled
                scheduled_by:
                    type: string
                    description: Actor that scheduled the payout
                sent_at:
                    type: string
                    format: date-time
                    description: When the transfer was sent
                source_id:
                    type: string
                    description: Source identifier associated with the payout
                status:
                    type: string
                    enum: [initialized, scheduled, processing, executing, succeeded, failed, canceled]
                    description: Current payout lifecycle state
                succeeded_at:
                    type: string
                    format: date-time
                    description: When the payout succeeded
        PayoutBalanceTransaction:
            type: object
            description: A historical view of one balance transaction's contribution to a payout. Released contributions remain present so clients can inspect the payout's original composition.
            additionalProperties: false
            required: [allocated_amount, amount, id, status]
            # A payout contribution stays in the source transaction's currency and
            # can consume at most that source's original amount.
            x-simile-constraints:
                - equal:
                      paths: [/allocated_amount/currency, /amount/currency]
                - bounded:
                      path: /allocated_amount/value
                      maximum: { path: /amount/value }
            properties:
                allocated_amount:
                    allOf:
                        - $ref: './common.yml#/components/schemas/Amount'
                        - type: object
                          properties:
                              value:
                                  type: integer
                                  minimum: 1
                amount:
                    allOf:
                        - $ref: './common.yml#/components/schemas/Amount'
                        - type: object
                          properties:
                              value:
                                  type: integer
                                  minimum: 1
                id:
                    type: string
                    # Public serializers always emit this resource with the bt_ type prefix.
                    pattern: '^bt_'
                    description: Unique balance transaction identifier.
                    example: bt_1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcd
                status:
                    type: string
                    enum: [reserved, completed, released]
                    description: Whether this contribution is still reserved for the payout, was consumed by a successful payout, or was released after the payout did not complete.
        PayoutCancellation:
            type: object
            description: Stable, caller-safe information and guidance for a canceled payout.
            additionalProperties: false
            required: [detail, reason, remediation]
            properties:
                detail:
                    type: string
                    description: Human-readable explanation safe to show to an operator.
                reason:
                    type: string
                    enum: [requested, no_eligible_funds, unknown]
                    description: Stable category describing why the payout was canceled.
                remediation:
                    type: string
                    description: Recommended next step safe to show to an operator.
        PayoutError:
            type: object
            deprecated: true
            description: Deprecated compatibility projection of `PayoutFailure`.
            additionalProperties: false
            required:
                - cause
                - message
                - occurred_at
                - type
            properties:
                cause:
                    type: string
                    description: Public explanation of the underlying failure cause.
                message:
                    type: string
                    description: Human-readable failure message.
                occurred_at:
                    type: string
                    format: date-time
                    description: When the failure occurred.
                type:
                    type: string
                    description: Stable machine-readable failure category.
        PayoutFailure:
            type: object
            description: Stable, caller-safe information about a terminal payout failure.
            additionalProperties: false
            required: [detail, reason, retryable]
            properties:
                detail:
                    type: string
                    description: Human-readable explanation safe to show to an operator.
                reason:
                    type: string
                    enum: [provider_declined, delivery_failed, temporarily_unavailable, unknown]
                    description: Stable category describing why the payout failed.
                retryable:
                    type: boolean
                    description: Whether creating a new payout attempt may succeed without changing the destination or request.
        PayoutSettingsLookupScheduleAgingSpec:
            type: object
            description: Rules that determine when balance transactions become eligible for payout.
            additionalProperties: false
            required:
                - abide
                - public_id
                - label
                - t_plus
            properties:
                abide:
                    type: string
                    description: How strictly the aging period is applied.
                public_id:
                    type: string
                    # Public serializers always emit this resource with the bt_aging_spec_ type prefix.
                    pattern: '^bt_aging_spec_'
                    description: Public identifier for the balance transaction aging specification.
                    example: "bt_aging_spec_168_hourly"
                label:
                    type: string
                    description: Human-readable aging rule label.
                t_plus:
                    type: string
                    description: Required transaction age.
                    example: "168h"
        PayoutSettingsLookupSchedule:
            type: object
            description: Active payout schedule returned when settings are retrieved.
            additionalProperties: false
            required:
                - aging_spec
                - description
                - interval
                - name
                - schedule_on
                - type
            properties:
                aging_spec:
                    $ref: '#/components/schemas/PayoutSettingsLookupScheduleAgingSpec'
                description:
                    type: string
                interval:
                    type: string
                name:
                    type: string
                schedule_on:
                    type: string
                type:
                    type: string
        PayoutSettingsLookup:
            type: object
            description: Complete payout settings read model
            additionalProperties: false
            required:
                - destinations
                - limits
            properties:
                destinations:
                    $ref: '#/components/schemas/PayoutDestinations'
                fx_enabled:
                    type: boolean
                    description: Present only when foreign exchange is enabled in stored settings
                limits:
                    $ref: '#/components/schemas/PayoutSettingsLimits'
                schedule:
                    $ref: '#/components/schemas/PayoutSettingsLookupSchedule'
        PayoutSettingsLimits:
            type: object
            description: Platform limits applied to payouts.
            additionalProperties: false
            required:
                - amount
            properties:
                amount:
                    type: object
                    description: Inclusive payout amount ranges keyed by lowercase ISO currency code.
                    minProperties: 1
                    additionalProperties:
                        $ref: '#/components/schemas/PayoutAmountLimits'
        PayoutAmountLimits:
            type: object
            description: Inclusive payout amount range. Values use the currency's smallest unit.
            additionalProperties: false
            required:
                - min
                - max
            # The advertised inclusive range is usable only when its lower bound does not exceed its upper bound.
            x-simile-constraints:
                - bounded:
                      path: /min/value
                      maximum: { path: /max/value }
            properties:
                min:
                    $ref: '#/components/schemas/PayoutLimitValue'
                max:
                    $ref: '#/components/schemas/PayoutLimitValue'
        PayoutLimitValue:
            type: object
            description: A payout limit in the currency's smallest unit. The enclosing map key identifies the currency.
            additionalProperties: false
            required:
                - value
            properties:
                value:
                    type: integer
                    format: int64
                    minimum: 1
        PayoutSettingsMutationScheduleSpec:
