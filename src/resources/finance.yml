# Authoritative finance resource contract.
# Why: keeping each resource's operations and schemas together makes public invariants
# reviewable without weakening the single bundled contract distributed to consumers.

paths:
    /financial_accounts/create:
        post:
            summary: Create a financial account
            description: Create a wallet, Ghana bank account, or Dosh account managed through Inttegro. Ghana bank accounts are resolved with the provider before they are persisted.
            operationId: createFinancialAccount
            tags: [Financial Accounts]
            parameters:
                - $ref: './common.yml#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FinancialAccountCreateRequest'
                        example:
                            label: Marketplace Seller Sub-Account
                            reference: SELLER-001-COLLECTION
                            description: Dedicated collection account for seller 001.
                            type: wallet
                            currency: ghs
                            owner:
                                name: Ama Mensah
                                address:
                                    country: GH
                            wallet:
                                type: mobile_money
                                mobile_money:
                                    network: mtn
                                    account_number: "+233242057831"
            responses:
                '200':
                    description: Financial account created
                    headers:
                        X-Request-Id:
                            $ref: './common.yml#/components/headers/RequestId'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateFinancialAccountResponse'
                            # Why: public request-controlled values must survive into the synthesized operation result.
                            x-simile-from-request:
                                bindings:
                                    - { from: /currency, to: /account/currency }
                                    - { from: /custom_data, to: /account/custom_data }
                                    - { from: /description, to: /account/description }
                                    - { from: /label, to: /account/label }
                                    - { from: /reference, to: /account/reference }
                                    - { from: /type, to: /account/type }
                '401':
                    description: Unauthorized - missing or invalid API key
                    headers:
                        X-Request-Id:
                            $ref: "./common.yml#/components/headers/RequestId"
                    content:
                        application/json:
                            schema:
                                # Why: narrowing by operation and status prevents synthesized clients from receiving
                                # a globally valid error code that this public handler cannot emit.
                                allOf:
                                    - $ref: './common.yml#/components/schemas/Error'
                                    - oneOf:
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [authentication_failed] }, code: { enum: [authentication_failed] }, fix_code: { enum: [authenticate_request] }, type: { enum: [authentication_error] }, url: { enum: ["https://studio.inttegro.com/e/c-authentication_failed"] } } }
                                          - { type: object, required: [cause, code, fix_code, type, url], properties: { cause: { enum: [authentication_failed] }, code: { enum: [endpoint_authentication_required] }, fix_code: { enum: [authenticate_request] }, type: { enum: [authentication_error] }, url: { enum: ["https://studio.inttegro.com/errors"] } } }
                '400':
                    description: Bad request - invalid account details
                    headers:
                        X-Request-Id:
