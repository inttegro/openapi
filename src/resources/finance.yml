components:
    schemas:
        PayoutDestinations:
            type: object
            description: Supported currency-to-financial-account destination assignments.
            additionalProperties: false
            properties:
                ghs:
                    type: string
                    description: Financial account that receives Ghana cedi payouts. Send an empty string to remove the assignment.
                    example: "fa_1234567890abcdef"
        BalanceSnapshot:
            type: object
            description: The latest GHS balance snapshot for the application.
            additionalProperties: false
            required: [ghs]
            properties:
                ghs:
                    $ref: '#/components/schemas/CurrencyBalanceSnapshot'
        CustomerBalanceValue:
            type: object
            required: [as_of, available]
            additionalProperties: false
            properties:
                as_of:
                    type: string
                    format: date-time
                available:
                    $ref: './common.yml#/components/schemas/Amount'
        CustomerBalance:
            type: object
            description: Available customer balances keyed by lowercase currency code.
            additionalProperties:
                $ref: '#/components/schemas/CustomerBalanceValue'
        PageFinancialAccountsResponse:
            type: object
            additionalProperties: false
            required: [page]
            properties:
                page:
                    $ref: '#/components/schemas/FinancialAccountPage'
        BalanceSnapshotResponse:
            type: object
            additionalProperties: false
            required: [balances]
            properties:
                balances:
                    $ref: '#/components/schemas/BalanceSnapshot'
        CurrencyBalanceSnapshot:
            type: object
            additionalProperties: false
            required: [available, held, includes_transactions_before, pending, refund, reserved]
            properties:
                available:
                    $ref: '#/components/schemas/BalanceValue'
                held:
                    $ref: '#/components/schemas/BalanceHolds'
                includes_transactions_before:
                    type: string
                    format: date-time
                    description: The snapshot includes transactions created before this timestamp
                pending:
                    $ref: '#/components/schemas/BalanceValue'
                refund:
                    allOf:
                        - $ref: '#/components/schemas/BalanceValue'
                    description: Funds intentionally earmarked for future refund obligations at the snapshot cutoff
                reserved:
                    allOf:
                        - $ref: '#/components/schemas/BalanceValue'
                    description: Funds intentionally reserved for policy, risk, or remediation purposes at the snapshot cutoff
        BalanceHolds:
            type: object
            additionalProperties: false
            description: Live operational commitments read from the canonical balance position.
            required: [as_of, payout, refund]
            properties:
                as_of:
                    type: string
                    format: date-time
                    description: When these strongly consistent hold amounts were read.
                payout:
                    allOf:
                        - $ref: '#/components/schemas/BalanceValue'
                    description: Funds committed to in-flight or unresolved payouts.
                refund:
                    allOf:
                        - $ref: '#/components/schemas/BalanceValue'
                    description: Funds committed to in-flight or unresolved refunds.
        BalanceValue:
            type: object
            additionalProperties: false
            required: [amount]
            properties:
                amount:
                    type: integer
                    minimum: 0
                    description: Amount in the currency's smallest unit
                    example: 145000
        BalanceTransactionAmount:
            type: object
            additionalProperties: false
            required: [currency, value]
            properties:
                currency:
                    type: string
                    description: Currency code as stored on the transaction
                    example: GHS
                value:
                    type: integer
                    minimum: 0
                    description: Unsigned amount in the currency's smallest unit
                    example: 20000
        BalanceTransactionAllocationStatus:
            type: string
            description: Public effect of an allocation on the source payment balance transaction. Internal reservation and reconciliation states are not exposed.
            enum: [pending, completed]
        BalanceTransactionAllocation:
            description: A caller-safe allocation of part of a payment balance transaction to a refund or payout.
            oneOf:
                - $ref: '#/components/schemas/BalanceTransactionRefundAllocation'
                - $ref: '#/components/schemas/BalanceTransactionPayoutAllocation'
            discriminator:
                propertyName: type
                mapping:
                    payout: '#/components/schemas/BalanceTransactionPayoutAllocation'
                    refund: '#/components/schemas/BalanceTransactionRefundAllocation'
        BalanceTransactionAllocationBase:
            type: object
            additionalProperties: false
            required: [created_at, id, status, type, updated_at]
            # Completion is the only allocation state that may expose a completion timestamp.
            x-simile-constraints:
                - ordered:
                      paths: [/created_at, /completed_at, /updated_at]
                # Completion is the allocation's only public state transition, so
                # completed_at and updated_at identify the same committed instant.
                - equal:
                      paths: [/completed_at, /updated_at]
                - implies:
                      when: { path: /status, equals: pending }
                      then:
                          all:
                              - { path: /completed_at, state: absent }
                - implies:
                      when: { path: /status, equals: completed }
                      then:
                          all:
                              - { path: /completed_at, state: non-null }
                - implies:
                      when: { path: /completed_at, state: non-null }
                      then:
                          all:
                              - { path: /status, equals: completed }
            properties:
                completed_at:
                    type: string
                    format: date-time
                    description: When the allocated amount became permanently consumed. Present only when `status` is `completed`.
                created_at:
                    type: string
                    format: date-time
                    description: When the amount first became unavailable for another refund or payout.
                id:
                    type: string
                    # Public serializers always emit this resource with the bta_ type prefix.
                    pattern: '^bta_'
                    description: Stable public allocation identifier for reconciliation and support.
                    example: bta_0123456789abcdefghijklmnopqrstuvwxyzABCD
                status:
                    $ref: '#/components/schemas/BalanceTransactionAllocationStatus'
                type:
                    type: string
                    enum: [payout, refund]
                updated_at:
                    type: string
                    format: date-time
                    description: When the public allocation status last changed.
        BalanceTransactionRefundAllocation:
            type: object
            additionalProperties: false
            required: [created_at, id, refund, status, type, updated_at]
            # Keep this subtype closed without composing two independently closed
            # OpenAPI 3.0 objects, which would make every refund allocation invalid.
            x-simile-constraints:
                - ordered:
                      paths: [/created_at, /completed_at, /updated_at]
                - equal:
                      paths: [/completed_at, /updated_at]
                - implies:
                      when: { path: /status, equals: pending }
                      then:
                          all:
                              - { path: /completed_at, state: absent }
                - implies:
                      when: { path: /status, equals: completed }
                      then:
                          all:
                              - { path: /completed_at, state: non-null }
                - implies:
                      when: { path: /completed_at, state: non-null }
                      then:
                          all:
                              - { path: /status, equals: completed }
            properties:
                completed_at:
                    type: string
                    format: date-time
                    description: When the allocated amount became permanently consumed. Present only when `status` is `completed`.
                created_at:
                    type: string
                    format: date-time
                    description: When the amount first became unavailable for another refund or payout.
                id:
                    type: string
                    # Public serializers always emit this resource with the bta_ type prefix.
                    pattern: '^bta_'
                    description: Stable public allocation identifier for reconciliation and support.
                    example: bta_0123456789abcdefghijklmnopqrstuvwxyzABCD
                refund:
                    type: object
                    additionalProperties: false
                    required: [amount, id]
                    properties:
                        amount:
                            $ref: '#/components/schemas/BalanceTransactionAmount'
                        id:
                            type: string
                            # Public serializers always emit this resource with the rf_ type prefix.
                            pattern: '^rf_'
                            example: rf_1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcd
                status:
                    $ref: '#/components/schemas/BalanceTransactionAllocationStatus'
                type:
                    type: string
                    enum: [refund]
                updated_at:
                    type: string
                    format: date-time
                    description: When the public allocation status last changed.
        BalanceTransactionPayoutAllocation:
            type: object
            additionalProperties: false
            required: [created_at, id, payout, status, type, updated_at]
            # Payout allocations use the same complete public lifecycle snapshot;
            # duplicating the closed shape avoids contradictory allOf branches.
            x-simile-constraints:
                - ordered:
                      paths: [/created_at, /completed_at, /updated_at]
                - equal:
                      paths: [/completed_at, /updated_at]
                - implies:
                      when: { path: /status, equals: pending }
                      then:
                          all:
                              - { path: /completed_at, state: absent }
                - implies:
                      when: { path: /status, equals: completed }
                      then:
                          all:
                              - { path: /completed_at, state: non-null }
                - implies:
                      when: { path: /completed_at, state: non-null }
                      then:
                          all:
                              - { path: /status, equals: completed }
            properties:
                completed_at:
                    type: string
                    format: date-time
                    description: When the allocated amount became permanently consumed. Present only when `status` is `completed`.
                created_at:
                    type: string
                    format: date-time
                    description: When the amount first became unavailable for another refund or payout.
                id:
                    type: string
                    # Public serializers always emit this resource with the bta_ type prefix.
                    pattern: '^bta_'
                    description: Stable public allocation identifier for reconciliation and support.
                    example: bta_0123456789abcdefghijklmnopqrstuvwxyzABCD
                payout:
                    type: object
                    additionalProperties: false
                    required: [amount, id]
                    properties:
                        amount:
                            $ref: '#/components/schemas/BalanceTransactionAmount'
                        id:
                            type: string
                            # Public serializers always emit this resource with the po_ type prefix.
                            pattern: '^po_'
                            example: po_zyxwvutsrqponmlkjihgfedcbaABCDEFGHIJKLMN
                status:
                    $ref: '#/components/schemas/BalanceTransactionAllocationStatus'
                type:
                    type: string
                    enum: [payout]
                updated_at:
                    type: string
                    format: date-time
                    description: When the public allocation status last changed.
        BalanceTransaction:
            description: |
                Merchant balance entry caused by a payment, refund, or payout. `type` is the
                discriminator and describes the semantic source rather than the direction.
            oneOf:
                - $ref: '#/components/schemas/PaymentBalanceTransaction'
                - $ref: './refunds.yml#/components/schemas/RefundBalanceTransaction'
                - $ref: '#/components/schemas/PayoutDebitBalanceTransaction'
            discriminator:
                propertyName: type
                mapping:
                    payment: '#/components/schemas/PaymentBalanceTransaction'
                    refund: './refunds.yml#/components/schemas/RefundBalanceTransaction'
                    payout: '#/components/schemas/PayoutDebitBalanceTransaction'
        BalanceTransactionBase:
            type: object
            additionalProperties: false
            required: [amount, created_at, id, type]
            properties:
                amount:
                    $ref: '#/components/schemas/BalanceTransactionAmount'
                created_at:
                    type: string
                    format: date-time
                id:
                    type: string
                    # Public serializers always emit this resource with the bt_ type prefix.
                    pattern: '^bt_'
                    example: bt_0123456789abcdefghijklmnopqrstuvwxyzABCD
                type:
                    type: string
                    enum: [payment, refund, payout]
                    description: Semantic source or cause of the transaction, not its direction.
        PaymentBalanceTransaction:
            type: object
            additionalProperties: false
            required: [allocations, amount, available_amount, created_at, id, order_id, payment_id, pending_amount, spent_amount, type]
            # A payment credit is exposed as one complete currency-preserving
            # partition: available + pending + spent always recreates the source.
            x-simile-constraints:
                - equal:
                      paths:
                          - /amount/currency
                          - /available_amount/currency
                          - /pending_amount/currency
                          - /spent_amount/currency
                - equation:
                      target: /amount/value
                      value:
                          add:
                              - { path: /available_amount/value }
                              - { path: /pending_amount/value }
                              - { path: /spent_amount/value }
            # OpenAPI 3.0 applies additionalProperties inside every allOf branch.
            # Declaring the complete subtype here keeps the JSON shape closed without
            # making base fields and payment-only fields reject one another.
            properties:
                allocations:
                    type: array
                    description: All current pending and completed allocations. Released allocations are omitted.
                    items:
                        $ref: '#/components/schemas/BalanceTransactionAllocation'
                amount:
                    $ref: '#/components/schemas/BalanceTransactionAmount'
                available_amount:
                    allOf:
                        - $ref: '#/components/schemas/BalanceTransactionAmount'
                    description: Amount still available for a refund or payout.
                available_at:
                    type: string
                    format: date-time
                claimed_at:
                    type: string
                    format: date-time
                    deprecated: true
                    description: Legacy whole-transaction payout claim timestamp. New integrations should inspect `allocations`.
                created_at:
                    type: string
                    format: date-time
                id:
                    type: string
                    # Public serializers always emit this resource with the bt_ type prefix.
                    pattern: '^bt_'
                    example: bt_0123456789abcdefghijklmnopqrstuvwxyzABCD
                order_id:
                    type: string
                    # Public serializers always emit this resource with the or_ type prefix.
                    pattern: '^or_'
                    example: or_0123456789abcdefghijklmnopqrstuvwxyzABCD
                paid_at:
                    type: string
                    format: date-time
                    deprecated: true
                    description: Legacy whole-transaction payout completion timestamp. New integrations should inspect `allocations`.
                payment_id:
                    type: string
                    # Public serializers always emit this resource with the py_ type prefix.
                    pattern: '^py_'
                    example: py_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmn
                payout_id:
                    type: string
                    # Public serializers always emit this resource with the po_ type prefix.
                    pattern: '^po_'
                    deprecated: true
                    description: Legacy payout owning the whole transaction remainder. New integrations should inspect `allocations`.
                    example: po_zyxwvutsrqponmlkjihgfedcbaABCDEFGHIJKLMN
                payout_configuration:
                    type: object
                    additionalProperties: false
                    required: [enable_fx, destination]
                    properties:
                        enable_fx:
                            type: boolean
                            enum: [false]
                        destination:
                            type: object
                            additionalProperties: false
                            required: [financial_account_id]
                            properties:
                                financial_account_id:
                                    type: string
                                    # Public serializers always emit this resource with the fa_ type prefix.
                                    pattern: '^fa_'
                pending_amount:
                    allOf:
                        - $ref: '#/components/schemas/BalanceTransactionAmount'
                    description: Amount temporarily unavailable because a refund or payout is unresolved.
                spent_amount:
                    allOf:
                        - $ref: '#/components/schemas/BalanceTransactionAmount'
                    description: Amount permanently consumed by completed refund and payout allocations.
                type:
                    type: string
                    enum: [payment]
        PayoutDebitBalanceTransaction:
            type: object
            description: Immutable debit created once a payout succeeds.
            additionalProperties: false
            required: [amount, created_at, id, payout_id, type]
            properties:
                amount:
                    $ref: '#/components/schemas/BalanceTransactionAmount'
                created_at:
                    type: string
                    format: date-time
                id:
                    type: string
                    # Public serializers always emit this resource with the bt_ type prefix.
                    pattern: '^bt_'
                    example: bt_0123456789abcdefghijklmnopqrstuvwxyzABCD
                payout_id:
                    type: string
                    # Public serializers always emit this resource with the po_ type prefix.
                    pattern: '^po_'
                    description: Payout that created this finalized debit.
                    example: po_zyxwvutsrqponmlkjihgfedcbaABCDEFGHIJKLMN
                type:
                    type: string
                    enum: [payout]
        BalanceTransactionResponse:
            type: object
            additionalProperties: false
            required: [transaction]
            properties:
                transaction:
                    $ref: '#/components/schemas/BalanceTransaction'
        BalanceTransactionPageResponse:
            type: object
            additionalProperties: false
            required: [page]
            properties:
                page:
                    type: object
                    additionalProperties: false
                    required: [number, size]
                    properties:
                        number:
                            type: integer
                        size:
                            type: integer
                            minimum: 0
                        transactions:
                            type: array
                            description: Newest transactions first. Omitted when the page is empty.
                            items:
                                $ref: '#/components/schemas/BalanceTransaction'
        FinancialAccountCreateRequest:
            oneOf:
                - $ref: '#/components/schemas/FinancialAccountWalletRequest'
                - $ref: '#/components/schemas/FinancialAccountBankRequest'
                - $ref: '#/components/schemas/FinancialAccountDoshRequest'
            discriminator:
                propertyName: type
                mapping:
                    wallet: '#/components/schemas/FinancialAccountWalletRequest'
                    bank_account: '#/components/schemas/FinancialAccountBankRequest'
                    dosh_account: '#/components/schemas/FinancialAccountDoshRequest'
        FinancialAccountCurrency:
            # Why: financial-account handlers currently accept only GHS; reusing the broader
            # quoted-amount Currency enum would synthesize currencies these operations reject.
            type: string
            description: Currency currently supported for financial accounts.
            enum: [ghs]
            example: ghs
        FinancialAccountWalletRequest:
            # Why: OpenAPI 3.0 evaluates a closed allOf base independently, so the former
            # base-plus-subtype composition rejected the subtype's own wallet and owner fields.
            type: object
            additionalProperties: false
            required: [currency, label, owner, reference, type, wallet]
            properties:
                currency:
                    $ref: '#/components/schemas/FinancialAccountCurrency'
                custom_data:
                    $ref: './common.yml#/components/schemas/CustomDataInput'
                description:
                    type: string
                    maxLength: 200
                label:
                    type: string
                    minLength: 5
                    maxLength: 40
                owner:
                    $ref: '#/components/schemas/FinancialAccountOwnerInput'
                pull_configuration:
                    type: object
                    additionalProperties: false
                    properties:
                        enabled:
                            type: boolean
                push_configuration:
                    type: object
                    additionalProperties: false
                    properties:
                        enabled:
                            type: boolean
                reference:
                    type: string
                    minLength: 5
                    maxLength: 40
                type:
                    type: string
                    enum: [wallet]
                wallet:
                    type: object
                    additionalProperties: false
                    required: [mobile_money, type]
                    properties:
                        type:
                            type: string
                            enum: [mobile_money]
                        mobile_money:
                            type: object
                            additionalProperties: false
                            required: [account_number, network]
                            properties:
                                account_number:
                                    type: string
                                    minLength: 1
                                network:
                                    type: string
                                    enum: [airtel, mtn, telecel, vodafone]
        FinancialAccountBankRequest:
            # Why: flattening keeps unknown-field rejection real instead of publishing an
            # impossible closed allOf that rejects every valid bank-account request.
            type: object
            additionalProperties: false
            description: Owner name and country must be supplied through top-level owner, the bank-account holder, or both. Missing values are filled between the two representations.
            required: [bank_account, currency, label, reference, type]
            # Why: bank-account handlers merge these two public owner representations but reject a
            # request when neither contains the required name and country.
            anyOf:
                - required: [owner]
                  properties:
                      owner:
                          $ref: '#/components/schemas/FinancialAccountOwnerInput'
                - required: [bank_account]
                  properties:
                      bank_account:
                          type: object
                          # Why: this partial branch checks only the nested holder; the owning
                          # bank_account schema below remains the closed authority for its fields.
                          additionalProperties: true
                          required: [ghana_bank_account]
                          properties:
                              ghana_bank_account:
                                  type: object
                                  additionalProperties: true
                                  required: [holder]
                                  properties:
                                      holder:
                                          $ref: '#/components/schemas/FinancialAccountOwnerInput'
            properties:
                bank_account:
                    type: object
                    additionalProperties: false
                    required: [ghana_bank_account, type]
                    properties:
                        type:
                            type: string
                            enum: [ghana_bank_account]
                        ghana_bank_account:
                            type: object
                            additionalProperties: false
                            required: [number]
                            anyOf:
                                - required: [sort_code]
                                - required: [swift_code]
                            properties:
                                holder:
                                    $ref: '#/components/schemas/FinancialAccountOwnerInput'
                                number:
                                    type: string
                                    minLength: 1
                                sort_code:
