    /prices/create:
        post:
            summary: Create a price
            description: |
                Creates a new price in your catalog. Fixed prices may optionally be associated with a product;
                customer-selected prices must be associated with a product. Multiple prices can exist for the
                same product to support different currencies, markets, or customer segments.

                Key points:
                - Price amounts are immutable after creation (create new price to change amount)
                - Product association (product_id) is optional for fixed prices, required for customer-selected prices, and immutable once set
                - Customer-selected price definitions are available only to Commerce internal services and Upper private beta organizations and applications
                - Label and about fields can be updated later
                - Amount must be a positive integer representing the smallest currency unit (cents, pence, etc.)
            operationId: createPrice
            tags:
                - Prices
            parameters:
                - $ref: './common.yml#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CatalogPriceParams'
