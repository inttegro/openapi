                            examples:
                                gallery_too_large:
                                    summary: The product gallery exceeds the public media limit
                                    value:
                                        cause: invalid_request_parameter
                                        code: product_media_gallery_too_large
                                        fix_code: change_request_parameters
                                        type: invalid_request_parameter
                                        url: https://studio.inttegro.com/errors
    /products/add_price:
        post:
            summary: Add a price to a product
            description: |
                Creates a new price for an existing product owned by the authenticated application.

                Key points:
                - The target product must belong to your authenticated application
                - Archived products cannot accept new prices
                - Customer-selected price definitions are available only to Commerce internal services and Upper private beta organizations and applications
                - The response returns the created price only
            operationId: addProductPrice
            tags:
                - Products
            parameters:
                - $ref: './common.yml#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddProductPriceRequest'
