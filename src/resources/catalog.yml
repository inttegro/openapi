    /products/update:
        post:
            summary: Update a product
            description: |
                Update the mutable description, classification, fulfillment, dimension, media,
                attribute, and custom-data fields of an existing product. If `type` is supplied,
                it must equal the existing type. `images` and `media` are mutually exclusive.
                Inline `price` updates are not supported; use the Prices API. An ID-only request
                succeeds without changing the product. Archived products cannot be updated.
            operationId: updateProduct
            tags:
                - Products
            parameters:
                - $ref: './common.yml#/components/parameters/IdempotencyKey'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateProductRequest'
            responses:
