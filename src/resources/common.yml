            required:
                - type
                - code
                - url
            properties:
                message:
                    type: string
                    description: Concise, caller-safe explanation of why the request was rejected or could not finish.
                    example: "payment method could not be used for this order"
                fix_code:
                    allOf:
                        - $ref: '#/components/schemas/ErrorFixCode'
                    description: Machine-readable suggestion for how to resolve the error (e.g., "retry_with_exponential_backoff", "change_request_parameters").
                    example: "change_request_parameters"
                detail:
                    type: string
                    description: Explanation of the relevant rule and next safe action. It never contains raw dependency, storage, or implementation errors.
                    example: "the specified payment method could not be used for this order. verify that it belongs to the order customer and is active."
                cause:
                    allOf:
                        - $ref: '#/components/schemas/ErrorCause'
                    description: Stable category describing the reason for failure, such as invalid input, an unmet precondition, or a state conflict.
                    example: "invalid_request_parameter"
                type:
                    allOf:
                        - $ref: '#/components/schemas/ErrorType'
                    description: Broad error category to help clients determine retry strategies (e.g., "invalid_request_parameter", "transient_error").
                    example: "invalid_request_parameter"
                code:
                    allOf:
                        - $ref: '#/components/schemas/ErrorCode'
                    description: Unique machine-readable identifier for this specific error condition. Unlike type and cause which group errors, code pinpoints the exact problem.
                    example: "payment_method_invalid"
                url:
                    allOf:
                        - $ref: '#/components/schemas/ErrorDocumentationURL'
                    description: Link to error reference documentation with detailed explanation, common causes, and resolution guidance.
                    example: "https://studio.inttegro.com/e/c-invalid_request_parameter"
