# Authoritative common resource contract.
# Why: keeping each resource's operations and schemas together makes public invariants
# reviewable without weakening the single bundled contract distributed to consumers.

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            description: Inttegro API key supplied in the Authorization header.
    headers:
        RequestId:
            description: Unique Inttegro request identifier for support, tracing, and reconciliation.
            schema:
                type: string
                example: req_01hzz8y7q5r4q4f6r6q6k2z3w1
        RetryAfter:
            description: Seconds to wait before retrying a temporarily unavailable or rate-limited request.
            schema:
                type: string
                example: "30"
    parameters:
        IdempotencyKey:
            name: Idempotency-Key
            in: header
            required: false
            schema:
                $ref: '#/components/schemas/IdempotencyKeyValue'
            description: Stable key used to replay safe retries without applying the mutation twice.
    schemas:
        IdempotencyKeyValue:
            type: string
            minLength: 1
            maxLength: 255
            description: Stable caller-chosen retry key.
        RequestPropertySelection:
            type: object
            additionalProperties: false
            description: Public properties to include in or exclude from one named response resource. Supply exactly one of `pick` or `omit`.
            properties:
                pick:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        type: string
                        minLength: 1
                    description: Include only these property paths and the ancestors needed to contain them.
                omit:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    items:
                        type: string
                        minLength: 1
                    description: Exclude these property paths and all of their descendants.
            oneOf:
                - required: [pick]
                - required: [omit]
        RequestResponse:
            type: object
            additionalProperties: false
            description: Caller-controlled preferences for computing and representing the successful response.
            required: [projection]
            properties:
                projection:
                    type: object
                    minProperties: 1
                    additionalProperties:
                        $ref: '#/components/schemas/RequestPropertySelection'
                    description: Public property selections keyed by the endpoint's response resource names.
        ResourceSearchRequest:
            type: object
            additionalProperties: false
            description: |
                A resource-local search request. Send `text`, at least one filter, or both. Field
                names are unqualified and depend on the endpoint. The application and resource type
                are derived by Inttegro and cannot be supplied by the caller. To continue a search,
                repeat the same request and add the returned `next_cursor`.
            anyOf:
                - required: [text]
                - required: [filters]
            properties:
                text:
                    type: string
                    minLength: 1
                    maxLength: 512
                    description: Words, identifiers, or names to search for.
                filters:
                    type: array
                    maxItems: 20
                    uniqueItems: true
                    items:
                        $ref: '#/components/schemas/ResourceSearchFilter'
                facets:
                    type: array
                    maxItems: 10
                    uniqueItems: true
                    items:
                        $ref: '#/components/schemas/ResourceSearchFacet'
                sort:
                    $ref: '#/components/schemas/ResourceSearchSort'
                page_size:
                    type: integer
                    minimum: 1
                    maximum: 100
                    default: 20
                cursor:
                    type: string
                    maxLength: 8192
                    description: Opaque continuation value returned as `next_cursor` by the preceding page.
        ResourceSearchFilter:
            oneOf:
                - $ref: '#/components/schemas/ResourceSearchEqualsFilter'
                - $ref: '#/components/schemas/ResourceSearchInFilter'
        ResourceSearchEqualsFilter:
            type: object
            additionalProperties: false
            required: [field, operator, values]
            properties:
                field:
                    type: string
                    description: Unqualified route-local field name documented by the selected endpoint.
                operator:
                    type: string
                    enum: [eq]
                    description: Exact equality comparison.
                values:
                    type: array
                    minItems: 1
                    maxItems: 1
                    uniqueItems: true
                    items:
                        type: string
                        minLength: 1
                        maxLength: 256
        ResourceSearchInFilter:
            type: object
            additionalProperties: false
            required: [field, operator, values]
            properties:
                field:
                    type: string
                    description: Unqualified route-local field name documented by the selected endpoint.
                operator:
                    type: string
                    enum: [in]
                    description: Matches any supplied value.
                values:
                    type: array
                    minItems: 1
                    maxItems: 20
                    uniqueItems: true
                    items:
                        type: string
                        minLength: 1
                        maxLength: 256
        ResourceSearchFacet:
            type: object
            additionalProperties: false
            required: [field]
            properties:
                field:
                    type: string
                    description: Unqualified route-local field to group and count.
                limit:
                    type: integer
                    minimum: 1
                    maximum: 50
                    default: 10
        ResourceSearchSort:
            type: object
            additionalProperties: false
            required: [field, direction]
            # Why: expressing the relevance rule on one concrete object keeps request-to-response
            # sort preservation constructible; independent oneOf branch selection could otherwise
            # discard the caller's valid choice while synthesizing the response.
            x-simile-constraints:
                - implies:
                      when: { path: /field, equals: relevance }
                      then:
                          all:
                              - { path: /direction, equals: desc }
            properties:
                field:
                    type: string
                    enum: [relevance, updated_at, published_at]
                    description: "`published_at` is supported only by product search."
                direction:
                    type: string
                    enum: [asc, desc]
        ResourceSearchRelevanceSort:
            type: object
            additionalProperties: false
            required: [field, direction]
            properties:
                field:
                    type: string
                    enum: [relevance]
                    description: Sort by search relevance.
                direction:
                    type: string
                    enum: [desc]
                    description: Relevance is always sorted in descending order.
        ResourceSearchChronologicalSort:
            type: object
            additionalProperties: false
            required: [field, direction]
            properties:
                field:
                    type: string
                    enum: [updated_at, published_at]
                    description: "`published_at` is supported only by product search."
                direction:
                    type: string
                    enum: [asc, desc]
        ResourceSearchResponse:
            type: object
            additionalProperties: false
            required: [search]
            properties:
                search:
                    $ref: '#/components/schemas/ResourceSearchPage'
        ResourceSearchPage:
            type: object
            additionalProperties: false
            required: [resource_types, sort, page_size, result_count, has_more, total, resource_totals, results, facets, freshness]
            # Ariadne rejects a page whose declared result count differs from
            # the number of public result projections in that payload.
            x-simile-constraints:
                - aggregate:
                      target: /result_count
                      operation: count
                      source: /results/*
            properties:
                resource_types:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                        $ref: '#/components/schemas/SearchResourceType'
                sort:
                    $ref: '#/components/schemas/ResourceSearchSort'
                page_size:
                    type: integer
                    minimum: 1
                    maximum: 100
                result_count:
                    type: integer
                    minimum: 0
                    maximum: 100
                has_more:
                    type: boolean
                total:
                    $ref: '#/components/schemas/ResourceSearchTotal'
                resource_totals:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResourceSearchResourceTotal'
                results:
                    type: array
                    description: Search projections for discovery, not canonical resource snapshots.
                    maxItems: 100
                    items:
                        $ref: '#/components/schemas/ResourceSearchResult'
                facets:
                    type: array
                    maxItems: 10
                    items:
                        $ref: '#/components/schemas/ResourceSearchFacetResult'
                next_cursor:
                    type: string
                    maxLength: 8192
                freshness:
                    $ref: '#/components/schemas/ResourceSearchFreshness'
        FinancialAccountSearchResponse:
            type: object
            additionalProperties: false
            required: [search]
            properties:
                search:
                    allOf:
                        - $ref: '#/components/schemas/ResourceSearchPage'
                        - type: object
                          properties:
                              resource_types:
                                  type: array
                                  minItems: 1
                                  maxItems: 1
                                  items: { type: string, enum: [financial_account] }
                              resource_totals:
                                  type: array
                                  items:
                                      allOf:
                                          - $ref: '#/components/schemas/ResourceSearchResourceTotal'
                                          - type: object
                                            properties:
                                                resource_type: { type: string, enum: [financial_account] }
                              results:
                                  type: array
                                  maxItems: 100
                                  items:
                                      allOf:
                                          - $ref: '#/components/schemas/ResourceSearchResult'
                                          - type: object
                                            properties:
                                                resource:
                                                    allOf:
                                                        - $ref: '#/components/schemas/ResourceSearchResourceReference'
                                                        - type: object
                                                          properties:
                                                              type: { type: string, enum: [financial_account] }
        CustomerSearchResponse:
            type: object
            additionalProperties: false
            required: [search]
            properties:
                search:
                    # Why: a customer search must advertise, total, and return only customer projections.
                    allOf:
                        - $ref: '#/components/schemas/ResourceSearchPage'
                        - type: object
                          properties:
                              resource_types:
                                  type: array
                                  minItems: 1
                                  maxItems: 1
                                  items: { type: string, enum: [customer] }
                              resource_totals:
                                  type: array
                                  items:
                                      allOf:
                                          - $ref: '#/components/schemas/ResourceSearchResourceTotal'
                                          - type: object
                                            properties:
                                                resource_type: { type: string, enum: [customer] }
                              results:
                                  type: array
                                  maxItems: 100
                                  items:
                                      allOf:
                                          - $ref: '#/components/schemas/ResourceSearchResult'
                                          - type: object
                                            properties:
                                                resource:
                                                    allOf:
                                                        - $ref: '#/components/schemas/ResourceSearchResourceReference'
                                                        - type: object
                                                          properties:
                                                              type: { type: string, enum: [customer] }
        OrderSearchResponse:
            type: object
            additionalProperties: false
            required: [search]
            properties:
                search:
                    # Why: an order search must advertise, total, and return only order projections.
                    allOf:
                        - $ref: '#/components/schemas/ResourceSearchPage'
                        - type: object
                          properties:
                              resource_types:
                                  type: array
                                  minItems: 1
                                  maxItems: 1
                                  items: { type: string, enum: [order] }
                              resource_totals:
                                  type: array
                                  items:
                                      allOf:
                                          - $ref: '#/components/schemas/ResourceSearchResourceTotal'
                                          - type: object
                                            properties:
                                                resource_type: { type: string, enum: [order] }
                              results:
                                  type: array
                                  maxItems: 100
                                  items:
                                      allOf:
                                          - $ref: '#/components/schemas/ResourceSearchResult'
                                          - type: object
                                            properties:
                                                resource:
                                                    allOf:
                                                        - $ref: '#/components/schemas/ResourceSearchResourceReference'
                                                        - type: object
                                                          properties:
                                                              type: { type: string, enum: [order] }
        PayoutSearchResponse:
            type: object
            additionalProperties: false
            required: [search]
            properties:
                search:
                    # Why: a payout search must advertise, total, and return only payout projections.
                    allOf:
                        - $ref: '#/components/schemas/ResourceSearchPage'
                        - type: object
                          properties:
                              resource_types:
                                  type: array
                                  minItems: 1
                                  maxItems: 1
                                  items: { type: string, enum: [payout] }
                              resource_totals:
                                  type: array
                                  items:
                                      allOf:
                                          - $ref: '#/components/schemas/ResourceSearchResourceTotal'
                                          - type: object
                                            properties:
                                                resource_type: { type: string, enum: [payout] }
                              results:
                                  type: array
                                  maxItems: 100
                                  items:
                                      allOf:
                                          - $ref: '#/components/schemas/ResourceSearchResult'
                                          - type: object
                                            properties:
                                                resource:
                                                    allOf:
                                                        - $ref: '#/components/schemas/ResourceSearchResourceReference'
                                                        - type: object
                                                          properties:
                                                              type: { type: string, enum: [payout] }
        ProductSearchResponse:
            type: object
            additionalProperties: false
            required: [search]
            properties:
                search:
                    # Why: a product search must advertise, total, and return only product projections.
                    allOf:
                        - $ref: '#/components/schemas/ResourceSearchPage'
                        - type: object
                          properties:
                              resource_types:
                                  type: array
                                  minItems: 1
                                  maxItems: 1
                                  items: { type: string, enum: [product] }
                              resource_totals:
                                  type: array
                                  items:
                                      allOf:
                                          - $ref: '#/components/schemas/ResourceSearchResourceTotal'
                                          - type: object
                                            properties:
                                                resource_type: { type: string, enum: [product] }
                              results:
                                  type: array
                                  maxItems: 100
                                  items:
                                      allOf:
                                          - $ref: '#/components/schemas/ResourceSearchResult'
                                          - type: object
                                            properties:
                                                resource:
                                                    allOf:
                                                        - $ref: '#/components/schemas/ResourceSearchResourceReference'
                                                        - type: object
                                                          properties:
                                                              type: { type: string, enum: [product] }
        SearchResourceType:
            type: string
            enum: [customer, financial_account, order, payout, product]
        ResourceSearchTotal:
            type: object
            additionalProperties: false
            required: [value, relation]
            properties:
                value:
                    type: integer
                    format: int64
                    minimum: 0
                relation:
                    type: string
                    enum: [exact, lower_bound]
        ResourceSearchResourceTotal:
            type: object
            additionalProperties: false
            required: [resource_type, value, relation]
            properties:
                resource_type:
                    $ref: '#/components/schemas/SearchResourceType'
                value:
                    type: integer
                    format: int64
                    minimum: 0
                relation:
                    type: string
                    enum: [exact, lower_bound]
        ResourceSearchResourceReference:
            type: object
            additionalProperties: false
            required: [type, id]
            properties:
                type:
                    $ref: '#/components/schemas/SearchResourceType'
                id:
                    type: string
        ResourceSearchAmount:
            type: object
            additionalProperties: false
            required: [currency, value]
            properties:
                currency:
                    type: string
                    description: ISO 4217 currency code.
                value:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Amount in the currency's minor unit.
        ResourceSearchResult:
            type: object
            additionalProperties: false
            required: [resource, title, updated_at]
            properties:
                resource:
                    $ref: '#/components/schemas/ResourceSearchResourceReference'
                title:
                    type: string
                summary:
                    type: string
                status:
                    type: string
                customer_name:
                    type: string
                amount:
                    $ref: '#/components/schemas/ResourceSearchAmount'
                url:
                    type: string
                    format: uri
                updated_at:
                    type: string
                    format: date-time
        ResourceSearchFacetBucket:
            type: object
            additionalProperties: false
            required: [value, count]
            properties:
                value:
                    type: string
                count:
                    type: integer
                    format: int64
                    minimum: 0
        ResourceSearchFacetResult:
            type: object
            additionalProperties: false
            required: [field, buckets]
            properties:
                field:
                    type: string
                    description: The same unqualified route-local field requested by the caller.
                buckets:
                    type: array
                    maxItems: 50
                    items:
                        $ref: '#/components/schemas/ResourceSearchFacetBucket'
        ResourceSearchResourceFreshness:
            type: object
            additionalProperties: false
            required: [resource_type, state]
            properties:
                resource_type:
                    $ref: '#/components/schemas/SearchResourceType'
                state:
                    type: string
                    enum: [current, delayed, partial, unknown, unavailable]
                observed_at:
                    type: string
                    format: date-time
                last_indexed_at:
                    type: string
                    format: date-time
        ResourceSearchFreshness:
            type: object
            additionalProperties: false
            required: [state]
            properties:
                state:
                    type: string
                    enum: [current, delayed, partial, unknown, unavailable]
                observed_at:
                    type: string
                    format: date-time
                resources:
                    type: array
                    maxItems: 1
                    items:
                        $ref: '#/components/schemas/ResourceSearchResourceFreshness'
        CustomData:
            type: object
            description: Merchant-defined string values attached to a resource. SDKs expose this as a semantic collection rather than a raw map.
            additionalProperties:
                type: string
        NonEmptyCustomData:
            type: object
            # Why: public response serializers omit custom-data maps with no entries.
            minProperties: 1
            description: Merchant-defined string values attached to a resource when at least one value is present.
            additionalProperties:
                type: string
        CustomDataInput:
            type: object
            description: Merchant-defined values accepted on resource creation. Values are serialized to strings before storage.
            additionalProperties: true
        CustomDataPatch:
            type: object
            description: Changes to merchant-defined data. JSON null removes a key; every other JSON value is serialized to a string.
            additionalProperties: true
        JSONData:
            type: object
            description: Deliberately extensible JSON object whose keys and values are defined by the selected integration or resource subtype.
            additionalProperties: true
        Currency:
            type: string
            description: A currency code recognized by the Inttegro API. Individual operations can support a subset of these currencies.
            enum: [ghs, usd, gbp, eur, cny]
            example: ghs
        AmountParams:
            type: object
            additionalProperties: false
            required:
                - currency
                - value
            properties:
                currency:
                    $ref: '#/components/schemas/Currency'
                value:
                    type: integer
                    description: Amount in smallest currency unit (e.g., pesewas for GHS)
                    example: 20000
                    minimum: 0
        Amount:
            type: object
            additionalProperties: false
            required:
                - currency
                - value
            properties:
                currency:
                    $ref: '#/components/schemas/Currency'
                value:
                    type: integer
                    description: Amount in the currency's smallest unit.
                    example: 20000
        ErrorCause:
            type: string
            description: Stable public category identifying why an API request failed.
            # Public error constructors emit only these categories; keeping the set finite prevents
            # synthesized errors from inventing retry and remediation semantics clients do not know.
            enum:
                - authentication_failed
                - authorization_failed
                - capability_unsupported
                - configuration_missing
                - dependency_failed
                - dependency_unavailable
                - idempotency_conflict
                - idempotency_in_progress
                - invalid_request_body
                - invalid_request_parameter
                - limit_exceeded
                - method_not_allowed
                - missing_request_parameter
                - operation_in_progress
                - payload_too_large
                - precondition_unmet
                - provider_declined
                - provider_unavailable
                - quota_exceeded
                - rate_limited
                - request_timeout
                - resource_locked
                - resource_not_found
                - resource_state_conflict
                - resource_state_invalid
                - service_unavailable
                - unknown
                - unsupported_content_type
        ErrorType:
            type: string
            description: Stable public class used by clients to select broad error-handling behavior.
            # Error types are protocol values, not free-form diagnostics, so generated responses must
            # stay within the classifications emitted by the shared HTTP error packages.
            enum:
                - authentication_error
                - authorization_error
                - authorization_failed
                - bad_request
                - configuration_error
                - dependency_failed
                - idempotency_error
                - invalid_request
                - invalid_request_parameter
                - limit_error
                - not_found
                - provider_error
                - resource_lock
                - service_unavailable
                - state_conflict
                - state_invalid
                - transient_error
                - unknown_error
        ErrorFixCode:
            type: string
            description: Stable public instruction describing the caller's next safe action.
            # Clients automate remediation from this field; an invented value would make a generated
            # error unusable even when the surrounding JSON is structurally valid.
            enum:
                - abandon_request
                - authenticate_request
                - change_request_parameters
                - contact_customer_support
                - reduce_request_size
                - refresh_resource_state
                - repeat_same_request
                - resolve_account_configuration
                - retry_with_backoff
                - satisfy_precondition
                - use_allowed_method
                - use_authorized_credentials
                - use_different_provider_method
                - use_new_idempotency_key
                - use_supported_media_type
                - use_valid_api_key
        ErrorCode:
            type: string
            description: Stable public identifier for a documented endpoint or shared HTTP failure.
            # This union follows the documented catalog plus publicly routed handler and shared
            # HTTP codes. Internal-only endpoint codes stay private while Simile remains unable
            # to invent a value that a public Commerce API response can never emit.
            enum:
                - application_create_failed
                - application_create_unavailable
                - application_lookup_failed
                - application_update_failed
                - authentication_failed
                - cannot_change_price_amount
                - cannot_change_product_id
                - cannot_clear_field_once_set
                - cannot_update_immutable_field
                - capabilities_authentication_required
                - capabilities_scope_required
                - capabilities_temporarily_unavailable
                - capabilities_unavailable
                - checkout_amount_locked
                - checkout_amount_selection_failed
                - checkout_line_item_duplicate
                - checkout_line_item_invalid
                - checkout_line_item_not_found
                - checkout_order_not_found
                - checkout_payment_failed
                - checkout_reference_not_found
                - children_policy_invalid
                - children_policy_not_found
                - children_policy_request_failed
                - children_policy_required
                - children_policy_validation_unavailable
                - children_policy_version_conflict
                - chime_broadcast_already_canceled
                - chime_broadcast_already_completed
                - chime_broadcast_cancel_failed
                - chime_broadcast_failed
                - chime_broadcast_lookup_failed
                - chime_broadcast_not_found
                - chime_cooldown_active
                - chime_cooldown_unavailable
                - chime_lookup_failed
                - chime_not_found
                - chime_page_failed
                - chime_schedule_already_canceled
                - chime_schedule_already_completed
                - chime_schedule_cancel_failed
                - chime_schedule_failed
                - chime_schedule_lookup_failed
                - chime_schedule_not_found
                - chime_send_failed
                - confirmation_already_satisfied
                - confirmation_bad_token
                - confirmation_expired
                - confirmation_failed
                - confirmation_max_reached
                - confirmation_not_found
                - confirmation_not_needed
                - confirmation_pending
                - confirmation_request_failed
                - coupon_duplicate
                - coupon_not_applicable
                - coupon_not_found
                - coupon_unavailable
                - customer_not_found
                - customer_resolution_unavailable
                - customer_selected_amount_invalid
                - customer_selected_amount_required
                - customers_search_invalid
                - customers_search_response_unsafe
                - customers_search_unavailable
                - discount_duplicate
                - draft_mode_order_has_no_invoice
                - email_message_unsafe
                - email_recipient_domain_blocked
                - email_recipient_suppressed
                - email_sender_unauthorized
                - empty_file
                - endpoint_authentication_required
                - endpoint_authorization_denied
                - endpoint_caller_denied
                - endpoint_caller_required
                - endpoint_control_authentication_required
                - endpoint_control_denied
                - endpoint_control_unavailable
                - endpoint_unavailable
                - fa_is_payout_dest
                - file_api_unavailable
                - file_content_type_not_allowed
                - file_contents_unavailable
                - file_extension_not_allowed
                - file_has_live_references
                - file_link_access_denied
                - file_link_access_limit_reached
                - file_link_already_exists
                - file_link_delivery_invalid
                - file_link_expired
                - file_link_inactive
                - file_link_not_found
                - file_link_operation_failed
                - file_link_purpose_not_allowed
                - file_metadata_unavailable
                - file_name_mismatch
                - file_not_found
                - file_operation_failed
                - file_purpose_not_allowed
                - file_reference_reconcile_failed
                - file_row_limit_exceeded
                - file_schema_mismatch
                - file_size_mismatch
                - file_storage_encoding_unsupported
                - file_too_large
                - file_too_small
                - financial_account_not_found
                - financial_accounts_search_invalid
                - financial_accounts_search_response_unsafe
                - financial_accounts_search_unavailable
                - fixed_price_unavailable
                - ghana_bank_identifiers_conflict
                - idempotency_key_conflict
                - idempotency_key_generation_failed
                - idempotency_key_in_progress
                - idempotency_key_invalid
                - idempotency_key_mismatch
                - idempotency_key_unsupported
                - idempotency_scope_unavailable
                - idempotency_storage_unavailable
                - image_metadata_unreadable
                - invalid_chime_broadcast_request
                - invalid_chime_request
                - invalid_chime_schedule_request
                - invalid_line_items
                - invalid_otp_initiation_request
                - invalid_product_type
                - invalid_purchase_intent_quantity_range
                - invalid_purchase_intent_target
                - invalid_recipient
                - invalid_refund
                - invalid_request_body
                - invalid_request_parameter
                - invalid_response_projection
                - invalid_secret_key_request
                - message_template_archived
                - message_template_attachments_unsupported
                - message_template_channel_mismatch
                - message_template_create_failed
                - message_template_email_subject_empty
                - message_template_email_text_empty
                - message_template_email_unsafe
                - message_template_id_required
                - message_template_invalid
                - message_template_not_found
                - message_template_not_published
                - message_template_render_invalid
                - message_template_render_too_long
                - message_template_render_unsafe
                - message_template_request_invalid
                - message_template_required
                - message_template_sms_empty
